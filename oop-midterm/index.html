uns, printing \"Pet::eat\"","The program compiles and runs, printing \"Cat::eat\"","The program fails to compile because the method eat is not marked virtual in Cat.","Compilation error on Line A","Compilation error on Line B","Compilation error on Line C","The program fails to compile for some other reason.","The program compiles and crashes when it runs.","The program compiles and runs to completion without printing anything.","None of the above."],"answer":4,"explain":"Line B assigns a base pointer to a derived pointer, which does not compile. It makes no difference that the object really is a Cat: the compiler only looks at the pointer types. virtual has nothing to do with it, and leaving virtual off in Cat is never an error. This is the Fall 2025 version. Four earlier exams asked the same thing without line labels, where the answer was \"does not compile\" or \"fails to compile for some other reason\".","rule":"Derived* to Base* is automatic. Base* to Derived* never compiles without a cast."},{"id":"protected-ab","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2020",5],["F2014",10]],"prompt":"Given the code below, which of the following is true?","code":"class Base {\nprotected:\n    void protectedMethod();\n};\n\nclass Derived : public Base {\npublic:\n    void foo(Derived a) {\n        a.protectedMethod();  // line A\n    }\n};\n\nint main() {\n    Derived d;\n    d.protectedMethod();      // line B\n}","options":["line A will compile\nline B will compile","line A will compile\nline B will not compile","line A will not compile\nline B will compile","line A will not compile\nline B will not compile"],"answer":1,"explain":"Line A is inside a Derived member function and uses the protected member through a Derived object, which is allowed. It does not have to be the same object as this, just the same class. Line B is in main, which is outside the class hierarchy, so protected blocks it exactly as private would.","rule":"protected members are usable inside derived-class code, on objects of that derived class. Never from main."},{"id":"protected-base-ref","topic":"inh","kind":"new","basis":["run"],"exams":[],"prompt":"Which of the following is true about the code below?","code":"class Base {\nprotected:\n    int n = 0;\n};\n\nclass Derived : public Base {\npublic:\n    void f(Base& b)    { b.n = 1; }   // Line A\n    void g(Derived& d) { d.n = 2; }   // Line B\n};","options":["Line A will compile\nLine B will compile","Line A will compile\nLine B will not compile","Line A will not compile\nLine B will compile","Line A will not compile\nLine B will not compile"],"answer":2,"explain":"Inside Derived you can reach the protected member through a Derived (Line B). You cannot reach it through a plain Base reference (Line A), because that Base might be part of some unrelated derived class. This is the same rule behind the Fall 2023 dinosaur question.","rule":"Inside Derived, protected base members are reachable only through Derived objects, not through Base or sibling-class objects."},{"id":"dino-protected","topic":"inh","kind":"exam","basis":["run"],"exams":[["F2023",9]],"prompt":"Given the following code, what is the result of compiling and running the program?","code":"class Dinosaur {\npublic:\n    Dinosaur(string name) : name(name) {}\nprotected:\n    string name;\n};\n\nclass TRex : public Dinosaur {\npublic:\n    TRex(string name) : Dinosaur(name) {}\n    void attack(const TRex& trex) {\n        cout \u003c\u003c \"TRex \" \u003c\u003c name \u003c\u003c \" attacking TRex \" \u003c\u003c trex.name;      // Line A\n    }\n};\n\nclass Raptor : public Dinosaur {     // Line C\npublic:\n    Raptor(string name) :Dinosaur(name) {}\n\n    void attack(const TRex& trex) {\n        cout \u003c\u003c \"Raptor \" \u003c\u003c name \u003c\u003c \" attacking TRex \" \u003c\u003c trex.name;    // Line B\n    }\n\n    void attack(const Raptor& rap) {\n        cout \u003c\u003c \"Raptor \" \u003c\u003c name \u003c\u003c \" attacking Raptor \" \u003c\u003c rap.name;   // Line C\n    }\n};\n\nint main() {\n    TRex t(\"T\");                // Line D\n    Raptor rappy(\"Rappy\");      // Line E\n    Raptor rippy(\"Rippy\");      // Line F\n    rappy.attack(rippy);        // Line G\n}","options":["The program compiles, runs, and outputs:\nRaptor Rappy attacking Raptor Rippy","The program compiles, runs, and outputs:\nRaptor Rippy attacking Raptor Rappy","The program compiles, runs, and outputs:\nRaptor Rappy attacking Trex T","The program compiles and crashes when run.","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F","Compilation error at Line G","None of the above"],"answer":5,"explain":"name is protected in Dinosaur. Line A is fine: a TRex method reading another TRex. The second Line C is fine: a Raptor method reading another Raptor. Line B is a Raptor method reading trex.name. Raptor and TRex are siblings, and protected does not let you reach into a sibling class, so Line B does not compile. It does not matter that main never calls that overload: every function body has to compile. The student on this exam picked \"None of the above\" and lost the points. (The exam really did label two lines \"Line C\". Neither is an error.) Compiled with g++: the only error is on Line B.","rule":"Inside Derived, protected base members are reachable only through Derived objects, not through Base or sibling-class objects."},{"id":"cat-name-init","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["F2023",8]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"class Pet {\npublic:\n    Pet(string name) : name(name) {}                           // Line A\n    virtual void speak() { cout \u003c\u003c \"Pet speaking ...\"; }       // Line B\nprivate:\n    string name;\n};\n\nclass Cat : public Pet {\npublic:\n    Cat(string name) : name(name) {}                           // Line C\n    void speak() { cout \u003c\u003c \"Cat meowing ... \"; }               // Line D\n};\n\nint main() {\n    Pet* ptr = new Cat(\"Felix\");    // Line E\n    ptr->speak();                   // Line F\n}","options":["The program compiles and runs, printing \"Pet speaking ...\"","The program compiles and runs, printing \"Cat meowing ...\"","The program compiles and crashes when run.","The program compiles and runs without printing anything.","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F"],"answer":6,"explain":"Line C is wrong twice. An initialization list can only initialize the class's own members and its base class, and name is a member of Pet, not Cat (and private as well). And since the list never calls Pet(name), the compiler tries the Pet default constructor, which does not exist. The correct line is Cat(string name) : Pet(name) {}.","rule":"A derived constructor initializes inherited data by calling the base constructor in its initialization list: Derived(...) : Base(...)."},{"id":"base-no-default","topic":"inh","kind":"new","basis":["run"],"exams":[],"prompt":"What is the result of compiling and running the code?","code":"class Pet {\npublic:\n    Pet(string name) : name(name) {}      // Line A\nprivate:\n    string name;\n};\n\nclass Cat : public Pet {\npublic:\n    Cat(string name) { }                  // Line B\n};\n\nint main() {\n    Cat felix(\"Felix\");                   // Line C\n}","options":["The program compiles and runs with no output","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","The program compiles but has a run-time error"],"answer":2,"explain":"Every derived constructor builds its Base part first. Line B does not say which Pet constructor to use, so the compiler looks for Pet(), and there is none because Pet only has Pet(string). The fix is Cat(string name) : Pet(name) { }.","rule":"If the base class has no default constructor, every derived constructor must call a base constructor explicitly."},{"id":"slicing-fly","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["F2017",9],["F2018",8]],"prompt":"Given the classes below, what would be the result of running main?","code":"class FlyingMachine {\npublic:\n    FlyingMachine() {}\n    void fly() { cout \u003c\u003c \"In FlyingMachine fly()\"; }\n};\n\nclass HangGlider : public FlyingMachine {\npublic:\n    virtual void crash() { cout \u003c\u003c \"HangGlider crashing\"; }\n    void fly() { cout \u003c\u003c \"In HangGlider fly()\"; }\n};\n\nint main() {\n    HangGlider hanger;\n    FlyingMachine flier;\n    flier = hanger;\n    flier.fly();\n}","options":["The program runs and prints: In HangGlider fly()","The program runs and prints: In FlyingMachine fly()","Runtime error.","Compilation error because hanger cannot be assigned to flier.","Compilation error because fly is not virtual.","Other compilation error.","None of the above"],"answer":1,"explain":"Assigning a derived object to a base object is legal. It copies only the FlyingMachine part and the rest is sliced off. flier is still a FlyingMachine object, so flier.fly() runs the FlyingMachine version. This would be true even if fly were virtual, because there is no pointer or reference involved. The student on the 2017 exam picked \"cannot be assigned\" and lost the points.","rule":"Assigning or copying a Derived into a Base object slices it. The result is a plain Base."},{"id":"slice-by-value","topic":"inh","kind":"new","basis":["run"],"exams":[],"prompt":"What is the output of the following program?","code":"class Pet {\npublic:\n    virtual void speak() const { cout \u003c\u003c \"Pet \"; }\n};\n\nclass Cat : public Pet {\npublic:\n    void speak() const { cout \u003c\u003c \"Cat \"; }\n};\n\nvoid byValue(Pet p) { p.speak(); }\nvoid byRef(const Pet& p) { p.speak(); }\n\nint main() {\n    Cat felix;\n    byValue(felix);\n    byRef(felix);\n}","options":["Pet Pet","Pet Cat","Cat Pet","Cat Cat","The program fails to compile","Runtime error (or undefined behavior)"],"answer":1,"explain":"byValue takes a Pet by value, so the parameter is a brand new Pet object copied from the Pet part of felix. It is sliced, and even a virtual call on it prints Pet. byRef takes a reference, so p refers to the real Cat and the virtual call prints Cat.","rule":"Virtual dispatch needs a pointer or a reference. Pass by value and you get a sliced Base."},{"id":"hiding-starship","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2020",10],["S2019",10]],"prompt":"Given the classes below, what would be the result of running main?","code":"class FederationStarship {\npublic:\n    FederationStarship() {}\n    void attack(string weapon) {\n        cout \u003c\u003c \"FederationStarship firing \" \u003c\u003c weapon;\n    }\n};\n\nclass Constitution : public FederationStarship {\npublic:\n    virtual void transport() { cout \u003c\u003c \"Beam me up!\"; }\n    void attack() {\n        cout \u003c\u003c \"Constitution firing photon torpedos\";\n    }\n};\n\nint main() {\n    Constitution* NCC_1701 = new Constitution();\n    NCC_1701->attack(\"phasers\");\n}","options":["The program runs and prints:\nBeam me up!","The program runs and prints:\nFederationStarship firing phasers","The program runs and prints:\nConstitution firing photon torpedos","The program compiles but has a runtime error","Compilation error because there is no Constitution constructor","Compilation error other than (e).","None of the above"],"answer":5,"explain":"The pointer is a Constitution*, so the compiler looks up attack in Constitution first. It finds attack() with no parameters and stops looking. That hides the base-class attack(string), so passing \"phasers\" does not match anything and the call fails to compile. Different parameters do not make it an overload across classes: the derived name hides the base name completely.","rule":"A function in the derived class hides every base-class function with the same name, whatever their parameters."},{"id":"bridge-downcast","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2023",8]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"class Bridge {\npublic:\n    virtual void close() { cout \u003c\u003c \"closing...\"; }   // Line 1\n};\n\nclass SwingBridge : public Bridge {\npublic:\n    void swing() { cout \u003c\u003c \"opening... \"; }          // Line 2\n};\n\nint main() {\n    SwingBridge* ptr = new Bridge();    // Line 3\n    ptr->swing();                       // Line 4\n}","options":["The program compiles and runs, printing \"opening...\"","The program compiles and runs, printing \"closing...\"","The program compiles and crashes when run.","The program compiles and runs to completion without printing anything.","Compilation error at Line 1","Compilation error at Line 2","Compilation error at Line 3","Compilation error at Line 4","None of the above"],"answer":6,"explain":"new Bridge() gives a Bridge*. Line 3 tries to store it in a SwingBridge*, which is base-to-derived and never compiles without a cast. A plain Bridge is not a SwingBridge. Line 4 would be fine by itself, because SwingBridge does have swing. The Gradescope rubric confirms Line 3.","rule":"Derived* to Base* is automatic. Base* to Derived* never compiles without a cast."},{"id":"protected-main","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["F2025",5],["S2019",5],["S2014",11]],"prompt":"Given the code below, which of the following is true?","code":"class Base {\nprotected:\n    void protectedMethod() { }\n};\n\nclass Derived : public Base { };\n\nint main() {\n    Base b;\n    b.protectedMethod();   // line A\n    Derived d;\n    d.protectedMethod();   // line B\n}","options":["line A will compile\nline B will compile","line A will compile\nline B will not compile","line A will not compile\nline B will compile","line A will not compile\nline B will not compile","None of the above"],"answer":3,"explain":"Both calls are in main, which is outside the class and outside every derived class. From there protected behaves exactly like private, on a Base object and on a Derived object alike. Neither line compiles. Two different students picked \"A compiles, B does not\" and lost the points. Do not confuse this with the fall version, where line A is inside a Derived method and does compile.","rule":"protected members are usable inside derived-class code, on objects of that derived class. Never from main."},{"id":"ctor-not-inherited","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["F2025",10]],"prompt":"What is the result of building and running the following program?","code":"class Base {\npublic:\n    Base(string s) : name(s) {}\n    void foo() const {\n        cout \u003c\u003c name \u003c\u003c endl;      // Line A\n    }\nprivate:\n    string name;\n};\n\nclass Derived : public Base { };\n\nint main() {\n    Base base(\"Fred\");          // Line B\n    Derived der(\"Mary\");        // Line C\n    base.foo();                 // Line D\n    der.foo();                  // Line E\n    base = der;                 // Line F\n    base.foo();                 // Line G\n}","options":["Output:\nFred\nMary\nFred","Output:\nFred\nMary\nMary","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F","Compilation error at Line G","Runtime error when attempting to assign der to base.","Other runtime error","None of the above"],"answer":4,"explain":"Constructors are not inherited. Derived declares no constructors, so the only one it could have is the automatic default constructor, and even that cannot be generated because Base has no default constructor. There is no Derived(string), so Line C does not compile. Everything else would be fine: der.foo() is an inherited public method, and base = der is legal slicing. The Gradescope rubric confirms Line C.","rule":"Methods are inherited, constructors are not. A derived class must write its own and pass the arguments up: Derived(string s) : Base(s) {}."},{"id":"slicing-virtual","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2012",7]],"prompt":"Given the classes below, what would be the result of running main?","code":"class Animal {\npublic:\n    Animal() {}\n    virtual void sleep() { cout \u003c\u003c \"In Animal sleep()\"; }\n};\n\nclass Cat : public Animal {\npublic:\n    virtual void eat() { cout \u003c\u003c \"In Cat eat()\"; }\n    void sleep() { cout \u003c\u003c \"In Cat sleep()\"; }\n};\n\nint main() {\n    Cat cat;\n    Animal animal;\n    animal = cat;\n    animal.sleep();\n}","options":["The program runs and prints: In Cat sleep()","The program runs and prints: In Animal sleep()","Runtime error","Compilation error because there is no Cat constructor","Compilation error because Animal cannot be assigned to Cat.","None of the above"],"answer":1,"explain":"sleep is virtual here, but that does not help. animal is an Animal object, not a pointer or a reference. The assignment copies only the Animal part of cat and the object stays an Animal, so animal.sleep() runs the Animal version. Virtual dispatch only shows up through pointers and references.","rule":"Assigning or copying a Derived into a Base object slices it. The result is a plain Base, even for virtual methods."},{"id":"slice-crash","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2020",9],["S2019",9]],"prompt":"Given the classes below, what would be the result of running main? (Compare the last line with the fall version.)","code":"class FlyingMachine {\npublic:\n    FlyingMachine() {}\n    void fly() { cout \u003c\u003c \"In FlyingMachine fly()\"; }\n};\n\nclass HangGlider : public FlyingMachine {\npublic:\n    virtual void crash() { cout \u003c\u003c \"HangGlider crashing\"; }\n    void fly() { cout \u003c\u003c \"In HangGlider fly()\"; }\n};\n\nint main() {\n    HangGlider hanger;\n    FlyingMachine flier;\n    flier = hanger;\n    flier.crash();\n}","options":["The program runs and prints:\nIn HangGlider fly()","The program runs and prints:\nIn FlyingMachine fly()","The program runs and prints:\nIn HangGlider crashing()","Runtime error.","Compilation error because hanger cannot be assigned to flier.","Compilation error because fly is not virtual.","None of the above"],"answer":6,"explain":"The last line calls crash, not fly. flier is a FlyingMachine, and FlyingMachine has no crash method, so the program does not compile. None of the listed options describes that (the two compile-error options give wrong reasons), so the answer is None of the above. The Spring 2019 student answered from memory of the fly version, picked \"In FlyingMachine fly()\" and lost the points.","rule":"After slicing, the object is a plain Base. It only has the methods Base declares."},{"id":"virtual-in-derived","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["F2014",8]],"prompt":"What is the result of compiling and running the following program?","code":"class Base {\npublic:\n    void method() { cout \u003c\u003c \"method1\\n\"; }\n};\nclass Derived : public Base {\npublic:\n    virtual void method() { cout \u003c\u003c \"method2\\n\"; }\n};\n\nint main() {\n    Base* bp = new Derived();\n    bp->method();\n}","options":["The program compiles and prints \"method1\"","The program compiles and prints \"method2\"","The program compiles and runs to completion without printing anything.","The program compiles and crashes when it runs.","The program does not compile.","None of the above."],"answer":0,"explain":"The call goes through a Base*, so the compiler looks at how Base declares method. In Base it is not virtual, so the Base version is chosen at compile time. Adding virtual in Derived only matters for classes that derive from Derived. The student wrote \"needs to be virtual\" next to the Base line, which is the point.","rule":"virtual has to be on the method in the class of the pointer you call through. Adding it lower down is too late."},{"id":"nonvirtual-parent","topic":"virt","kind":"exam","basis":["run"],"exams":[["F2023",3]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"class Parent {\npublic:\n    void display() const { cout \u003c\u003c \"Parent \"; }             // Line A\n};\n\nclass Child : public Parent {\npublic:\n    virtual void display() const { cout \u003c\u003c \"Child \"; }      // Line B\n};\n\nclass Grandchild : public Child {\npublic:\n    void display() { cout \u003c\u003c \"Grandchild \"; }               // Line C\n};\n\nint main() {\n    Child c;\n    Grandchild gc;          // Line D\n    Parent* par = &c;       // Line E\n    par->display();         // Line F\n    par = &gc;              // Line G\n    par->display();         // Line H\n}","options":["The program will output: Child Grandchild","The program will output: Parent Parent","The program will output: Child Child","The program will output: Parent Child","The program will compile and not output anything","The program will compile, but will crash when run","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F","Compilation error at Line G","None of the above"],"answer":1,"explain":"Both calls go through a Parent*. In Parent, display is not virtual, so the compiler picks Parent::display at compile time, both times: Parent Parent. The virtual on Line B and the missing const on Line C are distractions, because neither can affect a call made through a Parent*. This is the 2014 \"virtual only in the derived class\" question with an extra level. The student on this exam picked \"Child Child\" and lost the points. Compiled and run: it prints Parent Parent.","rule":"virtual has to be on the method in the class of the pointer you call through. Adding it lower down is too late."},{"id":"rooftile","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["F2023",4]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"class Tile{\npublic:\n    Tile(double len) :len(len) { }\n\n    void computeArea() { display(len*len); }\n\n    virtual void display(double area) const {\n        cout \u003c\u003c \"Tile area: \" \u003c\u003c area \u003c\u003c endl;\n    }\nprivate:\n    double len;\n};\n\nclass RoofTile : public Tile {\npublic:\n    RoofTile(double len) : Tile(len) { }\n\n    virtual void display(double area) const {\n        cout \u003c\u003c \"Roof tile area: \" \u003c\u003c area \u003c\u003c endl;\n    }\n};\n\nint main() {\n    Tile* tile = new RoofTile(2);\n    tile->computeArea();\n    delete tile;\n}","options":["The program runs and outputs: Tile area: 4","The program runs and outputs: Roof tile area: 4","The program runs and outputs:\nTile area: 4\nRoof tile area: 4","The program runs and outputs:\nRoof tile area: 4\nTile area: 4","The program compiles but has a run-time error","Compilation error","None of the above"],"answer":1,"explain":"computeArea is a non-virtual method inherited from Tile, and it runs on the RoofTile object. Inside it, display(len*len) really means this->display(...), and display is virtual, so the call goes to the real object's version: RoofTile::display. A base-class method can call a derived-class override this way. The answer was marked correct on the exam.","rule":"A virtual call inside a base-class method still goes to the real object's override. this is a pointer too."},{"id":"ggc","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["F2023",11]],"prompt":"Given the following code, what is the result of compiling and running the program?","code":"class Parent {\npublic:\n    virtual void display() const { cout \u003c\u003c \"Parent \"; }\n};\n\nclass Child : public Parent {\npublic:\n    void display() { cout \u003c\u003c \"Child \"; }\n};\n\nclass Gc : public Child {\npublic:\n    void display() { cout \u003c\u003c \"Gc \"; }\n};\n\nclass GGc : public Gc {\npublic:\n    void display() const { cout \u003c\u003c \"GGc \"; }\n};\n\nint main() {\n    vector\u003cParent*> vp;\n    vp.push_back(new Parent);\n    vp.push_back(new Child);\n    vp.push_back(new Gc);\n    vp.push_back(new GGc);\n    for (Parent* ptr : vp) {\n        ptr->display();\n    }\n}","options":["The program runs and prints: Parent Child Gc GGc","The program runs and prints: Parent Parent Parent Parent","The program runs and prints: Parent Parent Child Child","The program runs and prints: Parent Parent Parent Child","The program runs and prints: Parent Parent Parent Gc","The program runs and prints: Parent Parent Parent GGc","The program runs and prints: Parent Child Child Gc","The program runs but immediately causes a run-time error","The program fails to compile"],"answer":5,"explain":"The virtual method is display() const. Child and Gc declare display() without const. That is a different signature, so they do not override anything: they are new, unrelated functions that are invisible through a Parent*. For those two objects the newest real override is still Parent's. GGc declares display() const, which matches exactly, so it does override. Result: Parent Parent Parent GGc.","rule":"To override, the signature must match exactly, including const. A mismatch creates a separate function that hides instead."},{"id":"const-mismatch","topic":"virt","kind":"new","basis":["run"],"exams":[],"prompt":"What is the output of the following program?","code":"class Base {\npublic:\n    virtual void show() const { cout \u003c\u003c \"Base \"; }\n};\n\nclass Derived : public Base {\npublic:\n    void show() { cout \u003c\u003c \"Derived \"; }\n};\n\nint main() {\n    Derived d;\n    Base* bp = &d;\n    bp->show();\n    d.show();\n}","options":["Base Base","Base Derived","Derived Derived","Derived Base","The program fails to compile","Runtime error (or undefined behavior)"],"answer":1,"explain":"Derived::show() is missing const, so it does not override Base::show() const. Through the Base*, the only show the compiler knows is the const one, and the newest override of it is Base's own: Base. Calling d.show() directly looks the name up in Derived first, finds the non-const version, and prints Derived.","rule":"To override, the signature must match exactly, including const. A mismatch creates a separate function that hides instead."},{"id":"override-kw","topic":"virt","kind":"new","basis":["run"],"exams":[],"prompt":"What is the result of compiling and running the following program?","code":"class Base {\npublic:\n    virtual void show() const { cout \u003c\u003c \"Base\"; }\n};\n\nclass Derived : public Base {\npublic:\n    void show() override { cout \u003c\u003c \"Derived\"; }     // Line A\n};\n\nint main() {\n    Base* bp = new Derived();                       // Line B\n    bp->show();                                     // Line C\n}","options":["The program prints: Base","The program prints: Derived","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C"],"answer":2,"explain":"override asks the compiler to check that this method really overrides a virtual method in a base class. Base has show() const, and this one is show() without const, so nothing is overridden and Line A is an error. Without the override keyword it would compile and print Base, which is the silent bug that override exists to catch.","rule":"override turns a signature mismatch into a compile error instead of a silent hide."},{"id":"crash","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["F2025",6],["S2018",7],["F2017",8],["S2012",6],["S2011",5]],"prompt":"What would be the result of building and running the following program?","code":"class FederationStarship {\npublic:\n    FederationStarship() {}\n    void attack() { cout \u003c\u003c \"FederationStarship firing phasers\"; }\n};\n\nclass Constitution : public FederationStarship {\npublic:\n    virtual void transport() { cout \u003c\u003c \"Beam me up!\"; }\n    void attack() { cout \u003c\u003c \"Constitution firing phasers\"; }\n};\n\nint main() {\n    FederationStarship* NCC_1701 = new Constitution();\n    NCC_1701->transport();\n}","options":["The program runs and prints:\nBeam me up!","The program runs and prints:\nFederationStarship firing phasers","The program runs and prints:\nConstitution firing phasers","Compilation error because there is no Constitution constructor","Other compilation error","The program compiles but has a runtime error","None of the above"],"answer":4,"explain":"The pointer type is FederationStarship*, and FederationStarship has no method called transport, so the call does not compile. The compiler only lets you call what the pointer's own class declares, even when the real object has more. The \"no Constitution constructor\" option is wrong because Constitution gets a default constructor automatically. This is the Fall 2025 version. The same question appeared with HangGlider::crash() in Fall 2017, with Cat::eat() in Spring 2012 and with Derived::foo() in Spring 2011.","rule":"Through a Base* you can only call methods that Base itself declares. The compiler checks the pointer type, not the object."},{"id":"virtual-protected-n","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["F2018",7],["F2017",10]],"prompt":"What is the result of compiling and running the code below?","code":"class Base {\npublic:\n    virtual void display() { cout \u003c\u003c \"Base: \" \u003c\u003c n \u003c\u003c endl; }\nprotected:\n    int n = 42;\n};\n\nclass Derived : public Base {\npublic:\n    virtual void display() { cout \u003c\u003c \"Derived: \" \u003c\u003c n \u003c\u003c endl; }\n};\n\nint main() {\n    Base* base = new Derived();\n    base->display();\n}","options":["Outputs:\nBase: 42","Outputs:\nDerived: 42","Fails to compile because the member variable n is protected.","Fails to compile because display is marked virtual in Derived.","Runtime error (or undefined behavior)","None of the above."],"answer":1,"explain":"Nothing is wrong here. display is virtual in Base and Derived overrides it with the same signature, so the call through Base* runs the Derived version. Derived may read n because protected members are visible in derived classes. Repeating virtual in Derived is allowed, and giving n a value in the class body is allowed. Fall 2017 asked nearly the same question with n = 5 and a Derived object instead of a pointer, with the answer \"Derived: 5\".","rule":"Virtual in Base plus a matching signature in Derived plus a call through a pointer or reference gives the Derived version."},{"id":"upcast-cat","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["S2019",6],["S2018",5]],"prompt":"What is the result of compiling and running the following program? (Check which way the pointer assignment goes.)","code":"class Pet {\npublic:\n    virtual void eat() { cout \u003c\u003c \"Pet::eat\\n\"; }\n};\n\nclass Cat : public Pet {\npublic:\n    void eat() { cout \u003c\u003c \"Cat::eat\\n\"; }\n};\n\nint main() {\n    Cat* catP = new Cat();\n    Pet* petP = catP;\n    petP->eat();\n}","options":["The program compiles and runs, printing \"Pet::eat\"","The program compiles and runs, printing \"Cat::eat\"","The program compiles and runs to completion without printing anything.","The program compiles and crashes when it runs.","The program does not compile.","None of the above."],"answer":1,"explain":"This is the legal direction. A Cat* converts to a Pet* automatically, because every Cat is a Pet. Then eat is virtual in Pet and Cat overrides it, so the call through the Pet* runs the Cat version. The fall exams reverse the two lines (Cat* catP = petP), and that version does not compile.","rule":"Derived* to Base* is automatic. Base* to Derived* never compiles without a cast."},{"id":"base-nonvirtual-n","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["S2019",8],["S2018",8]],"prompt":"What is the result of compiling and running the code below?","code":"class Base {\npublic:\n    void display() { cout \u003c\u003c \"Base: \" \u003c\u003c n \u003c\u003c endl; }\nprotected:\n    int n = 42;\n};\n\nclass Derived : public Base {\npublic:\n    virtual void display() { cout \u003c\u003c \"Derived: \" \u003c\u003c n \u003c\u003c endl; }\n};\n\nint main() {\n    Base* der = new Derived();\n    der->display();\n}","options":["Outputs:\nBase: 42","Outputs:\nDerived: 42","Fails to compile because the member variable n is being set in the protected section, instead of in the constructor.","Fails to compile because the member variable n is protected.","Fails to compile because display is not marked virtual in Base.","Runtime error (or undefined behavior)","None of the above."],"answer":0,"explain":"The call goes through a Base*, and in Base display is not virtual. So the Base version is chosen at compile time: Base: 42. The virtual keyword in Derived comes too late to affect a Base pointer. Nothing here is a compile error. The fall version has virtual on the Base method instead, and there the answer is Derived: 42. The Spring 2019 student picked a compile error and lost the points.","rule":"virtual has to be on the method in the class of the pointer you call through. Adding it lower down is too late."},{"id":"check-status","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["S2023",4]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"class Parent {\npublic:\n    Parent() {}\n    virtual void test(const string& status) const {\n        cout \u003c\u003c \"Parent's status: \" \u003c\u003c status;\n    }\n};\n\nclass Child : public Parent {\npublic:\n    void test(const string& status) const override {\n        cout \u003c\u003c \"Child's status: \" \u003c\u003c status;\n    }\n};\n\nvoid check(const Parent& w, const string& status) {\n    w.test(status);\n}\n\nint main() {\n    Parent* ptr = new Child;\n    string stat_str = \"okay..\";\n    check(*ptr, stat_str);\n}","options":["The program runs and outputs: Parent's status: okay..","The program runs and outputs: Child's status: okay..","The program runs and outputs: Parent's status:","The program runs and outputs: Child's status:","The program compiles but has a run-time error","Compilation error because there is no Child constructor","Any other compilation error","None of the above"],"answer":1,"explain":"Everything lines up. test is virtual in Parent, Child overrides it with an identical signature (the override keyword would have caught a mismatch), and check receives the object by reference, so there is no slicing. *ptr is the Child object, and w.test(status) runs the Child version with the full string. Child gets a default constructor automatically.","rule":"Virtual in Base plus a matching signature in Derived plus a call through a pointer or reference gives the Derived version."},{"id":"soda","topic":"virt","kind":"exam","basis":["run"],"exams":[["S2023",3]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"class SoftDrink {\npublic:\n    virtual void display() const = 0;                          // Line A\n};\n\nclass Soda : public SoftDrink {\npublic:\n    void display() const override { cout \u003c\u003c \"Soda \"; }         // Line B\n};\n\nclass GingerAle : public Soda {\npublic:\n    void display() { cout \u003c\u003c \"GingerAle \"; }                   // Line C\n};\n\nint main() {\n    GingerAle ga;           // Line D\n    Soda* sd = &ga;         // Line E\n    sd->display();          // Line F\n    ga.display();           // Line G\n}","options":["The program will output: GingerAle GingerAle","The program will output: Soda GingerAle","The program will output: Soda Soda","The program will output: GingerAle Soda","The program will compile and not output anything","The program will compile, but will crash when run","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F","Compilation error at Line G","None of the above"],"answer":1,"explain":"GingerAle::display() is missing const, so it does not override display() const. It is a separate function. Through the Soda*, the compiler only sees display() const, whose newest override is Soda's: Soda. Calling ga.display() directly looks in GingerAle first, finds the non-const version, and prints GingerAle. GingerAle is not abstract because Soda already overrode the pure virtual method. The scanned student got this wrong and the rubric does not show the answer, so this comes from compiling and running the code.","rule":"To override, the signature must match exactly, including const. A mismatch creates a separate function that hides instead."},{"id":"dino-battle","topic":"virt","kind":"exam","basis":["run"],"exams":[["S2023",9]],"prompt":"Given the following code, what is the result of compiling and running the program?","code":"class Dinosaur {\npublic:\n    virtual void attack(Dinosaur& dino) {\n        cout \u003c\u003c \"Dino attacking! \";     // Line A\n    }\n};\n\nclass TRex : public Dinosaur {\n    void attack(Dinosaur& dino) {\n        cout \u003c\u003c \"TRex attacking! \";     // Line B\n    }\n};\n\nclass Raptor: public Dinosaur {         // Line C\n};\n\nvoid battle(Dinosaur& d1, Dinosaur& d2) {\n    d1.attack(d2);      // Line D\n    d2.attack(d1);      // Line E\n}\n\nint main() {\n    TRex t;             // Line F\n    Raptor rappy;       // Line G\n\n    battle(t, rappy);   // Line H\n}","options":["The program compiles, runs, and outputs:\nDino attacking! TRex attacking!","The program compiles, runs, and outputs:\nTRex attacking! Raptor attacking!","The program compiles, runs, and outputs:\nTRex attacking! Dino attacking!","The program compiles and crashes when run.","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F","Compilation error at Line G","Compilation error at Line H","None of the above"],"answer":2,"explain":"The distraction is that TRex::attack is private (TRex has no public: label). That does not matter here. Access is checked at compile time against the declared type, and d1 and d2 are declared Dinosaur&, where attack is public. Which version runs is decided at run time: d1 is really a TRex, so TRex attacking! prints. d2 is a Raptor, which did not override attack, so it uses the inherited one: Dino attacking!. An empty class body at Line C is fine. The scanned student got this wrong and the rubric does not show the answer, so this comes from compiling and running the code.","rule":"public and private are checked on the declared type at compile time. Which override runs is chosen from the real object at run time."},{"id":"ctor-virtual","topic":"virt","kind":"exam","basis":["key","run"],"exams":[["S2015",11],["S2012",8]],"prompt":"What is the result of compiling and running the following program?","code":"class Shape {\npublic:\n    Shape() { display(); }\n    virtual void display() { cout \u003c\u003c \"Shape\"; }\n};\n\nclass Square : public Shape {\npublic:\n    void display() { cout \u003c\u003c \"Square\"; }\n};\n\nint main() {\n    Square sq;\n}","options":["The program runs and prints:\nShape","The program runs and prints:\nSquare","The program runs and prints:\nShapeSquare","The program runs and prints:\nSquareShape","Fails to compile because Square constructor is not defined","Fails to compile for a reason other than (e)","Crashes at runtime","None of the above"],"answer":0,"explain":"Creating a Square runs the Shape constructor first. At that moment the Square part does not exist yet, so while a base-class constructor is running the object counts as a Shape, and the virtual call inside it runs Shape::display. The Square override is never reached. Square gets a default constructor automatically. Both students who had this question got it wrong (one picked Square, one picked a compile error), and both graders circled Shape.","rule":"Inside a constructor, a virtual call runs the version belonging to the class being constructed, never a derived override."},{"id":"pure-grandchild","topic":"abs","kind":"exam","basis":["key","run"],"exams":[["S2018",3],["F2017",5],["F2018",3]],"prompt":"What will happen when we build and run the program?","code":"class Parent {\npublic:\n    virtual void foo() = 0;\n};\n\nclass Child : public Parent {\npublic:\n    void foo() { cout \u003c\u003c \"Parent\\n\"; }     // Line A\n};\n\nclass GrandChild : public Child { };\n\nint main() {\n    GrandChild gc;                         // Line B\n    gc.foo();                              // Line C\n}","options":["It will fail to compile at line A, because foo is not marked virtual","It will fail to compile at line B because GrandChild is an abstract class.","It will fail to compile at line C because foo is an abstract method.","It will fail to compile for some other reason","It will print out:\nParent","It will print out:\nChild","It will compile, but will crash when run.","None of the above"],"answer":4,"explain":"Child overrides the pure virtual foo, so Child is no longer abstract, and GrandChild inherits that override, so it is not abstract either. foo stays virtual in Child without the keyword being repeated. Then read the string literally: Child::foo prints the word \"Parent\". Spring 2018 had the same trick string. Fall 2018 changed the string to \"Child\" and the answer changed to match, so do not answer from memory.","rule":"Once any ancestor overrides a pure virtual method, every class below it is concrete. Always read what the string actually says."},{"id":"pure-with-def","topic":"abs","kind":"exam","basis":["key","run"],"exams":[["F2023",5]],"prompt":"Given the code below, what will be output by compiling and executing the code?","code":"class Parent {\npublic:\n    virtual void display() const = 0;                          // Line A\n};\nvoid Parent::display() const { cout \u003c\u003c \"Parent\"; }             // Line B\n\nclass Child : public Parent {\npublic:\n    void display() const { cout \u003c\u003c \"Child \"; }                 // Line C\n};\n\nint main() {\n    Child child;                // Line D\n    Parent* pp = &child;        // Line E\n    pp->display();              // Line F\n}","options":["Parent","Child","Compilation error at line A","Compilation error at line B","Compilation error at line C","Compilation error at line D","Compilation error at line E","Compilation error at line F","None of the above"],"answer":1,"explain":"A pure virtual method is allowed to have a definition written outside the class, so Line B is legal. It does not stop Parent from being abstract. Child overrides display with a matching signature (const included), so Child is concrete and the virtual call through Parent* prints Child. A pointer to an abstract class is fine: you just cannot create a Parent object.","rule":"A pure virtual method may have a body. The class is still abstract, and pointers to it are still fine."},{"id":"abstract-child","topic":"abs","kind":"new","basis":["run"],"exams":[],"prompt":"What will happen when we build and run the program?","code":"class Parent {\npublic:\n    virtual void foo() = 0;\n};\n\nclass Child : public Parent { };                      // Line A\n\nclass GrandChild : public Child {\npublic:\n    void foo() { cout \u003c\u003c \"GrandChild\\n\"; }            // Line B\n};\n\nint main() {\n    GrandChild gc;       // Line C\n    Child c;             // Line D\n    gc.foo();            // Line E\n}","options":["It will print out: GrandChild","It will fail to compile at Line A","It will fail to compile at Line B","It will fail to compile at Line C","It will fail to compile at Line D","It will fail to compile at Line E"],"answer":4,"explain":"Child does not override foo, so Child is still abstract. Defining an abstract class is fine (Line A). Creating an object of one is not (Line D). GrandChild does override foo, so GrandChild is concrete and Line C is fine.","rule":"A class is abstract until every inherited pure virtual method has been overridden. You cannot create objects of an abstract class."},{"id":"pure-virtual-force","topic":"abs","kind":"adapted","basis":["key","run"],"mono":true,"exams":[["S2012",5],["S2011",10]],"prompt":"We want to be sure that all classes that inherit from BaseClass override the method foo(). Which replacement for the declaration of foo guarantees that?","code":"class BaseClass {\npublic:\n    void foo() const;\n};","options":["virtual void foo() const = 0;","virtual void foo() const;","void foo() const = 0;","void foo() const override;","explicit void foo() const;"],"answer":0,"explain":"Making foo pure virtual (virtual ... = 0) makes BaseClass abstract. Any derived class that does not override foo is abstract too, so nobody can create objects of it. Plain virtual only allows overriding, it does not require it. The = 0 is only legal on a virtual method. On the Spring 2012 exam the student wrote only virtual, lost 2 points, and the grader wrote in the = 0.","rule":"Pure virtual (virtual ... = 0) forces every concrete derived class to override the method."},{"id":"grandchild-override","topic":"abs","kind":"exam","basis":["key","run"],"exams":[["F2025",3],["S2019",3]],"prompt":"What is the result of building and running the following program?","code":"class Parent {\npublic:\n    virtual void foo() = 0;\n};\n\nclass Child : public Parent {\npublic:\n    void foo() override { cout \u003c\u003c \"Child\\n\"; }\n};\n\nclass GrandChild : public Child {\npublic:\n    void foo() override { cout \u003c\u003c \"GrandChild\\n\"; }      // Line A\n};\n\nint main() {\n    GrandChild gc;          // Line B\n    Child* cp = &gc;\n    gc.foo();               // Line C\n    cp->foo();              // Line D\n}","options":["It will fail to compile at line A, because foo is NOT marked virtual in Child","It will fail to compile at line B because GrandChild is an abstract class.","It will fail to compile at lines C and D because foo is an abstract method.","It will fail to compile for some other reason","It will compile, but will crash when run.","It will print out:\nChild\nChild","It will print out:\nChild\nGrandChild","It will print out:\nGrandChild\nChild","It will print out:\nGrandChild\nGrandChild","None of the above"],"answer":8,"explain":"Once a method is virtual in a base class it stays virtual all the way down, whether or not the keyword is repeated. So foo is virtual in Child, and GrandChild's override at line A is legal. Both classes override the pure virtual method, so neither is abstract. gc.foo() is called on a GrandChild object, and cp->foo() is a virtual call on the same object through a Child*. Both print GrandChild.","rule":"Virtual is inherited: once virtual in a base class, the method is virtual in every descendant."},{"id":"pure-inherited-ptr","topic":"abs","kind":"exam","basis":["run"],"exams":[["S2020",3]],"prompt":"What will happen when we build and run the program?","code":"class Parent {\npublic:\n    virtual void Thing() = 0;                       // Line A\n};\n\nclass Child : public Parent {\npublic:\n    void Thing() { cout \u003c\u003c \"Child\\n\"; }             // Line B\n};\n\nclass GrandChild : public Child { };\n\nint main() {\n    GrandChild gc;                                  // Line C\n    Parent* pp = &gc;                               // Line D\n    pp->Thing();                                    // Line E\n    gc.Thing();                                     // Line F\n}","options":["It will fail to compile at line A","It will fail to compile at line B","It will fail to compile at line C","It will fail to compile at lines D and E","It will fail to compile at line F","It will compile, but will crash when run.","It will print out:\nChild\nChild","It will print out:\nChild\nGrandChild","It will print out:\nGrandChild\nChild","It will print out:\nGrandChild\nGrandChild","None of the above"],"answer":6,"explain":"GrandChild has no method of its own, so it inherits Child's. Child overrode the pure virtual method, which makes both Child and GrandChild concrete. A pointer to the abstract Parent is fine. Both calls end up at the only implementation there is, Child's, so Child prints twice. Nothing prints the word GrandChild because no code contains it. The Spring 2020 copy is a blank exam with no answer key, so this answer comes from compiling and running the code.","rule":"Once any ancestor overrides a pure virtual method, every class below it is concrete. Always read what the string actually says."},{"id":"pure-instantiate","topic":"abs","kind":"exam","basis":["key","run"],"exams":[["S2023",11]],"prompt":"Given the following code, what is the result of compiling and running the program?","code":"class Pet {\npublic:\n    virtual void eat() = 0;                         // Line A\n};\n\nvoid Pet::eat() { cout \u003c\u003c \"Pet::eat\"; }\n\nclass Cat : public Pet {\npublic:\n    void eat() { cout \u003c\u003c \"Cat::eat\"; }              // Line B\n};\n\nint main() {\n    Pet* petP = new Pet();                          // Line C\n    Cat* catP = new Cat();                          // Line D\n    petP->eat();                                    // Line E\n    catP->eat();                                    // Line F\n}","options":["The program will output: Pet::eat","The program will output: Cat::eat","The program will compile and not output anything","The program will compile, but will crash when run","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line D","Compilation error at Line E","Compilation error at Line F","All of the above","None of the above"],"answer":6,"explain":"Pet has a pure virtual method, so Pet is abstract and new Pet() at Line C does not compile. Giving the pure virtual method a body outside the class is legal, and it does not make the class any less abstract. A Pet* variable is fine, it is creating the Pet object that is forbidden. The Gradescope rubric confirms Line C.","rule":"A class is abstract until every inherited pure virtual method has been overridden. You cannot create objects of an abstract class."},{"id":"func-overload-2012","topic":"ovl","kind":"exam","basis":["key","run"],"exams":[["S2015",10],["S2014",10],["F2012",11]],"prompt":"What is the result of the following?","code":"class Base {\npublic:\n    virtual void foo() { cout \u003c\u003c \" - Base::foo()\\n\"; }\n};\nclass Derived : public Base {\npublic:\n    void foo() { cout \u003c\u003c \" - Derived::foo()\\n\"; }\n};\n\nvoid func(Base& arg) {\n    cout \u003c\u003c \"func(Base)\";\n    arg.foo();\n}\nvoid func(Derived& arg) {\n    cout \u003c\u003c \"func(Derived)\";\n    arg.foo();\n}\n\nvoid otherFunc(Base& arg) {\n    func(arg);\n}\n\nint main() {\n    Derived d;\n    otherFunc(d);\n}","options":["The program runs and prints: func(Base) - Base::foo()","The program runs and prints: func(Derived) - Derived::foo()","The program runs and prints: func(Base) - Derived::foo()","The program runs and prints: func(Derived) - Base::foo()","The program fails to compile","A runtime error (or undefined behavior)","None of the above"],"answer":2,"explain":"Two different mechanisms. Which func overload to call is decided at compile time from the declared type of the argument. Inside otherFunc, arg is declared Base&, so func(Base&) is chosen, even though the object is really a Derived. Then arg.foo() is a virtual call, decided at run time from the real object, so it prints Derived::foo().","rule":"Overloads are picked at compile time from the declared type. Virtual methods are picked at run time from the real object."},{"id":"func-overload-2014","topic":"ovl","kind":"exam","basis":["key","run"],"exams":[["F2014",9]],"prompt":"What is the result of the following? (Compare carefully with the Fall 2012 version.)","code":"class Base {\npublic:\n    virtual void foo() { cout \u003c\u003c \" - Base::foo()\\n\"; }\n};\nclass Derived : public Base {\npublic:\n    void foo() { cout \u003c\u003c \" - Derived::foo()\\n\"; }\n};\n\nvoid func(Base& arg) {\n    cout \u003c\u003c \"func(Base)\";\n    arg.foo();\n}\nvoid func(Derived& arg) {\n    cout \u003c\u003c \"func(Derived)\";\n    arg.foo();\n}\n\nvoid otherFunc(Base& arg) { func(arg); }\n\nvoid otherFunc(Derived& arg) { func(arg); }\n\nint main() {\n    Derived d;\n    otherFunc(d);\n}","options":["The program runs and prints: func(Base) - Base::foo()","The program runs and prints: func(Derived) - Derived::foo()","The program runs and prints: func(Base) - Derived::foo()","The program runs and prints: func(Derived) - Base::foo()","The program fails to compile","A runtime error (or undefined behavior)","None of the above"],"answer":1,"explain":"This version adds otherFunc(Derived&). d is declared as a Derived, so the exact match otherFunc(Derived&) wins. Inside it, arg is declared Derived&, so func(Derived&) wins too. Then the virtual call prints Derived::foo(). The student answered (c) from memory of the older exam, and the grader circled (b).","rule":"Overloads are picked at compile time from the declared type. Check every overload that exists before answering."},{"id":"double-dispatch","topic":"ovl","kind":"exam","basis":["key","run"],"exams":[["F2025",8],["S2020",7],["S2019",7],["F2018",6],["F2017",7]],"prompt":"What is the result of the following?","code":"class Derived;  // Yes, we need this.\n\nclass Base {\npublic:\n    virtual void method(Base& arg) {\n        cout \u003c\u003c \"Base::method(Base)\\n\";\n    }\n    virtual void method(Derived& arg) {\n        cout \u003c\u003c \"Base::method(Derived)\\n\";\n    }\n};\n\nclass Derived : public Base {\npublic:\n    void method(Base& arg) {\n        cout \u003c\u003c \"Derived::method(Base)\\n\";\n    }\n    void method(Derived& arg) {\n        cout \u003c\u003c \"Derived::method(Derived)\\n\";\n    }\n};\n\nvoid someFunc(Base& argA, Base& argB) {\n    argA.method(argB);\n}\n\nint main() {\n    Derived der;\n    someFunc(der, der);\n}","options":["The program runs and prints: Base::method(Base)","The program runs and prints: Base::method(Derived)","The program runs and prints: Derived::method(Base)","The program runs and prints: Derived::method(Derived)","The program fails to compile","A runtime error (or undefined behavior)","None of the above"],"answer":2,"explain":"Split the call argA.method(argB) into two decisions. Which overload: decided at compile time from the declared type of the argument. argB is declared Base&, so it is method(Base&). Which class's version: method is virtual, so it is decided at run time from the real object on the left of the dot, which is a Derived. Together: Derived::method(Base). This has been on five exams. Fall 2025, Spring 2019 and Fall 2017 wrote it as arg.method(arg) with one parameter. Spring 2020 passed (d, b), which gives the same answer.","rule":"The object before the dot uses its real type (if virtual). The arguments in the parentheses use their declared types."},{"id":"func-empty","topic":"ovl","kind":"exam","basis":["key","run"],"exams":[["S2012",11]],"prompt":"What is the result of the following?","code":"class Base {};\nclass Derived : public Base {};\n\nvoid func(Base& base) { cout \u003c\u003c \"func(Base)\\n\"; }\nvoid func(Derived& der) { cout \u003c\u003c \"func(Derived)\\n\"; }\n\nvoid otherFunc(Base& base) {\n    func(base);\n}\n\nint main() {\n    Derived d;\n    otherFunc(d);\n}","options":["The program runs and prints: func(Base)","The program runs and prints: func(Derived)","The program fails to compile","A runtime error (or undefined behavior)","None of the above"],"answer":0,"explain":"Choosing between overloaded functions happens at compile time, using the declared type of the argument. Inside otherFunc the parameter is declared Base&, so func(Base&) is chosen. The fact that the object is really a Derived plays no part: these are ordinary functions, not virtual methods. The student on this exam picked \"fails to compile\" and lost the points.","rule":"Overloads are picked at compile time from the declared type. Virtual methods are picked at run time from the real object."},{"id":"double-dispatch-bd","topic":"ovl","kind":"exam","basis":["key","run"],"exams":[["S2018",6]],"prompt":"What is the result of the following? (Check which object is passed first.)","code":"class Derived;  // Yes, we need this.\n\nclass Base {\npublic:\n    virtual void method(Base& arg) {\n        cout \u003c\u003c \"Base::method(Base)\\n\";\n    }\n    virtual void method(Derived& arg) {\n        cout \u003c\u003c \"Base::method(Derived)\\n\";\n    }\n};\n\nclass Derived : public Base {\npublic:\n    void method(Base& arg) {\n        cout \u003c\u003c \"Derived::method(Base)\\n\";\n    }\n    void method(Derived& arg) {\n        cout \u003c\u003c \"Derived::method(Derived)\\n\";\n    }\n};\n\nvoid someFunc(Base& argA, Base& argB) {\n    argA.method(argB);\n}\n\nint main() {\n    Derived d;\n    Base b;\n    someFunc(b, d);\n}","options":["The program runs and prints: Base::method(Base)","The program runs and prints: Base::method(Derived)","The program runs and prints: Derived::method(Base)","The program runs and prints: Derived::method(Derived)","The program fails to compile","A runtime error (or undefined behavior)","None of the above"],"answer":0,"explain":"Same two decisions as always. Which overload: argB is declared Base&, so method(Base&), even though the object passed is really a Derived. Which class's version: the object before the dot is argA, which really is a plain Base this time, so the Base version runs. Result: Base::method(Base). In the other versions of this question the first argument is a Derived, which gives Derived::method(Base).","rule":"The object before the dot uses its real type (if virtual). The arguments in the parentheses use their declared types."},{"id":"ctor-virtual-func","topic":"ovl","kind":"exam","basis":["key","run"],"exams":[["S2013",9]],"prompt":"What is the result of the following? (This one was worth 10 points.)","code":"class Base {\npublic:\n    Base() { foo(); }\n    virtual void foo() { cout \u003c\u003c \"Base::foo()\"; }\n};\nclass Derived : public Base {\npublic:\n    void foo() { cout \u003c\u003c \"Derived::foo()\"; }\n};\n\nvoid func(Base& arg) {\n    cout \u003c\u003c \" - \";\n    arg.foo();\n    cout \u003c\u003c \"\\nfunc(Base)\\n\";\n}\nvoid func(Derived& arg) {\n    cout \u003c\u003c \" - \";\n    arg.foo();\n    cout \u003c\u003c \"\\nfunc(Derived)\\n\";\n}\n\nvoid otherFunc(Base& arg) {\n    func(arg);\n}\n\nint main() {\n    Derived d;\n    otherFunc(d);\n}","options":["The program runs and prints:\nBase::foo() - Base::foo()\nfunc(Base)","The program runs and prints:\nBase::foo() - Base::foo()\nfunc(Derived)","The program runs and prints:\nBase::foo() - Derived::foo()\nfunc(Base)","The program runs and prints:\nBase::foo() - Derived::foo()\nfunc(Derived)","The program fails to compile","The program runs and prints:\nDerived::foo() - Base::foo()\nfunc(Base)","The program runs and prints:\nDerived::foo() - Base::foo()\nfunc(Derived)","The program runs and prints:\nDerived::foo() - Derived::foo()\nfunc(Base)","The program runs and prints:\nDerived::foo() - Derived::foo()\nfunc(Derived)","None of the above"],"answer":2,"explain":"Three steps. Creating d runs the Base constructor, and a virtual call inside a constructor uses that class's own version: Base::foo(). Then otherFunc passes arg, declared Base&, so the overload func(Base&) is chosen at compile time. Inside it, arg.foo() is an ordinary virtual call on a finished Derived object: Derived::foo(). Output: Base::foo() - Derived::foo(), then func(Base).","rule":"Inside a constructor, a virtual call runs the version belonging to the class being constructed, never a derived override."},{"id":"c-creator","topic":"trivia","kind":"exam","basis":["key"],"exams":[["F2023",1],["S2020",1],["S2019",1],["S2018",1],["F2017",1],["S2015",1],["F2014",1],["S2014",1],["S2013",1],["F2012",1],["S2012",1],["S2011",1]],"prompt":"[Extra credit] Who created C?","options":["Gosling","Kildall","Ritchie","Stroustrup","Thompson","van Rossum","Wirth","Wall"],"answer":2,"explain":"Dennis Ritchie created C at Bell Labs in the early 1970s. The others: Stroustrup made C++, Gosling Java, van Rossum Python, Wall Perl, Wirth Pascal, Kildall CP/M, and Thompson co-created Unix and the B language.","rule":"C is Ritchie, C++ is Stroustrup, Python is van Rossum. One of these has been question 1 on every exam."},{"id":"cpp-creator","topic":"trivia","kind":"exam","basis":["key"],"exams":[["F2018",1]],"prompt":"[Extra credit] Who created C++?","options":["Gosling","Hopper","Ritchie","Stroustrup","Thompson","van Rossum","Wall","None of the above"],"answer":3,"explain":"Bjarne Stroustrup created C++ (\"C with Classes\") at Bell Labs starting in 1979. Ritchie is the C answer, so read which language the question names.","rule":"Read the language in the question: C is Ritchie, C++ is Stroustrup."},{"id":"python-creator","topic":"trivia","kind":"exam","basis":["key"],"exams":[["F2025",1],["S2023",1]],"prompt":"[Extra credit] Who created Python?","options":["James Gosling","Gary Kildall","Ada Lovelace","John McCarthy","Dennis Ritchie","Guido van Rossum","Bjarne Stroustrup","Larry Wall","Niklaus Wirth","None of the above"],"answer":5,"explain":"Guido van Rossum created Python. The two most recent exams in this set that are not about C (Spring 2023 and Fall 2025) both asked about Python, so do not assume the answer is Ritchie. The others: Ritchie made C, Stroustrup C++, Gosling Java, Wall Perl, Wirth Pascal, McCarthy Lisp, Kildall CP/M.","rule":"C is Ritchie, C++ is Stroustrup, Python is van Rossum. One of these has been question 1 on every exam."}],"rules":[{"topic":"ptr","text":"data[i] is *(data+i), and &data[i] is data+i. Both versions get asked, so check for the &.","seen":["S2012","F2012","S2013","S2014","S2015","F2017","S2018","F2018","S2020"]},{"topic":"ptr","text":"Pointer arithmetic counts elements. Work out which index each pointer is on, then read the value. q[-2] is *(q-2) and p[1] is *(p+1).","seen":["F2014","S2023","F2023"]},{"topic":"ptr","text":"A ranged for only changes the vector if the loop variable is a reference: for (int& x : v).","seen":["F2012","S2014","S2015","F2017"]},{"topic":"ptr","text":"A class works in a ranged for once it has begin() and end(). end() points one past the last element.","seen":["F2025"]},{"topic":"const","text":"Read pointer types right to left. const int* p: cannot write through p, can re-aim p. int* const p: can write through p, cannot re-aim it.","seen":["S2011","S2012","F2012","S2014","F2014","S2015","F2017","S2018","F2018","S2019","S2023","F2023","F2025"]},{"topic":"const","text":"The address of something const can only go into a pointer-to-const (const int*).","seen":["F2012","S2014","F2014","S2015","S2020","S2023","F2023"]},{"topic":"const","text":"A parameter passed by value is a copy. Changing it, directly or through a pointer, never changes the caller's variable.","seen":["S2018","S2019","F2025"]},{"topic":"ops","text":"Thing b = a; is the copy constructor. b = a; on existing objects is b.operator=(a), and operator= must be a member. If no option names the copy constructor, the answer is None of the above.","seen":["S2011","S2012","F2012","S2013","S2014","F2014","S2015"]},{"topic":"ops","text":"As members: ++a is a.operator++() and a++ is a.operator++(0).","seen":["F2014","S2023","F2023"]},{"topic":"ops","text":"if (obj) needs operator bool() const. No return type goes in front of it.","seen":["F2012","S2013","S2014","S2015"]},{"topic":"conv","text":"A constructor that can be called with one argument is an automatic conversion. thing = value builds a temporary from it and replaces every field, so defaulted fields reset. explicit switches the conversion off.","seen":["S2011","S2012","F2012","F2014","S2015","F2017","S2019","F2023"]},{"topic":"conv","text":"If the constructor needs two arguments and has no defaults, there is no conversion and thing = value does not compile.","seen":["S2018","S2020","F2025"]},{"topic":"copy","text":"Derived copy control: Base(rhs) in the copy constructor's initialization list, Base::operator=(rhs) in the assignment operator.","seen":["S2011","F2018"]},{"topic":"copy","text":"delete through a Base* runs the derived destructors only if the Base destructor is virtual. Without it, only the base part is destroyed.","seen":["S2011","S2015","F2018","S2023"]},{"topic":"order","text":"Construction at every level: base, then that class's member variables, then its constructor body. Look at which class the member is declared in. Destruction is the exact reverse.","seen":["S2011","S2012","F2012","S2013","S2014","S2015","F2017","S2018","F2018","S2019","S2020"]},{"topic":"order","text":"A hand-written copy constructor with no initialization list default-constructs the base and the members. Passing an object by value calls the copy constructor.","seen":["F2014","F2025"]},{"topic":"order","text":"Members are built in the order they are declared in the class, not the order in the initialization list. Built-in members with no initializer hold garbage.","seen":["S2012","S2023"]},{"topic":"inh","text":"A derived-class function hides all base-class functions with the same name, even ones that match the call better.","seen":["F2012","S2013","S2014","S2015","S2019","S2020"]},{"topic":"inh","text":"Derived* to Base* is automatic. Base* to Derived* (or to a sibling) does not compile, whatever the object really is.","seen":["F2012","S2013","S2014","S2015","F2017","S2018","F2018","S2019","S2020","S2023","F2025"]},{"topic":"inh","text":"baseObject = derivedObject compiles and slices. The base object stays a plain base object, even for virtual methods.","seen":["S2012","F2017","F2018","S2019","S2020"]},{"topic":"inh","text":"protected: usable inside a derived class on objects of that same derived class. Not from main (on any object), and not on a sibling class.","seen":["S2014","F2014","S2019","S2020","F2023","F2025"]},{"topic":"inh","text":"Constructors are not inherited. A derived constructor must call the base constructor in its initialization list: Cat(string n) : Pet(n) {}.","seen":["F2023","F2025"]},{"topic":"virt","text":"virtual must be on the method in the class of the pointer you call through. If the base version is not virtual, a base pointer always calls the base version.","seen":["F2014","F2017","S2018","F2018","S2019","F2023"]},{"topic":"virt","text":"Overriding needs an exact signature match, const included. A mismatch is a new function, and the base version is still what a base pointer calls.","seen":["S2023","F2023"]},{"topic":"virt","text":"Through a Base* (or on a Base object) you can only call methods Base declares, whatever the real object is.","seen":["S2011","S2012","F2017","S2018","S2019","S2020","F2025"]},{"topic":"virt","text":"A virtual call inside a constructor runs that class's own version, never a derived override.","seen":["S2012","S2013","S2015"]},{"topic":"virt","text":"public and private are checked on the declared type at compile time. Which override runs is decided from the real object at run time.","seen":["S2023"]},{"topic":"abs","text":"A class with a pure virtual method cannot be instantiated (pointers to it are fine). Once a descendant overrides it, that class and everything below it are concrete. Then read what the string actually prints.","seen":["S2011","S2012","F2017","S2018","F2018","S2019","S2020","S2023","F2023","F2025"]},{"topic":"ovl","text":"In a.method(b): the overload is chosen at compile time from b's declared type, and the class version is chosen at run time from a's real type (if virtual).","seen":["S2012","F2012","S2013","S2014","F2014","S2015","F2017","S2018","F2018","S2019","S2020","F2025"]}],"frqs":[{"max":50,"gradeNote":"The output format is the student's choice. The add method is provided by the exam, so the student does not write it.","id":"skyrim","title":"Skyrim","pts":"50 pts","exams":[["F2025",12],["S2019",12],["F2017",13]],"skills":["Inheritance","All of copy control","Output operator","Equality operator"],"spec":"Define a class **Skyrim**. That is the only class that you have to define.\n\nThe class {{Skyrim}} will inherit from the class {{Elder}}.\n- Elder\n  - has a constructor that takes a string representing your registration code.\n  - It also has any necessary operators and supports copy control. You should not need to know anything more about the class.\n  - NB: you are **not responsible** for defining the Elder class.\n\nSkyrim has two fields, the player's name and a collection of {{Dragon}} pointers. There may be lots of different types of Dragons, but we won't be responsible for defining those derived classes here.\n\nThe Dragons will all be on the heap. In fact there is a Skyrim method that you are **not responsible** for writing, called {{add}}, that creates the Dragons on the heap and inserts their addresses into the collection. Note that we are not telling you anything about what parameters are provided to that method, so don't think of calling it and don't worry about providing a prototype for it.\n- NB: you are **not responsible** for defining the Dragon class.\n- Dragons support copy control, along with all necessary operators\n\nYou are responsible for defining the Skyrim class and providing the following functionality:\n- A constructor taking in the player's name and registration code.\n- Copy control. Yes, **all of it**.\n  - Naturally, copying should involve making a deep copy. Don't just copy pointers!\n- An output operator.\n  - You may choose the format. Obviously all of the information you have about your Skyrim instance should be included.\n  - Don't worry about printing information contained in the Elder class.\n- An equality operator.\n  - Two Skyrim instances are considered equal if all of the corresponding Dragons are equal, i.e.:\n    - there are the same number of Dragons\n    - each Dragon in one Skyrim matches the Dragon in the same position of the collection in the other Skyrim.\n    - NB, Dragons do not have to have the same address in memory to be \"equal\".","testMine":true,"test":"int main() {\n    Skyrim one(\"Dova\", \"ABC-123\");\n    one.add(\"Alduin\");\n    one.add(\"Paarthurnax\");\n    cout \u003c\u003c one \u003c\u003c endl;\n\n    Skyrim two(one);                    // copy constructor\n    cout \u003c\u003c (one == two) \u003c\u003c endl;       // 1: different addresses, equal Dragons\n    two.add(\"Odahviing\");\n    cout \u003c\u003c (one == two) \u003c\u003c endl;       // 0\n\n    Skyrim three(\"Other\", \"XYZ-789\");\n    three = two;                        // assignment operator\n    cout \u003c\u003c three \u003c\u003c endl;\n    three = three;                      // self-assignment must be safe\n    cout \u003c\u003c (three == two) \u003c\u003c endl;     // 1\n}","output":"Player: Dova; Dragons: Alduin Paarthurnax\n1\n0\nPlayer: Dova; Dragons: Alduin Paarthurnax Odahviing\n1","solution":"class Skyrim : public Elder {\n    friend ostream& operator\u003c\u003c(ostream& os, const Skyrim& rhs) {\n        os \u003c\u003c \"Player: \" \u003c\u003c rhs.name \u003c\u003c \"; Dragons:\";\n        for (const Dragon* dp : rhs.dragons) {\n            os \u003c\u003c ' ' \u003c\u003c *dp;\n        }\n        return os;\n    }\n\n    friend bool operator==(const Skyrim& lhs, const Skyrim& rhs) {\n        if (lhs.dragons.size() != rhs.dragons.size()) return false;\n        for (size_t i = 0; i \u003c lhs.dragons.size(); ++i) {\n            // compare the Dragons, not the pointers\n            if (!(*lhs.dragons[i] == *rhs.dragons[i])) return false;\n        }\n        return true;\n    }\n\npublic:\n    Skyrim(const string& name, const string& code)\n        : Elder(code), name(name) {}\n\n    // Destructor\n    ~Skyrim() {\n        for (Dragon* dp : dragons) {\n            delete dp;\n        }\n    }\n\n    // Copy constructor\n    Skyrim(const Skyrim& rhs) : Elder(rhs), name(rhs.name) {\n        for (const Dragon* dp : rhs.dragons) {\n            dragons.push_back(new Dragon(*dp));\n        }\n    }\n\n    // Assignment operator\n    Skyrim& operator=(const Skyrim& rhs) {\n        if (this != &rhs) {\n            for (Dragon* dp : dragons) {        // free what we own\n                delete dp;\n            }\n            dragons.clear();\n            Elder::operator=(rhs);              // assign the Elder part\n            name = rhs.name;\n            for (const Dragon* dp : rhs.dragons) {\n                dragons.push_back(new Dragon(*dp));\n            }\n        }\n        return *this;\n    }\n\n    // (the add method is provided by the exam)\n\nprivate:\n    string name;\n    vector\u003cDragon*> dragons;\n};","rubric":["Inheritance: class Skyrim : public Elder.","Constructor: Elder(code) and name(name) in the initialization list.","Output operator: a friend that prints the name and every Dragon, using *dp.","Equality operator: compare the sizes first, then *lhs.dragons[i] against *rhs.dragons[i].","Destructor: delete every Dragon.","Copy constructor: Elder(rhs) in the initialization list, then new Dragon(*dp) for each one.","Assignment operator: self-check, delete and clear, Elder::operator=(rhs), copy the name, deep copy, return *this."],"notes":"This exact problem was the free response on Fall 2017, Spring 2019 and Fall 2025, and Spring 2020 used it again with the names changed. The Fall 2025 student scored 49.5 out of 50 with an answer that matches this one. The half point went on setting a copy of each pointer to nullptr in the destructor. Fall 2017 said only \"copy control\" where the later exams say \"all of it\"."},{"max":50,"gradeNote":"The exact format of the output operator is the student's choice as long as the name, country, division and teams are shown. add_team is provided by the exam.","id":"sl","title":"SL, a soccer league","pts":"50 pts","exams":[["F2023",12]],"skills":["Inheritance","All of copy control","Output operator","operator bool","Find the maximum"],"spec":"The following problem involves 3 classes: **League**, **SL** and **Team**. You are only responsible for implementing the **SL** (soccer league) class.\n\n# League class\n- has two fields: a string representing the name of the league, and a string representing its country.\n- has a constructor accepting the name and country of the league\n- supports copy control\n- has getters to access those two fields, i.e. {{get_name()}} and {{get_country()}}\n- **may have additional** fields and methods that you don't know about.\n- **Do not assume** the existence of any other methods for the League class.\n- You are **not responsible** for implementing the League class.\n\n# Team class\n- supports copy control and all necessary operators.\n  - This includes relational operators (\u003c, \u003c=, ==, !=, > and >=) that compare two teams based on the number of points each has acquired.\n- Teams have names, points, and a constructor to initialize them.\n- **may have additional** fields and methods that you don't know about.\n- **Do not assume** the existence of any other methods for the Team class.\n- You are **not responsible** for implementing the Team class.\n\n# SL class\n- SL is a derived class of the League class.\n- The SL class contains the following additional member variables:\n  - an {{int}} representing the division where the soccer league is played.\n  - a {{vector}} of Team pointers\n    - All of the Team objects are stored on the heap.\n    - The Team objects are \"owned by\" the SL instance, i.e. no one else has a pointer to these Team objects.\n    - The Team objects in the vector represent the league participants.\n- A **constructor** that takes the SL's name, country and division.\n- **Copy control**. Yes, **all** of it!\n- An **output operator**. You may choose the format, but the name, country, division and the teams in the soccer league should all be displayed clearly.\n- a {{findLeagueLeader()}} method that returns a pointer to the team with the highest number of points. Returns null if there are no teams.\n- An {{add_team}} method that takes in the team's name and points, creating the team object on the heap and adding it to the SL's vector. To save you a few lines of code, **you are not responsible for implementing this method. You will NOT use this method in your code.**\n\nImplement the SL class so that it satisfies the above requirements **and satisfies the test code below**.","test":"int main() {\n    SL slA(\"FreeLeague\", \"Austria\", 17);\n    SL slC(\"PoliteLeague\", \"Canada\", 36);\n\n    // Make sure all of this will work as shown!\n    if (slA) {\n      cout \u003c\u003c slA.get_name() \u003c\u003c \" has teams!\\n\";\n    } else {\n      cout \u003c\u003c slA.get_name() \u003c\u003c \" has no teams yet.\\n\";\n    }\n\n    slA.add_team(\"Moe\", 2);\n    slA.add_team(\"Larry\", 5);\n    slA.add_team(\"Curly\", 3);\n\n    cout \u003c\u003c slA \u003c\u003c endl;\n\n    // Make sure all of this will work as shown!\n    if (slA) {\n      cout \u003c\u003c slA.get_name() \u003c\u003c \" has teams!\\n\";\n    } else {\n      cout \u003c\u003c slA.get_name() \u003c\u003c \" has no teams yet.\\n\";\n    }\n\n    cout \u003c\u003c slA.get_name() \u003c\u003c \"'s leader is: \"\n       \u003c\u003c *slA.findLeagueLeader() \u003c\u003c endl;\n}","output":"FreeLeague has no teams yet.\nFreeLeague, Austria, 17:\nTeam: Moe with 2 points\nTeam: Larry with 5 points\nTeam: Curly with 3 points\nFreeLeague has teams!\nFreeLeague's leader is: Team: Larry with 5 points","solution":"class SL : public League {\n    friend ostream& operator\u003c\u003c(ostream& os, const SL& rhs) {\n        os \u003c\u003c rhs.get_name() \u003c\u003c \", \" \u003c\u003c rhs.get_country() \u003c\u003c \", \"\n           \u003c\u003c rhs.division \u003c\u003c \":\";\n        for (const Team* tp : rhs.teams) {\n            os \u003c\u003c endl \u003c\u003c *tp;\n        }\n        return os;\n    }\n\npublic:\n    SL(const string& name, const string& country, int division)\n        : League(name, country), division(division) {}\n\n    // Destructor\n    ~SL() {\n        for (Team* tp : teams) {\n            delete tp;\n        }\n    }\n\n    // Copy constructor\n    SL(const SL& rhs) : League(rhs), division(rhs.division) {\n        for (const Team* tp : rhs.teams) {\n            teams.push_back(new Team(*tp));\n        }\n    }\n\n    // Assignment operator\n    SL& operator=(const SL& rhs) {\n        if (this != &rhs) {\n            for (Team* tp : teams) {\n                delete tp;\n            }\n            teams.clear();\n            League::operator=(rhs);\n            division = rhs.division;\n            for (const Team* tp : rhs.teams) {\n                teams.push_back(new Team(*tp));\n            }\n        }\n        return *this;\n    }\n\n    // Needed for: if (slA)\n    explicit operator bool() const { return teams.size() != 0; }\n\n    Team* findLeagueLeader() const {\n        if (teams.size() == 0) return nullptr;\n        Team* leader = teams[0];\n        for (Team* tp : teams) {\n            if (*tp > *leader) {        // compare the Teams, not the pointers\n                leader = tp;\n            }\n        }\n        return leader;\n    }\n\n    void add_team(const string& name, int points);   // provided by the exam\n\nprivate:\n    int division;\n    vector\u003cTeam*> teams;\n};","rubric":["Output operator (4 points): the league i
