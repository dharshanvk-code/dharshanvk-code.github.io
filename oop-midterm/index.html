    }).join('') + '</ul>';
    if (fb.bugs.length) {
      h += '<h3>Lines to fix</h3><ul class="fbbugs">' + fb.bugs.map(function (b) {
        return '<li>' + (b.line ? '<pre class="code"><code>' + hl(b.line) + '</code></pre>' : '') + '<p>' + esc(b.problem) + '</p>' +
          (b.fix ? '<p class="ri">Fix</p><pre class="code"><code>' + hl(b.fix) + '</code></pre>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    if (fb.slips && fb.slips.length) {
      h += '<h3>Small slips (no points lost)</h3><ul class="checks">' + fb.slips.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    h += '<p class="basis">Claude graded this by reading your code. Missing semicolons, brackets and typos are not counted against you. Nothing was compiled or run, and the score is an estimate, so check anything surprising against the model solution. Checked ' +
      esc(new Date(fb.t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) + '.</p></div>';
    return h;
  }
  function checkLabel(id) { return grading[id] ? 'Checking…' : (W[id] && W[id].fb) ? 'Check again' : 'Check my answer'; }
  // Updates one problem's feedback area without re-rendering the page, so typing is never interrupted.
  function updateFb(id) {
    var box = document.getElementById('fb-' + id);
    if (box) box.innerHTML = fbHTML(id);
    var btn = document.querySelector('[data-act="frq-check"][data-id="' + id + '"]');
    if (btn) { btn.disabled = !!grading[id] || sampleOff; btn.textContent = checkLabel(id); }
  }
  function inline(s) {
    return esc(s).replace(/\{\{(.+?)\}\}/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }
  // Tiny renderer for the problem statements: "# " heading, "- " bullets (2 spaces per level), "~~~" code fence.
  function md(text) {
    var lines = text.split('\n'), out = '', depth = 0, inCode = false, code = [], para = [];
    function flushPara() { if (para.length) { out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
    function closeLists() { while (depth > 0) { out += '</li></ul>'; depth--; } }
    lines.forEach(function (line) {
      if (line.trim() === '~~~') {
        if (inCode) { out += '<pre class="code"><code>' + hl(code.join('\n')) + '</code></pre>'; code = []; inCode = false; }
        else { flushPara(); closeLists(); inCode = true; }
        return;
      }
      if (inCode) { code.push(line); return; }
      var m = /^( *)- (.*)$/.exec(line);
      if (m) {
        flushPara();
        var level = Math.floor(m[1].length / 2) + 1;
        if (level > depth) { while (depth < level) { out += '<ul>'; depth++; if (depth < level) out += '<li>'; } out += '<li>' + inline(m[2]); }
        else { while (depth > level) { out += '</li></ul>'; depth--; } out += '</li><li>' + inline(m[2]); }
        return;
      }
      if (!line.trim()) { flushPara(); closeLists(); return; }
      closeLists();
      if (line.indexOf('# ') === 0) { flushPara(); out += '<h4>' + inline(line.slice(2)) + '</h4>'; return; }
      para.push(line);
    });
    flushPara(); closeLists();
    return out;
  }
  function frqHTML() {
    var F = DATA.frqs, done = F.filter(function (f) { return P.f[f.id]; }).length;
    var h = '<div><h1>Free response</h1><p class="lead">The blue-book question is about half of the exam. These are the ' + F.length + ' different problems from the ' + NEX +
      ' exams, newest first. Type your answer in the box under a problem and Claude will grade it against that problem’s rubric, or write on paper and compare with the model solution. Every model solution was compiled and run against the test code shown.</p></div>';
    h += '<section><div class="section-head"><h2>Where the points go</h2><p>From the graders’ marks and the Gradescope rubrics on these exams.</p></div><div class="list"><ul class="losses">' +
      DATA.frqLosses.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div></section>';
    h += '<section><div class="section-head"><h2>The problems</h2><p class="num">' + done + ' of ' + F.length + ' marked done</p></div><div class="review">';
    F.forEach(function (f) {
      var sol = !!frqUI.sol[f.id], isDone = !!P.f[f.id];
      h += '<details class="rv frq" data-frq="' + f.id + '"' + (frqUI.open[f.id] ? ' open' : '') + '><summary><span class="q">' + esc(f.title) + '</span>' +
        '<span class="muted" style="font-size:.82rem">' + f.exams.map(function (e) { return esc(EXAM[e[0]]); }).join(', ') + ' · ' + esc(f.pts) + '</span>' +
        (isDone ? '<span class="chip good">✓ Done</span>' : '') + '</summary><div class="body">' +
        '<div class="chips">' + (f.exams.length > 1 ? '<span class="chip hot">Asked on ' + f.exams.length + ' exams</span>' : '') +
        f.skills.map(function (k) { return '<span class="chip plain">' + esc(k) + '</span>'; }).join('') + '</div>' +
        '<div class="spec">' + md(f.spec) + '</div>' +
        '<h3>' + (f.testMine ? 'Test code (written for this page, the exam gave none)' : 'Test code from the exam') + '</h3><pre class="code"><code>' + hl(f.test) + '</code></pre>' +
        '<h3>' + (f.testMine ? 'What the model solution prints' : 'Expected output') + '</h3><pre class="code"><code>' + esc(f.output) + '</code></pre>' +
        (f.outputNote ? '<p class="basis">' + esc(f.outputNote) + '</p>' : '') +
        '<h3><label for="ans-' + f.id + '">Your answer</label></h3>' +
        '<textarea class="ans" id="ans-' + f.id + '" data-frq-ans="' + f.id + '" maxlength="' + ANSWER_MAX + '" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Write your class here. It is saved as you type.">' + esc((W[f.id] && W[f.id].a) || '') + '</textarea>' +
        '<p class="kbd">Enter keeps your indentation and closes a brace you just opened. <kbd>Tab</kbd> indents, <kbd>Shift</kbd>+<kbd>Tab</kbd> outdents, <kbd>Esc</kbd> leaves the box.</p>' +
        '<div class="row"><button class="btn primary" data-act="frq-check" data-id="' + f.id + '"' + ((grading[f.id] || sampleOff) ? ' disabled' : '') + '>' + checkLabel(f.id) + '</button>' +
        '<button class="btn" data-act="frq-sol" data-id="' + f.id + '">' + (sol ? 'Hide model solution' : 'Show model solution') + '</button>' +
        '<button class="btn" data-act="frq-done" data-id="' + f.id + '">' + (isDone ? 'Mark as not done' : 'Mark as done') + '</button></div>' +
        (sampleOff ? '<p class="basis">Checking with Claude is not available in this view. Your answer is still saved, and you can compare it with the model solution.</p>' : '') +
        '<div class="fbbox" id="fb-' + f.id + '" aria-live="polite">' + fbHTML(f.id) + '</div>';
      if (sol) {
        h += '<h3>Model solution</h3><pre class="code"><code>' + hl(f.solution) + '</code></pre>' +
          '<h3>Check your answer against these</h3><ul class="checks">' + f.rubric.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
          (f.notes ? '<p class="basis">' + esc(f.notes) + '</p>' : '');
      }
      h += '</div></details>';
    });
    return h + '</div></section>';
  }

  function renderFooter() {
    var box = document.getElementById('resetbox');
    box.innerHTML = resetAsk
      ? '<div class="row"><span>Erase every answer and mock result?</span><button class="btn small danger" data-act="reset-yes">Erase progress</button><button class="btn small" data-act="reset-no">Cancel</button></div>'
      : (Object.keys(P.q).length || P.mocks.length || Object.keys(P.f).length ? '<button class="btn small" data-act="reset">Reset my progress</button>' : '');
    var past = Q.filter(function (q) { return q.kind !== 'new'; }).length;
    document.getElementById('about').textContent = past + ' questions come from the scanned exams (identical questions that appeared in several years are merged into one). Short-answer questions were rewritten as multiple choice and are labelled. Code answers and the free-response model solutions were compiled with g++ 13 as C++17. Student names are left out.';
  }

  function render(scrollToCard) {
    renderTabs();
    app.innerHTML = view === 'practice' ? practiceHTML() : view === 'mock' ? mockHTML() : view === 'frq' ? frqHTML() : view === 'rules' ? rulesHTML() : overviewHTML();
    renderFooter();
    clearInterval(mockTick); mockTick = null;
    if (view === 'mock' && mock && mock.phase === 'run') {
      mockTick = setInterval(function () {
        var left = mockLeft(), el = document.getElementById('timer');
        if (left <= 0) { submitMock(); render(); window.scrollTo(0, 0); return; }
        if (el) { el.textContent = fmtTime(left); el.classList.toggle('low', left < 300); }
      }, 1000);
    }
    if (scrollToCard) { var c = document.getElementById('qcard'); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); }
  }

  /* ───────── actions ───────── */
  function pick(i) {
    var q = QBY[prac.queue[prac.i]];
    if (!q || prac.picked !== null || i >= q.options.length) return;
    prac.picked = i; prac.done++;
    var ok = i === q.answer; if (ok) prac.right++;
    record(q.id, ok); save();
    render();
    var nb = document.getElementById('nextbtn'); if (nb) nb.focus({ preventScroll: true });
  }
  function next() { prac.i++; prac.picked = null; render(true); }
  function act(name, el) {
    var d = el ? el.dataset : {};
    switch (name) {
      case 'practice':
        startPractice({ topic: d.topic || 'all', src: d.src || 'all', status: d.status || 'all' });
        if (view === 'practice') { render(); window.scrollTo(0, 0); } else go('practice');
        break;
      case 'again': startPractice(prac); render(); window.scrollTo(0, 0); break;
      case 'pick': pick(+d.i); break;
      case 'next': next(); break;
      case 'skip': prac.i++; prac.picked = null; render(true); break;
      case 'mock-start': buildMock(); render(); window.scrollTo(0, 0); break;
      case 'mock-pick': mock.ans[mock.qs[mock.cur]] = +d.i; mock.confirm = false; render(); break;
      case 'mock-goto': mock.cur = +d.i; render(true); break;
      case 'mock-prev': if (mock.cur > 0) { mock.cur--; render(true); } break;
      case 'mock-nextq': if (mock.cur + 1 < mock.qs.length) { mock.cur++; render(true); } break;
      case 'mock-submit': mock.confirm = true; render(); break;
      case 'mock-submit-no': mock.confirm = false; render(); break;
      case 'mock-submit-yes': submitMock(); render(); window.scrollTo(0, 0); break;
      case 'frq-check': checkAnswer(d.id); break;
      case 'frq-stop': if (grading[d.id]) grading[d.id].abort(); break;
      case 'frq-sol': frqUI.sol[d.id] = !frqUI.sol[d.id]; frqUI.open[d.id] = true; render(); break;
      case 'frq-done':
        if (P.f[d.id]) delete P.f[d.id]; else P.f[d.id] = Date.now();
        frqUI.open[d.id] = true; save(); render(); break;
      case 'reset': resetAsk = true; renderFooter(); break;
      case 'reset-no': resetAsk = false; renderFooter(); break;
      case 'reset-yes':
        P = { v: 1, q: {}, mocks: [], f: {} }; resetAsk = false; prac = null; if (mock && mock.phase === 'done') mock = null;
        save(); render(); break;
    }
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    act(el.dataset.act, el);
  });
  document.addEventListener('change', function (e) {
    if (!e.target.matches('#f-topic, #f-src, #f-status')) return;
    var id = e.target.id;
    startPractice({ topic: document.getElementById('f-topic').value, src: document.getElementById('f-src').value, status: document.getElementById('f-status').value });
    render();
    var again = document.getElementById(id); if (again) again.focus({ preventScroll: true });
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.dataset && e.target.dataset.frqAns;
    if (id) setAnswer(id, e.target.value);
  });
  // Editor behaviour for the answer boxes: Enter keeps the indentation and indents after "{" or "public:",
  // "{" + Enter adds the closing brace, "}" and "public:" step back one level, Tab and Shift+Tab indent
  // and outdent, Backspace removes a whole indent step. Escape leaves the box.
  var IND = '    ';
  function editText(t, from, to, text, caret) {
    t.setSelectionRange(from, to);
    var ok = false;
    try { ok = text === '' ? (from === to || document.execCommand('delete')) : document.execCommand('insertText', false, text); } catch (err) {}
    if (!ok) t.setRangeText(text, from, to, 'end');     // older browsers: works, but without undo history
    if (caret !== undefined) t.setSelectionRange(caret, caret);
    setAnswer(t.dataset.frqAns, t.value);
  }
  function countChar(str, ch) { return str.split(ch).length - 1; }
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t || !t.dataset || !t.dataset.frqAns || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    var v = t.value, a = t.selectionStart, b = t.selectionEnd;
    var ls = v.lastIndexOf('\n', a - 1) + 1;                  // start of the caret's line
    var before = v.slice(ls, a);                              // the line up to the caret
    var lineIndent = /^[ \t]*/.exec(before)[0];
    var lineEnd = v.indexOf('\n', b); if (lineEnd < 0) lineEnd = v.length;
    var restOfLine = v.slice(b, lineEnd);

    if (e.key === 'Escape') { t.blur(); return; }

    if (e.key === 'Tab') {
      e.preventDefault();
      var multi = a !== b && v.slice(a, b).indexOf('\n') >= 0;
      if (multi || e.shiftKey) {
        var blockEnd = (multi && v.charAt(b - 1) === '\n') ? b - 1 : lineEnd;
        var block = v.slice(ls, blockEnd);
        var out = e.shiftKey ? block.replace(/^( {1,4}|\t)/gm, '') : block.replace(/^(?=.)/gm, IND);
        if (out === block) return;
        editText(t, ls, blockEnd, out);
        if (multi) t.setSelectionRange(ls, ls + out.length);
        else { var c = Math.max(ls, a - (block.length - out.length)); t.setSelectionRange(c, c); }
      } else {
        var pad = IND.slice((a - ls) % 4);                    // up to the next multiple of four
        editText(t, a, b, pad, a + pad.length);
      }
      return;
    }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      var trimmed = before.replace(/[ \t]+$/, '');
      var openBrace = /\{$/.test(trimmed);
      var label = /^\s*(public|private|protected)\s*:$/.test(trimmed);
      var ind = lineIndent + ((openBrace || label) ? IND : '');
      var text = '\n' + ind, to = b;
      if (openBrace) {
        if (restOfLine.trim().charAt(0) === '}') {            // caret sits between { and }
          to = b + (restOfLine.length - restOfLine.replace(/^[ \t]+/, '').length);
          text += '\n' + lineIndent;
        } else if (!restOfLine.trim()) {                      // add the closing brace if one is missing
          var rest = v.slice(0, a) + v.slice(b);
          if (countChar(rest, '{') > countChar(rest, '}')) {
            text += '\n' + lineIndent + '}' + (/^\s*(class|struct)\b/.test(before) ? ';' : '');
          }
        }
      }
      editText(t, a, to, text, a + 1 + ind.length);
      return;
    }

    if (e.key === '}' && a === b && /^[ \t]*$/.test(before) && !restOfLine.trim()) {
      var target = lineIndent.length >= 4 ? lineIndent.slice(0, lineIndent.length - 4) : '';
      var nextEnd = v.indexOf('\n', lineEnd + 1); if (nextEnd < 0) nextEnd = v.length;
      var nextLine = lineEnd < v.length ? v.slice(lineEnd + 1, nextEnd) : null;
      if (nextLine === target + '}' || nextLine === target + '};') {
        // The closing brace is already waiting on the next line: drop this blank line and step past it.
        e.preventDefault();
        editText(t, ls, lineEnd + 1, '', ls + target.length + 1);
        return;
      }
      if (before.length) {                                    // step back one level, then the brace
        e.preventDefault();
        editText(t, ls, a, target + '}', ls + target.length + 1);
        return;
      }
    }

    if (e.key === ':' && a === b) {
      var m = /^( {4,})(public|private|protected)$/.exec(before);
      if (m) {                                                // access labels line up with "class"
        e.preventDefault();
        var lab = m[1].slice(4) + m[2] + ':';
        editText(t, ls, a, lab, ls + lab.length);
        return;
      }
    }

    if (e.key === 'Backspace' && a === b && before.length && /^ +$/.test(before)) {
      e.preventDefault();
      editText(t, a - (((before.length - 1) % 4) + 1), a, '');
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { clearTimeout(wLocalTimer); saveWLocal(); if (wDirty) { clearTimeout(wTimer); flushW(); } }
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.matches && e.target.matches('select, input, textarea')) return;
    var onBtn = e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.tagName === 'SUMMARY';
    var li = e.key.length === 1 ? LETTERS.indexOf(e.key.toLowerCase()) : -1;
    if (view === 'practice' && prac && prac.i < prac.queue.length) {
      if (prac.picked === null && li >= 0) { e.preventDefault(); pick(li); }
      else if (prac.picked !== null && (e.key === 'ArrowRight' || (e.key === 'Enter' && !onBtn))) { e.preventDefault(); next(); }
    } else if (view === 'mock' && mock && mock.phase === 'run') {
      var q = QBY[mock.qs[mock.cur]];
      if (li >= 0 && li < q.options.length) { e.preventDefault(); mock.ans[q.id] = li; mock.confirm = false; render(); }
      else if (e.key === 'ArrowRight') act('mock-nextq');
      else if (e.key === 'ArrowLeft') act('mock-prev');
    }
  });
  function route() {
    var v = (location.hash || '').replace('#', '');
    view = ['overview', 'practice', 'mock', 'frq', 'rules'].indexOf(v) >= 0 ? v : 'overview';
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  // <details> toggles do not bubble, so listen in the capture phase to remember which problems are open.
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.matches && d.matches('details.frq')) frqUI.open[d.dataset.frq] = d.open;
  }, true);

  /* ───────── boot ───────── */
  function start(saved) {
    P = clean(loadLocal());
    W = loadW();
    getSample();
    try {
      if (saved && saved.prac) prac = saved.prac;
      if (saved && saved.mock) mock = saved.mock;
    } catch (e) {}
    setSync('checking');
    route();
    initSync();
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(function () { return { prac: prac, mock: mock }; }); } catch (e) {}
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
