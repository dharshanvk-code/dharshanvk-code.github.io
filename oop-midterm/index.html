nformation, then every team.","Constructor (5): League(name, country) in the initialization list. Pass the strings by const reference.","Destructor (4): delete every Team.","Copy constructor (5.5): League(rhs) in the initialization list. Loop with const Team*.","Assignment operator (15): self-check, free, League::operator=(rhs), division, deep copy, return *this.","findLeagueLeader (5): const method, returns nullptr when empty, compares *tp > *leader.","operator bool (4): true when there is at least one team."],"notes":"The point values come from the Gradescope rubric on the scanned copy, where the student scored 7.5 out of 50. The printed exam also listed a country string as an SL member. The student crossed it out, and it is not needed because League already stores the country."},{"max":50,"gradeNote":"The output format is the student's choice. The exam gives no method for adding points, so the student does not write one. A return type of Point* for the index operator is accepted.","id":"scatplot","title":"ScatPlot, a scatter plot","pts":"50 pts","exams":[["S2023",12]],"skills":["Inheritance","All of copy control","Output operator","Index operator","explicit operator bool","find"],"spec":"The following problem involves 3 classes: **Plot**, **ScatPlot** and **Point**. You are only responsible for implementing the **ScatPlot** class.\n\n# Plot class\nNote: you are **not** responsible for implementing the Plot class. The Plot class\n- has a private {{string}} representing the plot's title\n- defines a constructor accepting the plot's title\n- supports copy control\n- has a {{get_title()}} method that returns the plot's title\n- may have additional fields and methods\n\n# ScatPlot class\nScatPlot is a derived class of the Plot class used to represent scatter plot objects. The ScatPlot class contains the following member variables:\n- a private {{string}} representing the color of points on the plot\n- a private {{bool}} indicating whether or not the Plot is currently being displayed with a default value of {{false}}\n- a private {{vector}} of Point pointers\n  - All of the Point objects in the vector will be stored on the heap.\n  - The Point objects are \"owned by\" the ScatPlot instance, i.e. no one else has a pointer to these Point objects.\n  - The Point objects in the vector represent the points installed on the ScatPlot.\n  - Do not be concerned with how they were inserted into the vector, they are just there.\n  - The Point class supports copy control and all necessary operators.\n  - **Do not assume** the existence of any other methods for the Point class.\n\nAgain note: you are **not responsible** for implementing the Point class.\n\nDefine the ScatPlot class. You are only responsible for implementing the ScatPlot class' functionality as follows:\n\n# Implement the Constructor\nImplement a constructor which accepts the ScatPlot's title, color of points, and display status.\n\n# Implement Copy Control\nImplement **all of** the copy control.\n\n# Implement the Output Operator\nImplement an output operator. You choose the format, but the title, color of points, and the points contained in the ScatPlot must all be neatly displayed.\n\n# Implement an Index Operator\nImplement an index operator that can access a Point pointer in the ScatPlot's points vector based on the value passed to an index parameter. The behavior of the index operator is as follows:\n- In the case that the index parameter has a value greater than or equal to the number of Points in the vector, the function returns {{nullptr}}.\n- Otherwise, the Point pointer at the index passed as the value of the parameter is returned.\n- The vector of pointers cannot be modified using the index operator.\n\nConsider the statement below:\n~~~\nconst Point* pt = scat_plt[35];\n~~~\nIf scat_plot contains 36 or more points, pt will be assigned the address of the Point at index 35 of the points vector. In the case that the points vector contains fewer than 36 points, nullptr will be assigned to pt.\n\n# Implement a find() method\nThe {{find()}} method accepts a Point object and returns true if the point is contained in the ScatPlot on which its invoked and false otherwise.\n\n# Implement the Boolean Operator\nWhen evaluated in a boolean context, the ScatPlot object will indicate whether or not it is currently displayed. You do not have to implement any behavior that displays or hides the ScatPlot object.\n\nThe following code (sp is a ScatPlot object) will compile and result in the correct output:\n~~~\nif (sp) { cout \u003c\u003c \"Currently displayed\"; }\n~~~\nNote that based on your implementation, the following statement will result in a compilation error.\n~~~\ncout \u003c\u003c sp + 1;\n~~~","testMine":true,"test":"int main() {\n    ScatPlot sp(\"Heights\", \"red\", true);\n    sp.add(1, 2);\n    sp.add(3, 4);\n    cout \u003c\u003c sp \u003c\u003c endl;\n    if (sp) { cout \u003c\u003c \"Currently displayed\" \u003c\u003c endl; }\n\n    const Point* pt = sp[1];\n    cout \u003c\u003c *pt \u003c\u003c ' ' \u003c\u003c (sp[35] == nullptr) \u003c\u003c endl;\n    cout \u003c\u003c sp.find(Point(3, 4)) \u003c\u003c sp.find(Point(9, 9)) \u003c\u003c endl;\n\n    ScatPlot copy(sp);                  // copy constructor\n    ScatPlot other(\"Other\", \"blue\", false);\n    other = copy;                       // assignment operator\n    cout \u003c\u003c other \u003c\u003c endl;\n}","output":"ScatPlot: Heights; color: red; points: (1, 2) (3, 4)\nCurrently displayed\n(3, 4) 1\n10\nScatPlot: Heights; color: red; points: (1, 2) (3, 4)","solution":"class ScatPlot : public Plot {\n    friend ostream& operator\u003c\u003c(ostream& os, const ScatPlot& rhs) {\n        os \u003c\u003c \"ScatPlot: \" \u003c\u003c rhs.get_title() \u003c\u003c \"; color: \" \u003c\u003c rhs.color\n           \u003c\u003c \"; points:\";\n        for (const Point* pp : rhs.points) {\n            os \u003c\u003c ' ' \u003c\u003c *pp;\n        }\n        return os;\n    }\n\npublic:\n    ScatPlot(const string& title, const string& color, bool displayed = false)\n        : Plot(title), color(color), displayed(displayed) {}\n\n    // Destructor\n    ~ScatPlot() {\n        for (Point* pp : points) {\n            delete pp;\n        }\n    }\n\n    // Copy constructor\n    ScatPlot(const ScatPlot& rhs)\n        : Plot(rhs), color(rhs.color), displayed(rhs.displayed) {\n        for (const Point* pp : rhs.points) {\n            points.push_back(new Point(*pp));\n        }\n    }\n\n    // Assignment operator\n    ScatPlot& operator=(const ScatPlot& rhs) {\n        if (this != &rhs) {\n            for (Point* pp : points) {\n                delete pp;\n            }\n            points.clear();\n            Plot::operator=(rhs);\n            color = rhs.color;\n            displayed = rhs.displayed;\n            for (const Point* pp : rhs.points) {\n                points.push_back(new Point(*pp));\n            }\n        }\n        return *this;\n    }\n\n    // Returns the pointer by value, so the vector itself cannot be changed.\n    const Point* operator[](size_t index) const {\n        if (index >= points.size()) return nullptr;\n        return points[index];\n    }\n\n    bool find(const Point& target) const {\n        for (const Point* pp : points) {\n            if (*pp == target) return true;     // compare the Points\n        }\n        return false;\n    }\n\n    // explicit: if (sp) works, but sp + 1 does not compile\n    explicit operator bool() const { return displayed; }\n\n    // (the points are \"just there\": the exam gives no method for adding them)\n\nprivate:\n    string color;\n    bool displayed;\n    vector\u003cPoint*> points;\n};","rubric":["Inheritance: class ScatPlot : public Plot.","Constructor: Plot(title) and both members in the initialization list.","Output operator: title (through get_title()), color and every point.","Destructor: delete every Point. A ranged for that sets pointers to nullptr needs a reference (half a point).","Copy constructor: Plot(rhs) in the initialization list, and the string member initialized there too (1 point).","Assignment operator: all six steps, including return *this (2 points for a missing return).","operator[]: nullptr when the index is too big, and it returns the pointer by value. The rubric accepted a return type of Point*.","operator bool: returns the displayed flag. It must be explicit, or sp + 1 would compile.","find: const method, const Point& parameter, compares *pp == target."],"notes":"The scanned copy has the student's work whited out, so the rubric items above are the ones Gradescope listed. That student scored 46.5 out of 50."},{"max":50,"gradeNote":"The output format is the student's choice. The exam gives no method for adding Zerglings, so the student does not write one.","id":"broodwar","title":"BroodWar","pts":"50 pts","exams":[["S2020",12]],"skills":["Inheritance","All of copy control","Output operator","Equality operator","operator bool"],"spec":"Define a class **BroodWar**\n\nThe class BroodWar will inherit from the class {{Starcraft}}.\n\nStarcraft\n- has a constructor that takes an int representing your registration code.\n- It also has any necessary operators and supports copy control. You should not need to know anything more about the class Starcraft.\n- NB: you are **not responsible** for defining the Starcraft class.\n\nBroodWar has two fields, the player's name and a collection of {{Zergling}} pointers. There may be lots of different types of Zerglings, but we won't be responsible for defining those derived classes here.\n\nThe Zerglings will all be on the heap. Do not worry about how they got there. They just are.\n\nYou are **not responsible** for defining the Zergling class. Zerglings support copy control, along with all necessary operators\n\nYou are only responsible for defining the BroodWar class and providing the following functionality:\n\nA constructor taking in the player's name and registration code.\n\nCopy **control**. Yes, **all of it**.\n- Naturally, copying should involve making a deep copy. Don't just copy pointers!\n\nAn output operator.\n- You may choose the format. Obviously all of the information you have about your BroodWar instance should be included.\n- Don't worry about printing information contained in the Starcraft class.\n\nAn equality operator.\n- Two BroodWar instances are considered equal if all of the corresponding Zerglings are equal, i.e.:\n  - there are the same number of Zerglings\n  - each Zergling in one BroodWar matches (is equal to) the Zergling in the same position of the collection in the other BroodWar.\n- NB, the Zerglings do not have to have the same address in memory to be \"equal\".\n\nGiven that {{brood}} is an instance of BroodWar, then the code:\n~~~\nif (brood) { cout \u003c\u003c \"There be Zerglings!\"; }\n~~~\nshould print out \"There be Zerglings!\" if and only if that brood has any zerglings.","testMine":true,"test":"int main() {\n    BroodWar brood(\"Kerrigan\", 1998);\n    if (!brood) { cout \u003c\u003c \"No Zerglings yet\" \u003c\u003c endl; }\n    brood.add(\"Zip\");\n    brood.add(\"Zap\");\n    if (brood) { cout \u003c\u003c \"There be Zerglings!\" \u003c\u003c endl; }\n    cout \u003c\u003c brood \u003c\u003c endl;\n\n    BroodWar copy(brood);               // copy constructor\n    cout \u003c\u003c (copy == brood) \u003c\u003c endl;    // 1\n    BroodWar other(\"Raynor\", 7);\n    cout \u003c\u003c (other == brood) \u003c\u003c endl;   // 0\n    other = brood;                      // assignment operator\n    cout \u003c\u003c other \u003c\u003c endl;\n}","output":"No Zerglings yet\nThere be Zerglings!\nPlayer: Kerrigan; Zerglings: Zip Zap\n1\n0\nPlayer: Kerrigan; Zerglings: Zip Zap","solution":"class BroodWar : public Starcraft {\n    friend ostream& operator\u003c\u003c(ostream& os, const BroodWar& rhs) {\n        os \u003c\u003c \"Player: \" \u003c\u003c rhs.name \u003c\u003c \"; Zerglings:\";\n        for (const Zergling* zp : rhs.zerglings) {\n            os \u003c\u003c ' ' \u003c\u003c *zp;\n        }\n        return os;\n    }\n\n    friend bool operator==(const BroodWar& lhs, const BroodWar& rhs) {\n        if (lhs.zerglings.size() != rhs.zerglings.size()) return false;\n        for (size_t i = 0; i \u003c lhs.zerglings.size(); ++i) {\n            if (!(*lhs.zerglings[i] == *rhs.zerglings[i])) return false;\n        }\n        return true;\n    }\n\npublic:\n    BroodWar(const string& name, int code) : Starcraft(code), name(name) {}\n\n    ~BroodWar() {\n        for (Zergling* zp : zerglings) {\n            delete zp;\n        }\n    }\n\n    BroodWar(const BroodWar& rhs) : Starcraft(rhs), name(rhs.name) {\n        for (const Zergling* zp : rhs.zerglings) {\n            zerglings.push_back(new Zergling(*zp));\n        }\n    }\n\n    BroodWar& operator=(const BroodWar& rhs) {\n        if (this != &rhs) {\n            for (Zergling* zp : zerglings) {\n                delete zp;\n            }\n            zerglings.clear();\n            Starcraft::operator=(rhs);\n            name = rhs.name;\n            for (const Zergling* zp : rhs.zerglings) {\n                zerglings.push_back(new Zergling(*zp));\n            }\n        }\n        return *this;\n    }\n\n    explicit operator bool() const { return zerglings.size() != 0; }\n\n    // (the Zerglings \"just are\" there: the exam gives no method for adding them)\n\nprivate:\n    string name;\n    vector\u003cZergling*> zerglings;\n};","rubric":["Everything on the Skyrim checklist, with Starcraft(code) taking an int.","operator bool() const: true if and only if the collection is not empty."],"notes":"This is the Skyrim problem with different names and one addition, operator bool. The Spring 2020 copy is a blank exam, so there is no graded answer to compare against."},{"max":50,"gradeNote":"NerdPower and Manager are written by someone else. Helper method names are the student's choice. The output must match the expected output.","id":"geek","title":"Company, Employee and Geek","pts":"50 pts","exams":[["F2018",11]],"skills":["Inheritance","Abstract base class","Virtual display","Two-way pointers","Output operator"],"spec":"You will define / implement the three classes **Company**, **Employee** and **Geek** described below\n- Your code should generate the same output as shown below\n- Companies hire employees.\n  - One company can have many employees.\n  - One employee can belong to at most one company.\n- There are many types of employees: managers, secretaries, security, building maintenance and, of course, geeks!\n  - The only employee classes that you have to implement are Employee and Geek. Other programmers will implement the other types of employees.\n  - Employees all have names and salaries.\n  - The different employee types are each special in some way.\n    - Geeks, for example, have something called Nerd Power.\n      - It is composed of their IQ and the number of baths that they take in a year.\n      - Assume there is a class {{NerdPower}}. But someone else is writing it.\n      - The class Geek will need to have a NerdPower member variable.\n      - NerdPower will have a constructor that takes the two integer values representing the IQ and the number of baths taken per year.\n      - NerdPower will have an overloaded output operator.\n    - Managers are known for how lame they are. But, again, you are not implementing the Manager class, so you don't really need to know that. You may assume the Manager class has any functions overloaded that are needed for the test code to work.\n  - **Hiring**: a company is not allowed to hire someone who already has a job.\n    - Happily we only have to worry about hiring them. Our recruiting department is so good that we never need to fire anyone and everyone is so happy that they don't want to quit!\n- Displaying:\n  - each type of employee will have different stuff to be displayed in addition to their name and salary. Your code for Company should still work even if new types of employees are created.\n  - Note that we use an **output operator** to display the Company\n  - The company in turn uses output operator(s) to display its employees.\n  - Each new type of Employee is responsible for correctly displaying itself.\n    - And no, we never create an instance of the Employee class.\n- **Note that you can ask an employee how many people there are in the company he or she is a member of.** There is an example in the sample where Dilbert provides that information (for the Losers R Us company).\n- Do NOT copy the test code into your blue book unless you really just like wasting time.","test":"int main() {\n\n    Company loser(\"Losers R Us\");\n\n    // Dilbert, a Geek, has a salary of $200K,\n    // has IQ of 150 and takes 20 baths per year.\n    Geek dilbert(\"Dilbert\", 200, 150, 20);\n\n    // Wally's, another Geek, but has a salary of only $150K,\n    // an IQ of 120 and takes 10 baths per year.\n    Geek wally(\"Wally\", 150, 120, 10);\n\n    // Pointy Hair is a manager, has a salary\n    // of $50K, and has a lameness value of 1000.\n    Manager pointy(\"Pointy Hair\", 50, 1000);\n\n    loser.hire(dilbert);\n    loser.hire(wally);\n    loser.hire(pointy);\n\n    cout \u003c\u003c \"================\\n\";\n    cout \u003c\u003c loser;\n    cout \u003c\u003c \"================\\n\";\n    cout \u003c\u003c \"Dilbert says the company's size is: \"\n         \u003c\u003c dilbert.getDivSize() \u003c\u003c endl;\n}","output":"================\nCompany: Losers R Us\nGeek: Dilbert; Salary: $200K; IQ: 150; Baths per year: 20\nGeek: Wally; Salary: $150K; IQ: 120; Baths per year: 10\nManager: Pointy Hair; Salary: $50K; Lameness: 1000\n================\nDilbert says the company's size is: 3","solution":"class Company;\n\nclass Employee {\n    friend ostream& operator\u003c\u003c(ostream& os, const Employee& rhs) {\n        rhs.display(os);        // virtual: each type displays itself\n        return os;\n    }\n\npublic:\n    Employee(const string& name, int salary)\n        : name(name), salary(salary), employer(nullptr) {}\n    virtual ~Employee() {}\n\n    // Pure virtual: we never create a plain Employee\n    virtual void display(ostream& os) const = 0;\n\n    bool hasJob() const { return employer != nullptr; }\n    void setEmployer(Company* comp) { employer = comp; }\n    size_t getDivSize() const;      // needs Company, so defined below\n\nprotected:\n    // The part every type of employee prints\n    void displayBasics(ostream& os) const {\n        os \u003c\u003c name \u003c\u003c \"; Salary: $\" \u003c\u003c salary \u003c\u003c \"K\";\n    }\n\nprivate:\n    string name;\n    int salary;\n    Company* employer;\n};\n\nclass Geek : public Employee {\npublic:\n    Geek(const string& name, int salary, int iq, int baths)\n        : Employee(name, salary), power(iq, baths) {}\n\n    void display(ostream& os) const override {\n        os \u003c\u003c \"Geek: \";\n        displayBasics(os);\n        os \u003c\u003c \"; \" \u003c\u003c power;\n    }\n\nprivate:\n    NerdPower power;\n};\n\nclass Company {\n    friend ostream& operator\u003c\u003c(ostream& os, const Company& rhs) {\n        os \u003c\u003c \"Company: \" \u003c\u003c rhs.name \u003c\u003c endl;\n        for (const Employee* emp : rhs.employees) {\n            os \u003c\u003c *emp \u003c\u003c endl;\n        }\n        return os;\n    }\n\npublic:\n    Company(const string& name) : name(name) {}\n\n    bool hire(Employee& emp) {\n        if (emp.hasJob()) return false;     // already has a job\n        employees.push_back(&emp);\n        emp.setEmployer(this);\n        return true;\n    }\n\n    size_t size() const { return employees.size(); }\n\nprivate:\n    string name;\n    vector\u003cEmployee*> employees;\n};\n\nsize_t Employee::getDivSize() const {\n    if (!employer) return 0;\n    return employer->size();\n}","rubric":["Employee is abstract: a pure virtual display method, so nobody can create a plain Employee.","Employee has an output operator that calls the virtual display, so Company never needs to know the employee type.","Geek : public Employee, with Employee(name, salary) and power(iq, baths) in the initialization list.","Geek::display has the same signature as the base method, including const.","The Company stores Employee pointers, never Employee objects (objects would be sliced).","hire takes the Employee by reference, refuses anyone who already has a job, and sets the pointer in both directions.","getDivSize is defined after Company, because it calls a Company method.","Employee has a virtual destructor."],"notes":"There is no copy control here because the employees are local variables in main, not on the heap. The test code on the exam declared the company as \"losers\" and then used \"loser\". It is written consistently above. The Fall 2018 scan does not include the student's blue book, so there is no graded answer to compare against."},{"max":54,"gradeNote":"addIngredient is provided by someone else. For Food, the destructor and copy constructor need only prototypes.","id":"food","title":"Food and Chocolate","pts":"54 pts","exams":[["S2018",11]],"skills":["Dynamic array","Inheritance","Copy control in base and derived","operator bool","Output operator"],"spec":"For this question you will define two classes: **Food** and **Chocolate**.\n\nOn the back of every food product in a store is a list of the ingredients in that food. The list varies in size from one piece of food to another. We are working on a system with such limited memory that using the vector class is not feasible. Please create a Food class which stores the ingredient list as a dynamic array of strings. You should also store an integer for the number of ingredients. In our case, the capacity of the dynamic array will always be the same as the number of ingredients, so no need to store that.\n\nSomeone else, not you, will provide a method {{addIngredient}} that takes a string and adds it to the array, doing all the necessary work of expanding the array, so you do not have to worry about it. You don't even have to write its prototype! Isn't that nice?\n\nOf course, for a class like this, copy control (aka \"the Big 3\") is very important. Inside your class you should\n- provide the implementation for the assignment operator. [Yes, write the code for it.]\n- prototypes for the destructor and the copy constructor. You do not have to write the implementations for these two functions.\n\nBe sure to write a default constructor for the class Food. A default food contains no ingredients.\n\nGiven some Food instance aFood, we wish to be able to write the line of code below and have it print the truth, depending on whether or not there are any ingredients in aFood:\n~~~\nif (aFood) { cout \u003c\u003c \"aFood actually has some ingredients!\\n\"; }\n~~~\nFinally, for the Food class, provide: an **output operator**, that prints the ingredients separated by spaces. There can be an extra space at the end if this makes it easier for you. Note that the output operator does not print its own newline. That is left to the code that uses it.\n\nChocolate is a type of food which contains cocoa, along with other ingredients. An important aspect of chocolate is the percentage of cocoa in the chocolate. We will represent chocolate with its own class, Chocolate as described below.\n\nProvide a constructor for Chocolate that will accept an integer value for the percent of cocoa. The default value will be 50, meaning 50%. Be sure that your constructor adds the cocoa as an ingredient! Oh, for reasons beyond our control, you must store the percent of cocoa as a pointer to an int, not just an int. Your Chocolate constructor will allocate the integer value on the heap.\n\nImplement all of the Big 3 for Chocolate.\n\nYou do not need to re-implement the output operator for the Chocolate class. You're right we won't see the amount of cocoa, but we'd rather save you time on this exam.\n\nSo, if you missed any of the points above, this question involves inheritance, copy control and operator overloading. And yet it is still only about three dozen lines which is about the same as the two questions together from the last exam's blue book.","test":"int main() {\n    Food quiche;\n    if (!quiche) {\n        cout \u003c\u003c \"quiche has no ingredients!\\n\";\n    }\n    quiche.addIngredient(\"cheese\");\n    quiche.addIngredient(\"milk\");\n    quiche.addIngredient(\"flour\");\n    cout \u003c\u003c quiche \u003c\u003c endl;\n    Food shroomQuiche(quiche);\n    shroomQuiche.addIngredient(\"mushrooms\");\n    cout \u003c\u003c shroomQuiche \u003c\u003c endl;\n    cout \u003c\u003c quiche \u003c\u003c endl;\n    Chocolate choc;\n    Chocolate choc2(30);\n    cout \u003c\u003c choc \u003c\u003c endl;\n    cout \u003c\u003c choc2 \u003c\u003c endl;\n}","output":"quiche has no ingredients!\ncheese milk flour\nmushrooms cheese milk flour\ncheese milk flour\ncocoa\ncocoa","outputNote":"This is the output as printed on the exam. Where \"mushrooms\" lands in the third line depends on the addIngredient method you are given, not on your code. With an addIngredient that appends, the line reads: cheese milk flour mushrooms.","solution":"class Food {\n    friend ostream& operator\u003c\u003c(ostream& os, const Food& rhs) {\n        for (int i = 0; i \u003c rhs.count; ++i) {\n            os \u003c\u003c rhs.ingredients[i] \u003c\u003c ' ';\n        }\n        return os;\n    }\n\npublic:\n    // A default food has no ingredients\n    Food() : ingredients(nullptr), count(0) {}\n\n    // Big 3: only prototypes for the destructor and copy constructor\n    virtual ~Food();\n    Food(const Food& rhs);\n\n    Food& operator=(const Food& rhs) {\n        if (this != &rhs) {\n            delete [] ingredients;                  // free the old array\n            count = rhs.count;\n            ingredients = new string[count];        // allocate a new one\n            for (int i = 0; i \u003c count; ++i) {       // copy the strings\n                ingredients[i] = rhs.ingredients[i];\n            }\n        }\n        return *this;\n    }\n\n    // Needed for: if (aFood)\n    explicit operator bool() const { return count != 0; }\n\n    // (addIngredient is provided by someone else)\n\nprivate:\n    string* ingredients;\n    int count;\n};\n\nclass Chocolate : public Food {\npublic:\n    Chocolate(int percent = 50) : percentCocoa(new int(percent)) {\n        addIngredient(\"cocoa\");\n    }\n\n    // Destructor\n    ~Chocolate() { delete percentCocoa; }\n\n    // Copy constructor\n    Chocolate(const Chocolate& rhs)\n        : Food(rhs), percentCocoa(new int(*rhs.percentCocoa)) {}\n\n    // Assignment operator\n    Chocolate& operator=(const Chocolate& rhs) {\n        if (this != &rhs) {\n            Food::operator=(rhs);                   // assign the Food part\n            *percentCocoa = *rhs.percentCocoa;      // copy the value, not the pointer\n        }\n        return *this;\n    }\n\nprivate:\n    int* percentCocoa;\n};","rubric":["Food default constructor: set the array pointer to nullptr and the count to 0 (3 points).","Food destructor prototype is virtual, because Chocolate inherits from Food (3 points).","Food assignment: free the old array with delete [], allocate a new one, then copy each string (6 points).","operator bool() const for if (aFood). The graded student wrote operator() instead and lost 3 points.","Output operator loops over the array with an index. Members are private.","Chocolate constructor: allocate the int on the heap with new int(percent), and call addIngredient(\"cocoa\").","Chocolate copy constructor: Food(rhs) in the initialization list (3 points), and new int(*rhs.percentCocoa), not a copy of the pointer (2 points).","Chocolate assignment: Food::operator=(rhs), not Food(rhs) (3 points), and copy the value the pointer points at (2 points).","Chocolate destructor: delete the int."],"notes":"The point values come from the red marks on the scanned blue book. That student lost points on almost every item above."},{"max":50,"gradeNote":"Only prototypes are needed for the Baker destructor and copy constructor, and one version of this exam said to skip them entirely, so do not take points if they are absent. Treat and Bakery are not written by the student.","id":"baker","title":"Baker","pts":"47 to 52 pts","exams":[["S2015",14],["S2014",12],["F2012",12]],"skills":["Pointer to a vector on the heap","Assignment operator","Output operator","Equality operator","Handing over ownership"],"spec":"One of the most important jobs in our country is the baker. He makes all those treats that we crave and that provide us with the energy to study for (and write) exams! **You will implement a class** to represent this important national resource. (Note, you are only implementing the Baker class.)\n\nWhat do bakers do?\n- Make treats! The baker has to create treats on demand, e.g. {{theBaker.bakes(\"Twinkie\");}}\n  - Each treat will be created **on the heap** so it can have a long shelf-life.\n  - The Treat class has\n    - a constructor that takes a string which is that name of the Treat\n    - an output operator that displays the name.\n    - Anything else Treats have is a trade secret. (Ok, they do support copy control.)\n- Deliver the treats to a company, who will in turn package them and sell them (to us!).\n  - This requires that he pass the collection off to the bakery company. After handing the collection over, he is back to having nothing. All those treats, and in fact the container itself that held them now belongs to the company. E.g. {{aCompany.receives(theBaker.delivers());}}\n\nJust to keep life entertaining, we will want to support copy control for our baker.\n- Deep copy, of course.\n- To keep this exam to a reasonable length, you only have to implement the assignment operator. For the other copy control functions, just provide their prototypes in the class and assume someone else will write them for you.\n\nAnd naturally you should provide a reasonable output operator displaying him and his products. See the sample test code and output.\n\nAnd finally, let's have an equality operator. We will consider two bakers to be \"equal\" if they currently have the same number of treats.\n\nSo, what do you have to implement? **Just the Baker class.**\n- You don't have to worry about the bakery company or even defining the Treat class.. (Well, worry all you like, but you are not writing those classes.)\n- You can also assume that Treat provides any needed operators or constructors.\n- The baker has:\n  - a constructor\n  - bakes method\n  - delivers method\n  - output operator\n  - equals operator\n  - copy control\n\nOk, so **how will you represent** all of this? You should be able to work out a good design, but let me \"help\" you.\n- Since the baker hands over the collection of treats that he has baked, he needs to have a pointer to the collection. If the baker does not currently have any treats, then he also should not yet have a collection.\n- No, don't ask me what sort of collection to use. Use whatever you like. But the baker better be free to bake and store as many treats in your container as needed. We don't know how many that will be.\n- And the **collection itself needs to be on the heap**.\n- When the baker bakes a treat, if he has no place to put it, either because he just came on the job or because he just delivered his collection to a company, he will first need to get / create another collection. Where? Again, obviously from the heap.\n- The treats will later be repackaged and sold and eaten, finally being destroyed in the process. No you don't have to represent all of those steps, but clearly the treats must each exist on the heap so they can have an arbitrarily long shelf-life and can be moved about as needed by all the code that will use your class.","test":"int main() {\n    Baker fred(\"fred\");\n    cout \u003c\u003c fred \u003c\u003c endl;\n    fred.bakes(\"Twinkie\");\n    fred.bakes(\"Cupcake\");\n    fred.bakes(\"Twinkie\");\n    fred.bakes(\"Twinkie\");\n    fred.bakes(\"Cupcake\");\n    fred.bakes(\"Wonderbread\");\n    cout \u003c\u003c fred \u003c\u003c endl;\n\n    Baker joe(\"joe\");\n    cout \u003c\u003c joe \u003c\u003c endl;\n    joe = fred;\n    cout \u003c\u003c fred \u003c\u003c endl;   // fred won't have changed\n    cout \u003c\u003c joe \u003c\u003c endl;    // joe should look like fred (same name, etc.)\n\n    // Do not implement Bakery\n    Bakery hostess(\"Hostess\");\n    hostess.receives(fred.delivers());\n    cout \u003c\u003c fred \u003c\u003c endl;   // fred gave away his treats\n    cout \u003c\u003c joe \u003c\u003c endl;    // joe still has his.  (But his name is \"fred\".)\n}","output":"Baker: fred; No treats :-(\nBaker: fred; Twinkie Cupcake Twinkie Twinkie Cupcake Wonderbread.\nBaker: joe; No treats :-(\nBaker: fred; Twinkie Cupcake Twinkie Twinkie Cupcake Wonderbread.\nBaker: fred; Twinkie Cupcake Twinkie Twinkie Cupcake Wonderbread.\nBaker: fred; No treats :-(\nBaker: fred; Twinkie Cupcake Twinkie Twinkie Cupcake Wonderbread.","solution":"class Baker {\n    friend ostream& operator\u003c\u003c(ostream& os, const Baker& rhs) {\n        os \u003c\u003c \"Baker: \" \u003c\u003c rhs.name \u003c\u003c \";\";\n        if (rhs.count() == 0) {\n            os \u003c\u003c \" No treats :-(\";\n        } else {\n            for (const Treat* tp : *rhs.treats) {\n                os \u003c\u003c ' ' \u003c\u003c *tp;\n            }\n            os \u003c\u003c '.';\n        }\n        return os;\n    }\n\n    // Equal means the same number of treats\n    friend bool operator==(const Baker& lhs, const Baker& rhs) {\n        return lhs.count() == rhs.count();\n    }\n\npublic:\n    // A new baker has no collection yet\n    Baker(const string& name) : name(name), treats(nullptr) {}\n\n    // Copy control: prototypes only for these two\n    ~Baker();\n    Baker(const Baker& rhs);\n\n    Baker& operator=(const Baker& rhs) {\n        if (this != &rhs) {\n            // Free the treats and the collection we have now\n            if (treats) {\n                for (Treat* tp : *treats) {\n                    delete tp;\n                }\n                delete treats;\n                treats = nullptr;\n            }\n            // Deep copy\n            name = rhs.name;\n            if (rhs.treats) {\n                treats = new vector\u003cTreat*>;\n                for (const Treat* tp : *rhs.treats) {\n                    treats->push_back(new Treat(*tp));\n                }\n            }\n        }\n        return *this;\n    }\n\n    void bakes(const string& treatName) {\n        if (!treats) {                          // nowhere to put it yet\n            treats = new vector\u003cTreat*>;\n        }\n        treats->push_back(new Treat(treatName));\n    }\n\n    // Hand over the whole collection and go back to having nothing\n    vector\u003cTreat*>* delivers() {\n        vector\u003cTreat*>* result = treats;\n        treats = nullptr;\n        return result;\n    }\n\nprivate:\n    size_t count() const {\n        if (!treats) return 0;\n        return treats->size();\n    }\n\n    string name;\n    vector\u003cTreat*>* treats;\n};","rubric":["The member is a pointer to a vector of Treat pointers, starting as nullptr.","bakes creates the vector on the heap if there is none, then pushes a new Treat created on the heap.","delivers returns the pointer and sets the baker's own pointer to nullptr. It must not delete anything.","Assignment: delete each Treat and then the vector itself, copy the name, create a new vector, and new Treat(*tp) for each one.","Every use of the vector checks for nullptr first.","Output operator matches the sample exactly, including \"No treats :-(\" and the final period.","Equality compares the number of treats, treating no collection as zero.","Prototypes for the destructor and the copy constructor are in the class."],"notes":"The same problem was on Fall 2012, Spring 2014 and Spring 2015. The sample output shows joe printing as \"Baker: fred\" after joe = fred, so the assignment operator copies the name. Spring 2015 said to skip the other two Big 3 functions completely, so the two prototypes were not needed there."},{"max":55,"gradeNote":"removeEmp is provided and is not implemented by the student. The destructor and copy constructor need only prototypes.","id":"school","title":"School and Instructor","pts":"55 pts","exams":[["F2014",11]],"skills":["Two classes that point at each other","Assignment operator","Output operator","Index operator by name"],"spec":"You will define two classes: **School** and **Instructor**. You may assume all of your code is in the the same file with main, i.e. do not create separate header and implementation files.\n- Overview:\n  - A School\n    - has a name and a collection of Instructors. (Don't ask what \"kind\" of collection. You choose.)\n    - can hire Instructors\n  - An Instructor\n    - has a name\n  - All Instructors exist on the **heap**. (Don't forget your instructors. You wouldn't want them to become garbage.)\n  - When an Instructor is hired, the School becomes \"responsible\" for him. (Amusing thought.)\n  - Yes, the two classes do refer to each other. You must handle that.\n- The **School** class will have the following:\n  - **Big 3 / Copy control**\n    - As stated, Instructors when hired become part of the School and so their fortunes live and die with the School. If the School goes under (e.g. ceases to exist) the Instructor does, too... If the School is cloned / copied / duplicated, so are the Instructors.\n    - **Of the Big 3, only implement the assignment operator.** Be sure to provide prototypes for the other two.\n  - **Output operator**. Follow the example output below.\n  - **Index operator** that takes a name and returns the address of the first Instructor in the School with that name. (Yes, there might be other Instructors with the same name.) We will only use the operator to access an Instructor, not to replace him.\n  - **hire** method. It is passed the address of an Instructor.\n    - You may safely assume that the Instructor is on the heap. After all, there isn't any way for you to check.\n    - You can hire an Instructor away from another School. Of course the other School better be informed of this (your responsibility).\n  - **removeEmp** method.\n    - To save time, you **will not implement this method**. You can use it in your code without implementing it.\n    - It is passed the address of an Instructor to be removed.\n    - It only removes the Instructor from the School's vector. It does not modify the Instructor or call any functions to do so.\n  - **Any other functions needed by the program.**\n- The **Instructor** class will have the following:\n  - a constructor that takes the Instructor's name\n  - Any other fields or methods necessary.","test":"int main() {\n    School nyu(\"NYU\");\n    School poly(\"Poly\");\n    cout \u003c\u003c poly \u003c\u003c endl;\n\n    poly.hire(new Instructor(\"Gallagher\"));\n    Instructor* sterling = new Instructor(\"Sterling\");\n    poly.hire(sterling);  // The School is now responsible for Sterling!\n    cout \u003c\u003c poly \u003c\u003c endl;\n\n    // Poly is still responsible for Gallagher after this.\n    Instructor* gallagherPtr = poly[\"Gallagher\"];\n\n    nyu.hire(gallagherPtr);  // Gallagher was hired away from Poly!\n\n    cout \u003c\u003c poly \u003c\u003c endl;\n    cout \u003c\u003c nyu \u003c\u003c endl;\n}","output":"School: Poly; Instructors: none.\nSchool: Poly; Instructors: Gallagher Sterling.\nSchool: Poly; Instructors: Sterling.\nSchool: NYU; Instructors: Gallagher.","solution":"class Instructor;      // School uses Instructor* before Instructor is defined\n\nclass School {\n    friend ostream& operator\u003c\u003c(ostream& os, const School& rhs);\n\npublic:\n    School(const string& name) : name(name) {}\n\n    // Big 3: prototypes only for these two\n    ~School();\n    School(const School& rhs);\n    School& operator=(const School& rhs);\n\n    Instructor* operator[](const string& instName) const;\n    void hire(Instructor* inst);\n    void removeEmp(Instructor* inst);       // given: you do not implement it\n\nprivate:\n    string name;\n    vector\u003cInstructor*> instructors;\n};\n\nclass Instructor {\npublic:\n    Instructor(const string& name) : name(name), school(nullptr) {}\n\n    const string& getName() const { return name; }\n    School* getSchool() const { return school; }\n    void setSchool(School* sp) { school = sp; }\n\nprivate:\n    string name;\n    School* school;\n};\n\n// These need the full Instructor class, so they come after it.\n\nostream& operator\u003c\u003c(ostream& os, const School& rhs) {\n    os \u003c\u003c \"School: \" \u003c\u003c rhs.name \u003c\u003c \"; Instructors:\";\n    if (rhs.instructors.size() == 0) {\n        os \u003c\u003c \" none\";\n    }\n    for (const Instructor* ip : rhs.instructors) {\n        os \u003c\u003c ' ' \u003c\u003c ip->getName();\n    }\n    os \u003c\u003c '.';\n    return os;\n}\n\nInstructor* School::operator[](const string& instName) const {\n    for (Instructor* ip : instructors) {\n        if (ip->getName() == instName) return ip;\n    }\n    return nullptr;\n}\n\nvoid School::hire(Instructor* inst) {\n    if (inst->getSchool() == this) return;              // already ours\n    if (inst->getSchool()) {\n        inst->getSchool()->removeEmp(inst);             // tell the old school\n    }\n    instructors.push_back(inst);\n    inst->setSchool(this);\n}\n\nSchool& School::operator=(const School& rhs) {\n    if (this != &rhs) {\n        for (Instructor* ip : instructors) {\n            delete ip;\n        }\n        instructors.clear();\n        name = rhs.name;\n        for (const Instructor* ip : rhs.instructors) {\n            Instructor* copy = new Instructor(*ip);\n            copy->setSchool(this);          // the copy works for THIS school\n            instructors.push_back(copy);\n        }\n    }\n    return *this;\n}","rubric":["A forward declaration, class Instructor;, before School.","Methods that use Instructor's members are defined after the Instructor class.","Each Instructor holds a pointer back to its School, starting as nullptr.","hire: if the Instructor already has a school, call removeEmp on that school first. Then set the pointer in both directions.","Index operator: takes a const string&, returns Instructor*, returns nullptr when nobody matches.","Assignment: delete the old Instructors, copy the name, create a new Instructor for each one, and point each copy back at this School.","Output: matches the sample, including \"none\" for an empty school and the final period.","Prototypes for the destructor and copy constructor are in the class."],"notes":"The step people miss is the back-pointer in the assignment operator. new Instructor(*ip) copies the old school pointer too, so every copy has to be re-pointed at this School. The Fall 2014 scan does not include the student's blue book."},{"max":55,"gradeNote":"removeEmp is provided and is not implemented by the student. The destructor and copy constructor need only prototypes, and main is not required.","id":"company","title":"Company and Employee","pts":"55 to 58 pts","exams":[["S2013",10],["S2012",13]],"skills":["Two classes that point at each other","Assignment operator","Output operator","Index operator by name"],"spec":"You will define two classes: **Company** and **Employee**. You do not need separate header and implementation files. You may assume all of your code is in the same file with main. Where appropriate, you may define your methods / functions within the class definition.\n- Overview:\n  - A Company\n    - has a name and a collection of Employees.\n    - can hire Employees\n  - An Employee\n    - has a name\n    - can quit his job\n  - All employees exist on the heap.\n  - When an employee is hired, the company becomes \"responsible\" for him.\n  - Yes, the two classes do refer to each other. You must handle that.\n- The **Company** class will have the following:\n  - **Big 3**.\n    - As stated, Employees when hired become part of the Company and so their fortunes live and die with the Company. If the Company goes under the Employee does, too... If the Company is cloned, so are the Employees.\n    - **Of the Big 3, you only have to implement the assignment operator.**\n  - **Output operator.** Follow the example output below.\n  - **Index operator** that takes a name and returns the address of the first Employee in the Company with that name. (Yes, there might be other employees with the same name.) We will only use the operator to access an Employee, not to replace him.\n  - **hire** method. It is passed the address of an Employee.\n    - You may safely assume that the Employee is on the heap. There isn't any way for you to check.\n    - An Employee may not be hired away from another company. i.e. Your company can only hire unemployed employees.\n  - **removeEmp** method.\n    - To save you time, you **do not have to implement this method**. You can use it in your code without implementing it.\n    - It is passed the address of an Employee to be removed.\n    - It only removes the Employee from the Company's vector. It does not modify the Employee or call any functions to do so.\n  - **Any other functions needed by the program.**\n- The **Employee** class will have the following:\n  - a constructor that takes the Employee's name\n  - a quit method. It takes no arguments. It is called on the Employee when he wishes to quit.\n  - Any other methods necessary.","test":"int main() {\n    Company comp(\"hal\");\n    Employee* fred = new Employee(\"fred\");\n    comp.hire(fred);  // The company is now responsible for fred.\n    comp.hire(new Employee(\"mary\"));\n    Employee* maryPtr = comp[\"mary\"];\n    cout \u003c\u003c comp \u003c\u003c endl;\n    maryPtr->quit();\n    cout \u003c\u003c comp \u003c\u003c endl;\n}","output":"Company: hal; Employees: fred mary.\nCompany: hal; Employees: fred.","solution":"class Employee;        // Company uses Employee* before Employee is defined\n\nclass Company {\n    friend ostream& operator\u003c\u003c(ostream& os, const Company& rhs);\n\npublic:\n    Company(const string& name) : name(name) {}\n\n    // Big 3: only the assignment operator is implemented\n    ~Company();\n    Company(const Company& rhs);\n    Company& operator=(const Company& rhs);\n\n    Employee* operator[](const string& empName) const;\n    bool hire(Employee* emp);\n    void removeEmp(Employee* emp);          // given: you do not implement it\n\nprivate:\n    string name;\n    vector\u003cEmployee*> employees;\n};\n\nclass Employee {\npublic:\n    Employee(const string& name) : name(name), employer(nullptr) {}\n\n    const string& getName() const { return name; }\n    bool isHired() const { return employer != nullptr; }\n    void setEmployer(Company* comp) { employer = comp; }\n\n    void quit() {\n        if (employer) {\n            employer->removeEmp(this);      // tell the company\n            employer = nullptr;\n        }\n    }\n\nprivate:\n    string name;\n    Company* employer;\n};\n\n// These need the full Employee class, so they come after it.\n\nostream& operator\u003c\u003c(ostream& os, const Company& rhs) {\n    os \u003c\u003c \"Company: \" \u003c\u003c rhs.name \u003c\u003c \"; Employees:\";\n    for (const Employee* emp : rhs.employees) {\n        os \u003c\u003c ' ' \u003c\u003c emp->getName();\n    }\n    os \u003c\u003c '.';\n    return os;\n}\n\nEmployee* Company::operator[](const string& empName) const {\n    for (Employee* emp : employees) {\n        if (emp->getName() == empName) return emp;\n    }\n    return nullptr;\n}\n\nbool Company::hire(Employee* emp) {\n    if (emp->isHired()) return false;       // cannot hire someone with a job\n    employees.push_back(emp);\n    emp->setEmployer(this);\n    return true;\n}\n\nCompany& Company::operator=(const Company& rhs) {\n    if (this != &rhs) {\n        for (Employee* emp : employees) {\n            delete emp;\n        }\n        employees.clear();\n        name = rhs.name;\n        for (const Employee* emp : rhs.employees) {\n            Employee* copy = new Employee(*emp);\n            copy->setEmployer(this);        // the copy works for THIS company\n            employees.push_back(copy);\n        }\n    }\n    return *this;\n}","rubric":["A forward declaration, class Employee;, before Company.","Each Employee holds a pointer back to its Company, starting as nullptr.","quit calls removeEmp(this) on the company and then sets its own pointer to nullptr.","hire refuses an Employee who already has a job, then sets the pointer in both directions.","Index operator: takes a const string&, returns Employee*, returns nullptr when nobody matches.","Assignment: delete the old Employees, create a new Employee for each one, and point each copy back at this Company.","Output: matches the sample exactly, including the final period.","Company methods that use Employee's members are defined after the Employee class."],"notes":"Spring 2012 asked for a \"complete program\" and did not have the rule about hiring someone who already has a job. Spring 2013 added it. On the Spring 2013 blue book the grader wrote \"Doesn't work\" next to a Company class that was declared twice, and took 3 points in the assignment operator."},{"max":30,"gradeNote":"","id":"person","title":"Person (marriages in Woz)","pts":"30 pts","exams":[["S2011",12]],"skills":["A pointer to another object of the same class","Keeping both sides consistent","Output operator"],"spec":"**Define the class Person.**\n- People in the land of Woz like to get married.\n- Unfortunately, they are not terribly concerned about the sanctity of marriage, which means that when marrying,\n  - a Person may dump (i.e. divorce) their current spouse\n  - or steal someone else's spouse.\n- Your job is to define the class Person so that the code below works correctly. (Note the use of the output operator.)\n- Yes, this involves pointers. Yes, people have to be told if they have been dumped, stolen, etc. **Do not store your spouse's name** in the Person class!\n- Note: the marries method **does not display** anything","test":"int main() {\n    Person john(\"John\"), fred(\"Fred\"), mary(\"Mary\"), sue(\"Sue\");\n    john.marries(mary);    // Fine.\n    mary.marries(fred);    // Mary dumps John for Fred.\n                           // John is not married anymore.\n    john.marries(sue);     // Fine.\n    fred.marries(sue);     // Fred dumps Mary and steals Sue from John.\n                           // Poor John is alone again.  So is Mary\n    cout \u003c\u003c john \u003c\u003c endl;  // Prints: John: married to: No one\n    cout \u003c\u003c mary \u003c\u003c endl;  // Prints: Mary: married to: No one\n    cout \u003c\u003c fred \u003c\u003c endl;  // Prints: Fred: married to: Sue\n    cout \u003c\u003c sue \u003c\u003c endl;   // Prints: Sue: married to: Fred\n}","output":"John: married to: No one\nMary: married to: No one\nFred: married to: Sue\nSue: married to: Fred","solution":"class Person {\n    friend ostream& operator\u003c\u003c(ostream& os, const Person& rhs) {\n        os \u003c\u003c rhs.name \u003c\u003c \": married to: \";\n        if (rhs.spouse) {\n            os \u003c\u003c rhs.spouse->name;\n        } else {\n            os \u003c\u003c \"No one\";\n        }\n        return os;\n    }\n\npublic:\n    Person(const string& name) : name(name), spouse(nullptr) {}\n\n    void marries(Person& other) {\n        if (&other == this) return;         // cannot marry yourself\n\n        // Both people leave whoever they are married to now,\n        // and those people have to be told.\n        if (spouse) {\n            spouse->spouse = nullptr;\n        }\n        if (other.spouse) {\n            other.spouse->spouse = nullptr;\n        }\n\n        // Now the two of them are married to each other.\n        spouse = &other;\n        other.spouse = this;\n    }\n\nprivate:\n    string name;\n    Person* spouse;\n};","rubric":["The spouse is stored as a Person*, starting as nullptr. The spouse's name is not stored.","marries takes the other Person by reference, so &other is the real object.","Both old spouses are set to \"not married\" before the new pointers are set.","Both sides of the new marriage are set: spouse = &other and other.spouse = this.","The output operator checks for nullptr before using spouse->name."],"notes":"Spring 2011 had two free-response questions. This was the first, and the Foo class below was the second."},{"max":31,"gradeNote":"The student does not write Foo's add method, a destructor, a copy constructor or main.","id":"foo","title":"Foo (a vector of Glub pointers)","pts":"31 pts","exams":[["S2011",13]],"skills":["Assignment operator","Equality operator","Deep copy"],"spec":"**Define the class Foo:**\n- Foo has just one field, a vector of Glub pointers. The class Glub has any necessary methods and operators.\n- **Define the assignment operator for Foo.** (Don't bother with the destructor or copy constructor) Naturally, copying should involve making a deep copy. Don't just copy pointers!\n- **Define an equality operator for Foo.** Two Foos are considered equal if all of their Glubs are equal. (I.e. same number of Glubs and each Glub in one Foo matches the Glub in the same position in the other Foo.) The Glubs do not have to have the same address to be equal. And yes, Glub does have an equality operator.\n- Do **NOT** define Glub. Do **NOT** write a main. Just define the class Foo as stated above.\n- **Note: Foo does have a method to add Glubs, but you don't have to write it or use it.** I just mention it, in case you were wondering how the Glubs got there. Also, Glubs are never removed from their Foo. This makes your life easier.","testMine":true,"test":"int main() {\n    Foo a, b;\n    a.add(1);\n    a.add(2);\n    cout \u003c\u003c (a == b) \u003c\u003c endl;   // 0: different sizes\n    b = a;                      // assignment operator, deep copy\n    cout \u003c\u003c (a == b) \u003c\u003c endl;   // 1: equal Glubs at different addresses\n    b.add(3);\n    cout \u003c\u003c (a == b) \u003c\u003c endl;   // 0\n    a = a;                      // self-assignment must be safe\n    cout \u003c\u003c (a == a) \u003c\u003c endl;   // 1\n}","output":"0\n1\n0\n1","solution":"class Foo {\n    friend bool operator==(const Foo& lhs, const Foo& rhs) {\n        if (lhs.glubs.size() != rhs.glubs.size()) return false;\n        for (size_t i = 0; i \u003c lhs.glubs.size(); ++i) {\n            // compare the Glubs, not their addresses\n            if (!(*lhs.glubs[i] == *rhs.glubs[i])) return false;\n        }\n        return true;\n    }\n\npublic:\n    Foo& operator=(const Foo& rhs) {\n        if (this != &rhs) {\n            for (Glub* gp : glubs) {            // free the Glubs we own\n                delete gp;\n            }\n            glubs.clear();\n            for (const Glub* gp : rhs.glubs) {  // deep copy\n                glubs.push_back(new Glub(*gp));\n            }\n        }\n        return *this;\n    }\n\n    // (Foo's method for adding Glubs is provided by the exam)\n\nprivate:\n    vector\u003cGlub*> glubs;\n};","rubric":["Assignment: self-check, delete each old Glub, clear the vector, new Glub(*gp) for each one, return *this.","Equality: compare the sizes first, then compare *lhs.glubs[i] with *rhs.glubs[i].","The equality operator takes both sides by const reference.","The only field is vector\u003cGlub*>."],"notes":"This is the copy-control core of every later free response, without the inheritance."}],"frqLosses":["Constructor: call the base-class constructor in the initialization list. (4 points on Fall 2023.)","Copy constructor: put Base(rhs) in the initialization list (5 points on Fall 2023, 3 on Spring 2018), and initialize string members there too (1 point on Spring 2023).","Deep copy: push_back(new Thing(*ptr)) for every pointer. Copying the pointers themselves is a shallow copy (2 points each time on Spring 2018).","Assignment operator, in this order: check for self-assignment, free what you own, call Base::operator=(rhs), copy the members, deep copy, return *this. The body was worth 15 points on Fall 2023, and a missing return cost 2 on Spring 2023.","Destructor: delete every object you own. If you set the pointers to nullptr inside a ranged for, the loop variable must be a reference, or you are only changing a copy (half a point on Spring 2023 and Fall 2025). Leaving that line out is fine.","const: any method that does not change the object must be marked const (2 points on Fall 2023, 5 on Fall 2017), and strings and objects are passed as const references (4 points on Fall 2017).","Looping over pointers inside a const function or over rhs: write for (const Team* tp : rhs.teams).","If the test code says if (obj), you need operator bool() const (4 points on Fall 2023). Make it explicit when the question says obj + 1 must not compile.","A base class you write yourself needs a virtual destructor (3 points on Spring 2018).","Output operator: a friend, non-member function that returns os and prints everything the question lists. Dereference the pointers, or you print addresses."]};</script>
<script>
(function () {
  'use strict';
  var Q = DATA.questions, QBY = {}, TOPIC = {}, EXAM = {};
  Q.forEach(function (q) { QBY[q.id] = q; });
  DATA.topics.forEach(function (t) { TOPIC[t.id] = t.name; });
  var SHORT = {}, NEX = DATA.exams.length;
  DATA.exams.forEach(function (e) { EXAM[e.id] = e.name; SHORT[e.id] = e.short || e.name; });
  var EXAMS_NEWEST = DATA.exams.slice().reverse();
  document.getElementById('sub').textContent = 'C++ · built from ' + NEX + ' past Exam Twos, ' + DATA.exams[0].name + ' to ' + DATA.exams[NEX - 1].name;
  var LETTERS = 'abcdefghijklmnopqrstuvwxyz';
  var MOCK_MINUTES = 30;
  var LS_KEY = 'oop-mt2-progress-v1';
  var app = document.getElementById('app');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  /* ───────── progress ───────── */
  var P = { v: 1, q: {}, mocks: [], f: {} };
  var FBY = {};
  DATA.frqs.forEach(function (f) { FBY[f.id] = f; });
  function clean(p) {
    var out = { v: 1, q: {}, mocks: [], f: {} };
    if (p && typeof p === 'object') {
      if (p.q && typeof p.q === 'object') Object.keys(p.q).forEach(function (id) {
        var r = p.q[id];
        if (QBY[id] && r && r.n > 0) out.q[id] = { n: +r.n || 0, c: +r.c || 0, last: r.last ? 1 : 0, t: +r.t || 0 };
      });
      if (p.f && typeof p.f === 'object') Object.keys(p.f).forEach(function (id) { if (FBY[id] && +p.f[id] > 0) out.f[id] = +p.f[id]; });
      if (Array.isArray(p.mocks)) out.mocks = p.mocks.filter(function (m) { return m && m.t && m.total; }).map(function (m) { return { t: +m.t, score: +m.score || 0, total: +m.total, secs: +m.secs || 0 }; });
    }
    return out;
  }
  function merge(a, b) {
    var out = clean(a); b = clean(b);
    Object.keys(b.q).forEach(function (id) { if (!out.q[id] || b.q[id].t > out.q[id].t) out.q[id] = b.q[id]; });
    Object.keys(b.f).forEach(function (id) { if (!out.f[id] || b.f[id] > out.f[id]) out.f[id] = b.f[id]; });
    var seen = {}; out.mocks.forEach(function (m) { seen[m.t] = 1; });
    b.mocks.forEach(function (m) { if (!seen[m.t]) out.mocks.push(m); });
    out.mocks.sort(function (x, y) { return x.t - y.t; });
    out.mocks = out.mocks.slice(-20);
    return out;
  }
  function loadLocal() { try { var s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) {} return null; }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {} }

  var remoteRef = null, writing = false, dirty = false, writeTimer = null, retries = 0, syncState = 'checking';
  function setSync(s) {
    syncState = s;
    var el = document.getElementById('sync');
    el.textContent = s === 'account' ? 'Your progress is saved to your account, so it follows you to other devices.'
      : s === 'checking' ? 'Loading your saved progress…'
      : 'Your progress is saved in this browser only.';
  }
  function save() { saveLocal(); if (remoteRef) { dirty = true; clearTimeout(writeTimer); writeTimer = setTimeout(flush, 1200); } }
  function flush() {
    if (writing || !dirty || !remoteRef) return;
    writing = true; dirty = false;
    remoteRef.set(JSON.parse(JSON.stringify(P))).then(function () { retries = 0; }, function (e) {
      var code = e && e.code;
      if ((code === 'unavailable' || code === 'resource_exhausted') && retries < 2) { retries++; dirty = true; }
      else { remoteRef = null; setSync('local'); }
    }).then(function () {
      writing = false;
      if (dirty && remoteRef) { clearTimeout(writeTimer); writeTimer = setTimeout(flush, 2500); }
    });
  }
  function initSync() {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
    var settled = false;
    var limit = setTimeout(function () { if (!settled) { settled = true; setSync('local'); } }, 12000);
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (uid) {
        if (!uid) return null;
        var ref = db.doc('data/users/' + uid + '/progress');
        return ref.get().then(function (snap) { return { ref: ref, wref: db.doc('data/users/' + uid + '/frqwork'), data: snap.exists ? snap.data() : null }; });
      });
    }).then(function (res) {
      if (settled) return; settled = true; clearTimeout(limit);
      if (!res) { setSync('local'); return; }
      var remote = clean(res.data);
      var merged = merge(P, remote);
      var changedLocal = JSON.stringify(merged) !== JSON.stringify(P);
      P = merged; saveLocal();
      remoteRef = res.ref; setSync('account');
      attachWork(res.wref);
      if (JSON.stringify(merged) !== JSON.stringify(remote) && (Object.keys(merged.q).length || Object.keys(merged.f).length)) { dirty = true; flush(); }
      if (changedLocal) render();
    }).catch(function () { if (!settled) { settled = true; clearTimeout(limit); setSync('local'); } });
  }
  function record(id, ok) {
    var r = P.q[id] || { n: 0, c: 0, last: 0, t: 0 };
    r.n++; if (ok) r.c++; r.last = ok ? 1 : 0; r.t = Date.now();
    P.q[id] = r;
  }
  function statusOf(q) { var r = P.q[q.id]; return !r ? 'new' : r.last ? 'right' : 'missed'; }
  function tally(list) {
    var t = { total: list.length, right: 0, missed: 0, fresh: 0, n: 0, c: 0 };
    list.forEach(function (q) { var r = P.q[q.id]; if (!r) { t.fresh++; return; } t.n += r.n; t.c += r.c; if (r.last) t.right++; else t.missed++; });
    return t;
  }

  /* ───────── question rendering ───────── */
  var KW = /^(class|struct|public|private|protected|virtual|const|return|new|delete|for|if|else|friend|explicit|override|operator|this|nullptr|true|false)$/;
  var TY = /^(int|double|void|bool|string|vector|ostream|size_t)$/;
  function hl(code) {
    var re = /(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|([A-Za-z_]\w*)|(\d+)/g, out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index)); last = re.lastIndex;
      if (m[1]) out += '<span class="c' + (/\b(line [A-H]|THIS LINE)\b/i.test(m[1]) ? ' m' : '') + '">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
      else if (m[3]) out += KW.test(m[3]) ? '<span class="k">' + m[3] + '</span>' : TY.test(m[3]) ? '<span class="t">' + m[3] + '</span>' : m[3];
      else out += '<span class="n">' + m[4] + '</span>';
    }
    return out + esc(code.slice(last));
  }
  function sourceChips(q) {
    var h = '';
    if (q.kind === 'new') h += '<span class="chip warn">New variation, not from a past exam</span>';
    else {
      h += '<span class="chip">' + esc(EXAM[q.exams[0][0]]) + ' · Q' + q.exams[0][1] + '</span>';
      if (q.exams.length > 1) h += '<span class="chip ' + (q.exams.length >= 4 ? 'hot' : 'plain') + '">on ' + q.exams.length + ' of the ' + NEX + ' exams</span>';
      if (q.kind === 'adapted') h += '<span class="chip plain">Short answer on the exam, rewritten as multiple choice</span>';
    }
    h += '<span class="chip plain">' + esc(TOPIC[q.topic]) + '</span>';
    return h;
  }
  function isCompact(q) { return q.options.length >= 6 && q.options.every(function (o) { return o.length <= 12; }); }
  // mode: 'ask' (clickable), 'reveal' (show right/wrong), 'select' (mock: clickable, shows selection only)
  function optsHTML(q, picked, mode, act) {
    var h = '<ol class="opts' + (isCompact(q) ? ' compact' : '') + '">';
    q.options.forEach(function (o, i) {
      var cls = 'opt' + (q.mono ? ' mono' : ''), tag = '', dis = '';
      if (mode === 'reveal') {
        dis = ' disabled';
        if (i === q.answer) { cls += ' right'; tag = picked === i ? '✓ Your answer' : '✓ Correct answer'; }
        else if (i === picked) { cls += ' wrong'; tag = '✗ Your answer'; }
        else cls += ' dim';
      } else if (mode === 'select' && i === picked) cls += ' sel';
      h += '<li><button type="button" class="' + cls + '" data-act="' + act + '" data-i="' + i + '"' + dis + '>' +
        '<span class="ltr">' + LETTERS[i] + '.</span><span class="txt">' + esc(o) + '</span>' +
        (tag ? '<span class="tag">' + tag + '</span>' : '<span></span>') + '</button></li>';
    });
    return h + '</ol>';
  }
  function basisText(q) {
    var k = q.basis.indexOf('key') >= 0, r = q.basis.indexOf('run') >= 0;
    if (q.kind === 'new') return 'Answer checked by compiling and running this code with g++.';
    if (k && r) return 'Answer confirmed two ways: the grader’s marks on the scanned exam, and compiling the code with g++.';
    if (k) return 'Answer confirmed by the grader’s marks on the scanned exam.';
    return 'The scanned copy does not show the correct answer for this one. The answer here was confirmed by compiling and running the code with g++.';
  }
  function explainHTML(q) {
    return '<p>' + esc(q.explain) + '</p>' +
      '<div class="rule"><b>Rule to remember</b>' + esc(q.rule) + '</div>' +
      (q.exams.length > 1 ? '<p class="basis">Asked on: ' + q.exams.map(function (e) { return esc(EXAM[e[0]]) + ' Q' + e[1]; }).join(', ') + '.</p>' : '') +
      '<p class="basis">' + esc(basisText(q)) + '</p>';
  }
  function bodyHTML(q) {
    return '<p class="prompt">' + esc(q.prompt) + '</p>' + (q.code ? '<pre class="code"><code>' + hl(q.code) + '</code></pre>' : '');
  }

  /* ───────── views ───────── */
  var view = 'overview';
  var prac = null;   // { topic, src, status, queue, i, picked, right, done }
  var mock = null;   // { phase, qs, ans, cur, start, secs, score, confirm }
  var mockTick = null;
  var resetAsk = false;

  function filterQs(f) {
    return Q.filter(function (q) {
      if (f.topic !== 'all' && q.topic !== f.topic) return false;
      if (f.src === 'new' && q.kind !== 'new') return false;
      if (f.src === 'past' && q.kind === 'new') return false;
      if (EXAM[f.src] && !q.exams.some(function (e) { return e[0] === f.src; })) return false;
      if (f.status !== 'all' && statusOf(q) !== f.status) return false;
      return true;
    });
  }
  function startPractice(f) {
    var list = filterQs(f);
    if (EXAM[f.src]) list.sort(function (a, b) {
      var n = function (q) { return q.exams.filter(function (e) { return e[0] === f.src; })[0][1]; };
      return n(a) - n(b);
    }); else list = shuffle(list);
    prac = { topic: f.topic, src: f.src, status: f.status, queue: list.map(function (q) { return q.id; }), i: 0, picked: null, right: 0, done: 0 };
  }
  function go(v) { if (location.hash !== '#' + v) location.hash = v; else { view = v; render(); } }

  function renderTabs() {
    var missed = Q.filter(function (q) { return statusOf(q) === 'missed'; }).length;
    var tabs = [['overview', 'Overview'], ['practice', 'Practice'], ['mock', 'Mock exam'], ['frq', 'Free response'], ['rules', 'Rules that repeat']];
    document.getElementById('tabs').innerHTML = tabs.map(function (t) {
      return '<a href="#' + t[0] + '"' + (view === t[0] ? ' aria-current="page"' : '') + '>' + t[1] +
        (t[0] === 'practice' && missed ? '<span class="count" title="Questions to review">' + missed + '</span>' : '') + '</a>';
    }).join('');
  }

  function overviewHTML() {
    var all = tally(Q), past = Q.filter(function (q) { return q.kind !== 'new'; }).length;
    var h = '<div><h1>' + NEX + ' past exams, one question bank</h1><p class="lead">' + past + ' multiple-choice questions from Exam Twos between ' + DATA.exams[0].name + ' and ' + DATA.exams[NEX - 1].name + ', plus ' + (Q.length - past) +
      ' new variations on the traps that keep coming back. Every answer was checked against the grader’s marks or by compiling the code.</p></div>';
    h += '<div class="stats">' +
      '<div class="stat"><div class="v num">' + (all.total - all.fresh) + '<small> / ' + all.total + '</small></div><div class="l">questions tried</div></div>' +
      '<div class="stat"><div class="v num">' + (all.n ? pct(all.c, all.n) + '%' : '–') + '</div><div class="l">of all attempts correct</div></div>' +
      '<div class="stat good"><div class="v num">' + all.right + '</div><div class="l">right on your last try</div></div>' +
      '<div class="stat bad"><div class="v num">' + all.missed + '</div><div class="l">to review</div></div></div>';
    h += '<div class="row">' +
      '<button class="btn primary" data-act="practice" data-status="' + (all.fresh ? 'new' : 'all') + '">' + (all.fresh ? 'Practice ' + plural(all.fresh, 'new question') : 'Practice all questions') + '</button>' +
      '<button class="btn" data-act="practice" data-status="missed"' + (all.missed ? '' : ' disabled') + '>Review ' + all.missed + ' missed</button>' +
      '<a class="btn" href="#mock">Take a timed mock exam</a>' +
      '<a class="btn" href="#frq">Free-response problems (' + DATA.frqs.length + ')</a></div>';

    h += '<section><div class="section-head"><h2>By topic</h2><p>How many of the ' + NEX + ' exams tested each topic is shown under its name.</p></div><div class="list">';
    DATA.topics.forEach(function (t) {
      var qs = Q.filter(function (q) { return q.topic === t.id; }), s = tally(qs), ex = {};
      qs.forEach(function (q) { q.exams.forEach(function (e) { ex[e[0]] = 1; }); });
      var nEx = Object.keys(ex).length;
      h += '<div class="trow"><div class="name">' + esc(t.name) + '<small>on ' + nEx + ' of ' + NEX + ' exams · ' + plural(qs.length, 'question') + '</small></div>' +
        '<div class="bar" role="img" aria-label="' + s.right + ' right, ' + s.missed + ' to review, ' + s.fresh + ' not tried"><i class="r" style="width:' + (100 * s.right / s.total) + '%"></i><i class="w" style="width:' + (100 * s.missed / s.total) + '%"></i></div>' +
        '<div class="frac">' + s.right + ' / ' + s.total + ' right</div>' +
        '<button class="btn small" data-act="practice" data-topic="' + t.id + '">Practice</button></div>';
    });
    h += '</div><div class="legend"><span><i style="background:var(--good)"></i>Right on your last try</span><span><i style="background:var(--bad)"></i>To review</span><span><i style="background:var(--line)"></i>Not tried yet</span></div></section>';

    h += '<section><div class="section-head"><h2>By exam</h2><p>Work through one paper in its original question order. Newest first.</p></div><div class="exams">';
    EXAMS_NEWEST.forEach(function (e) {
      var qs = Q.filter(function (q) { return q.exams.some(function (x) { return x[0] === e.id; }); }), s = tally(qs);
      h += '<button class="exam" data-act="practice" data-src="' + e.id + '"><b>' + esc(e.name) + '</b><span>' + plural(qs.length, 'question') + ' · ' + s.right + ' right</span></button>';
    });
    var nv = Q.filter(function (q) { return q.kind === 'new'; }), ns = tally(nv);
    h += '<button class="exam" data-act="practice" data-src="new"><b>New variations</b><span>' + plural(nv.length, 'question') + ' · ' + ns.right + ' right</span></button></div></section>';

    if (P.mocks.length) {
      h += '<section><div class="section-head"><h2>Mock exam results</h2></div><div class="list">';
      P.mocks.slice(-5).reverse().forEach(function (m) {
        h += '<div class="trow" style="grid-template-columns:minmax(0,1fr) auto"><div class="name">' + m.score + ' of ' + m.total + ' correct<small>' + new Date(m.t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</small></div><div class="frac">' + fmtTime(m.secs) + ' used</div></div>';
      });
      h += '</div></section>';
    }
    return h;
  }

  function selectHTML(id, label, value, opts) {
