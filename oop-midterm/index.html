<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>OOP Midterm 2 Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one working column (max 960px) under a plain header with four tabs.
   Palette borrows the exam "blue book": cool paper, ink navy, cover blue. */
:root {
  --bg: #EEF2F7; --surface: #FFFFFF; --ink: #16233A; --muted: #56647C; --line: #D3DCE8;
  --accent: #2B5BB5; --accent-ink: #FFFFFF; --accent-soft: #E2EAF8;
  --good: #1B7A4B; --good-soft: #DFF2E7; --bad: #B3302A; --bad-soft: #FBE5E3;
  --warn: #8A5D00; --warn-soft: #FAEFD3;
  --code-bg: #F5F7FB; --tk-k: #7A3FB0; --tk-t: #17708C; --tk-s: #A3541B; --tk-c: #6A7890; --tk-n: #2B5BB5;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1522; --surface: #172133; --ink: #E6ECF5; --muted: #9BA9C0; --line: #2B3850;
    --accent: #82AAF6; --accent-ink: #0E1522; --accent-soft: #1F2E4C;
    --good: #5FCB95; --good-soft: #143427; --bad: #F18D83; --bad-soft: #3F1E1C;
    --warn: #E5B649; --warn-soft: #382E13;
    --code-bg: #101928; --tk-k: #C59CF2; --tk-t: #6CC7E0; --tk-s: #E8A970; --tk-c: #8493AB; --tk-n: #82AAF6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1522; --surface: #172133; --ink: #E6ECF5; --muted: #9BA9C0; --line: #2B3850;
  --accent: #82AAF6; --accent-ink: #0E1522; --accent-soft: #1F2E4C;
  --good: #5FCB95; --good-soft: #143427; --bad: #F18D83; --bad-soft: #3F1E1C;
  --warn: #E5B649; --warn-soft: #382E13;
  --code-bg: #101928; --tk-k: #C59CF2; --tk-t: #6CC7E0; --tk-s: #E8A970; --tk-c: #8493AB; --tk-n: #82AAF6;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 960px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { padding-block: 18px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 8px 12px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .count { font-size: 0.75rem; background: var(--bad-soft); color: var(--bad); border-radius: 999px; padding: 1px 7px; margin-left: 4px; font-weight: 600; }

main { padding-block: 24px 40px; display: flex; flex-direction: column; gap: 24px; }
.lead { color: var(--muted); max-width: 65ch; margin-top: 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: 0.85rem; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: 0.5; cursor: default; border-color: var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Overview */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { padding: 14px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v small { font-size: 0.9rem; font-weight: 500; color: var(--muted); }
.stat .l { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
.stat.good .v { color: var(--good); } .stat.bad .v { color: var(--bad); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head p { color: var(--muted); font-size: 0.85rem; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.trow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(90px, 1fr) 7.5em auto; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow .name { font-weight: 500; min-width: 0; }
.trow .name small { display: block; color: var(--muted); font-weight: 400; font-size: 0.8rem; }
.trow .frac { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.bar .r { background: var(--good); } .bar .w { background: var(--bad); }
@media (max-width: 620px) {
  .trow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
  .trow .bar { grid-column: 1; grid-row: 2; align-self: center; }
  .trow .frac { grid-column: 2; grid-row: 2; }
  .trow .btn { grid-column: 2; grid-row: 1; }
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.exams { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.exam { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.exam:hover { border-color: var(--accent); }
.exam b { font-family: var(--font-display); font-weight: 600; }
.exam span { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

/* Question card */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; min-width: 0; flex: 1 1 150px; }
.filters select { padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-transform: none; letter-spacing: 0; font-size: 0.92rem; min-width: 0; width: 100%; }
.progressline { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.76rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.hot { background: var(--accent); color: var(--accent-ink); }
.seen { font-size: 0.78rem; color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
.prompt { font-size: 1rem; max-width: 70ch; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 13px/1.5 var(--font-mono); tab-size: 4; }
pre.code .k { color: var(--tk-k); } pre.code .t { color: var(--tk-t); } pre.code .s { color: var(--tk-s); }
pre.code .c { color: var(--tk-c); } pre.code .n { color: var(--tk-n); }
pre.code .c.m { color: var(--accent); font-weight: 600; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.opts.compact { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.opt { width: 100%; display: grid; grid-template-columns: 1.5em minmax(0, 1fr) auto; gap: 8px; align-items: start; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .ltr { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt .txt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.opt.mono .txt { font-family: var(--font-mono); font-size: 0.86rem; }
.opt .tag { font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.opt[disabled] { cursor: default; color: inherit; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ltr { color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .ltr, .opt.right .tag { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ltr, .opt.wrong .tag { color: var(--bad); }
.opt.dim { opacity: 0.6; }
.fb { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.fb .verdict { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.fb .verdict.good { color: var(--good); } .fb .verdict.bad { color: var(--bad); }
.fb p { max-width: 72ch; }
.rule { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.rule b { display: block; font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.basis { font-size: 0.82rem; color: var(--muted); }
.kbd { font-size: 0.8rem; color: var(--muted); }
kbd { font: 0.78rem var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--code-bg); }
.empty { text-align: center; padding: 36px 18px; align-items: center; }
.big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

/* Mock exam */
.mockbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.mockbar .row { justify-content: space-between; }
.timer { font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 0.8rem var(--font-mono); padding: 0; }
.dot.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.review { display: flex; flex-direction: column; gap: 10px; }
details.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.rv summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; }
details.rv summary::-webkit-details-marker { display: none; }
details.rv summary .q { flex: 1 1 220px; min-width: 0; font-weight: 500; }
details.rv .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hist { font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Rules */
.rules { display: flex; flex-direction: column; gap: 20px; }
.rgroup ul { list-style: none; margin: 0; padding: 0; }
.rgroup li { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
.rgroup li:first-child { border-top: 0; }
.rgroup li p { max-width: 75ch; }

/* Free response */
.frq summary .q { font-family: var(--font-display); font-weight: 600; }
.frq .body h3 { margin-top: 6px; }
.spec { display: flex; flex-direction: column; gap: 8px; max-width: 80ch; }
.spec h4 { font-family: var(--font-display); font-size: 0.98rem; font-weight: 600; margin: 8px 0 0; }
.spec ul { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 4px; }
.spec li > ul { margin-top: 4px; }
.spec code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
.losses, .checks { margin: 0; padding: 12px 16px 12px 2.2em; display: flex; flex-direction: column; gap: 7px; }
.checks { padding: 0 0 0 1.25em; max-width: 80ch; }
.losses li { max-width: 85ch; }

textarea.ans { width: 100%; min-height: 340px; resize: vertical; font: 13px/1.5 var(--font-mono); tab-size: 4; color: var(--ink); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre; overflow: auto; }
textarea.ans:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fbbox { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fbbox:empty { display: none; }
.fbwait { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 0.9s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.fberr { color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; max-width: 80ch; }
.fbcard { border: 1px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fbcard p { max-width: 80ch; }
.fbhead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.fbhead .big small { font-size: 1rem; font-weight: 500; color: var(--muted); }
.fbhead .chips { margin-top: 4px; }
.fbitems, .fbbugs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.fbitems li { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px; align-items: start; }
.fbitems .chip { justify-self: start; white-space: nowrap; }
.fbitems .ri, .fbbugs .ri { color: var(--muted); font-size: 0.85rem; }
.fbbugs li { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.fbbugs li:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 520px) { .fbitems li { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

footer { border-top: 1px solid var(--line); padding-block: 16px 28px; color: var(--muted); font-size: 0.82rem; display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.3s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>OOP Midterm 2 Practice</b><span id="sub"></span></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>
  <main id="app"></main>
  <footer>
    <div id="sync"></div>
    <div id="resetbox"></div>
    <div id="about"></div>
  </footer>
</div>

<script>const DATA = {"topics":[{"id":"ptr","name":"Pointers & arrays"},{"id":"const","name":"const & pointers"},{"id":"ops","name":"Operator overloading"},{"id":"conv","name":"Implicit conversions"},{"id":"copy","name":"Copy control"},{"id":"order","name":"Constructor & destructor order"},{"id":"inh","name":"Inheritance rules"},{"id":"virt","name":"Virtual dispatch"},{"id":"abs","name":"Abstract classes"},{"id":"ovl","name":"Overload resolution + dispatch"},{"id":"trivia","name":"Extra credit"}],"exams":[{"id":"S2011","name":"Spring 2011","short":"Sp '11"},{"id":"S2012","name":"Spring 2012","short":"Sp '12"},{"id":"F2012","name":"Fall 2012","short":"Fa '12"},{"id":"S2013","name":"Spring 2013","short":"Sp '13"},{"id":"S2014","name":"Spring 2014","short":"Sp '14"},{"id":"F2014","name":"Fall 2014","short":"Fa '14"},{"id":"S2015","name":"Spring 2015","short":"Sp '15"},{"id":"F2017","name":"Fall 2017","short":"Fa '17"},{"id":"S2018","name":"Spring 2018","short":"Sp '18"},{"id":"F2018","name":"Fall 2018","short":"Fa '18"},{"id":"S2019","name":"Spring 2019","short":"Sp '19"},{"id":"S2020","name":"Spring 2020","short":"Sp '20"},{"id":"S2023","name":"Spring 2023","short":"Sp '23"},{"id":"F2023","name":"Fall 2023","short":"Fa '23"},{"id":"F2025","name":"Fall 2025","short":"Fa '25"}],"questions":[{"id":"ranged-for","topic":"ptr","kind":"adapted","basis":["key","run"],"mono":true,"exams":[["F2017",3],["S2015",3],["S2014",3],["F2012",3]],"prompt":"Given a vector of ints called intVec, which \"ranged for\" (foreach) loop doubles the value of every element in the vector?","options":["for (int item : intVec) { item *= 2; }","for (int& item : intVec) { item *= 2; }","for (const int& item : intVec) { item *= 2; }","for (int* item : intVec) { *item *= 2; }","for (int item : intVec) { intVec[item] *= 2; }"],"answer":1,"explain":"To modify the elements, the loop variable must be a reference to each one: int&. With plain int you double a copy and the vector is unchanged. const int& will not compile because you assign through it, and the elements are ints, not pointers.","rule":"A ranged for only changes the container if the loop variable is a non-const reference."},{"id":"addr-data5","topic":"ptr","kind":"exam","basis":["key","run"],"mono":true,"exams":[["F2018",4],["F2017",2],["S2015",4],["S2014",4],["F2012",5]],"prompt":"Given the line below, pick an expression that is equivalent to: &data[5]","code":"int* data = new int[12];","options":["data*5","&(data*5)","data+5","*data+5","*(data+5)","(data+5)*","&(data+5)","(data+5)&","&data+5","data+5&","data&+5"],"answer":2,"explain":"data[5] means *(data+5). Taking its address cancels the dereference, so &data[5] is data+5: a pointer to the sixth int. *(data+5) is the int itself, and &data+5 does arithmetic on the address of the pointer variable, which is something else entirely. Watch out: four other exams asked for data[5] without the &, and there the answer is *(data+5).","rule":"data[i] is *(data+i), so &data[i] is data+i."},{"id":"ptr-arith-14","topic":"ptr","kind":"adapted","basis":["key","run"],"exams":[["F2014",4]],"prompt":"Given the following code, what is the output?","code":"int main() {\n    int x = 6;\n    int* arr = new int[10];\n    for (int i = 0; i \u003c 10; ++i) {\n        arr[i] = 2*i;\n    }\n    int* p = arr + 1;\n    int* q = p + x;\n    cout \u003c\u003c \"A: \" \u003c\u003c *q \u003c\u003c endl;\n    *p = x;\n    p++;\n    cout \u003c\u003c \"B: \" \u003c\u003c *p \u003c\u003c endl;\n}","options":["A: 14\nB: 4","A: 12\nB: 4","A: 14\nB: 6","A: 12\nB: 6","A: 7\nB: 2","A: 14\nB: 2"],"answer":0,"explain":"The array holds 0, 2, 4, ... 18. p points at arr[1]. q = p + 6 points at arr[7], which is 14, so A prints 14. *p = x writes 6 into arr[1], but then p++ moves p to arr[2], which is still 4. So B prints 4. The student on this exam answered 7 and 2 by confusing indexes with values.","rule":"Adding n to a pointer moves it n elements. Track which index each pointer is on, then read the value there."},{"id":"ptr-arith-16","topic":"ptr","kind":"exam","basis":["key","run"],"exams":[["F2023",2]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"const int SIZE = 8;\nint main() {\n    int* arr = new int[SIZE];\n    for (int i = 0; i \u003c SIZE; i++) {\n        arr[i] = i*i;\n    }\n    int* p = arr + SIZE-4;\n    int* q = p + 2;\n    cout \u003c\u003c \"A: \" \u003c\u003c *p \u003c\u003c \", \";\n    cout \u003c\u003c \"B: \" \u003c\u003c q[-2] \u003c\u003c endl;\n}","options":["The program compiles, runs and outputs: A: 25, B: 9","The program compiles, runs and outputs: A: 16, B: 4","The program compiles, runs and outputs: A: 4, B: 16","The program compiles, runs and outputs: A: 16, B: 16","The program compiles, runs and outputs: A: 9, B: 16","The program compiles but has a run-time error","Compilation error","None of the above"],"answer":3,"explain":"The array holds the squares 0, 1, 4, 9, 16, 25, 36, 49. p = arr + 4 points at arr[4], which is 16. q is two elements further, at arr[6]. q[-2] means *(q - 2), which is arr[4] again: 16. Negative indexes are legal as long as you stay inside the array.","rule":"q[-2] is *(q-2). Indexing works on any pointer, in either direction."},{"id":"ptr-arith-new","topic":"ptr","kind":"new","basis":["run"],"exams":[],"prompt":"What is the output of the following program?","code":"int main() {\n    int* arr = new int[6];\n    for (int i = 0; i \u003c 6; ++i) {\n        arr[i] = 10 * i;\n    }\n    int* p = arr + 2;\n    int* q = &arr[5];\n    cout \u003c\u003c *(p + 1) \u003c\u003c ' ' \u003c\u003c q - p \u003c\u003c ' ' \u003c\u003c p[-1] \u003c\u003c endl;\n}","options":["30 3 10","21 3 10","30 30 10","30 3 20","20 3 10","Runtime error (or undefined behavior)"],"answer":0,"explain":"The array holds 0, 10, 20, 30, 40, 50. p is at index 2 and q is at index 5. *(p + 1) is arr[3] = 30. Subtracting two pointers gives the number of elements between them: 5 - 2 = 3. p[-1] is arr[1] = 10. Note *(p + 1) is not *p + 1, which would be 21.","rule":"Pointer minus pointer gives a count of elements. *(p+1) moves first, *p+1 adds to the value."},{"id":"data5-value","topic":"ptr","kind":"exam","basis":["key","run"],"mono":true,"exams":[["S2020",8],["S2018",4],["S2013",3],["S2012",10]],"prompt":"Given the line below, pick an expression that is equivalent to: data[5]   (read it carefully: there is no & in front)","code":"int* data = new int[12];","options":["data*5","&(data*5)","&data+5","*data+5","*(data+5)","(data+5)*","&(data+5)","(data+5)&","data+5","data+5&","data&+5"],"answer":4,"explain":"data[5] is the int itself, and indexing is defined as *(data+5): move five elements along, then dereference. data+5 is only the address, which is the answer to the other version of this question (&data[5]). Three different students picked the address answer here and lost the points. *data+5 is wrong too: it adds 5 to the first element.","rule":"data[i] is *(data+i) and &data[i] is data+i. Check which of the two the question is asking for."},{"id":"ptr-arith-18","topic":"ptr","kind":"exam","basis":["key","run"],"exams":[["S2023",2]],"prompt":"Given the code below, what is the result of compiling and running the code?","code":"const int SIZE = 10;\nint main() {\n    int* arr = new int[SIZE];\n    for (int i = 0; i \u003c SIZE; i++) {\n        arr[i] = 2*i;\n    }\n    int* p = arr + SIZE-2;\n    int* q = p - 4;\n    cout \u003c\u003c \"A: \" \u003c\u003c p[1] \u003c\u003c \", \";\n    cout \u003c\u003c \"B: \" \u003c\u003c *q \u003c\u003c endl;\n}","options":["The program compiles, runs and outputs: A: 16, B: 8","The program compiles, runs and outputs: A: 16, B: 12","The program compiles, runs and outputs: A: 18, B: 8","The program compiles, runs and outputs: A: 8, B: 6","The program compiles, runs and outputs: A: 9, B: 4","The program compiles but has a run-time error","Compilation error","None of the above"],"answer":2,"explain":"The array holds 0, 2, 4, ... 18. p = arr + 8 points at index 8. p[1] is one element further, index 9, which holds 18. q = p - 4 points at index 4, which holds 8. The trap answer A: 16 comes from printing *p instead of p[1].","rule":"Adding n to a pointer moves it n elements. Track which index each pointer is on, then read the value there."},{"id":"begin-end","topic":"ptr","kind":"adapted","basis":["run"],"mono":true,"exams":[["F2025",11]],"prompt":"We want the program below to print 2 3 4 5 6 without changing main. Which additions to Collection make that work?","code":"struct Collection {\n    vector\u003cint> val;\n};\n\n// Do not change main\nint main() {\n    Collection stuff;\n    for (int i = 1; i \u003c= 5; ++i) {\n        stuff.val.push_back(i);\n    }\n    for (int& val : stuff) {\n        val++;\n    }\n    for (int val : stuff) {\n        cout \u003c\u003c val \u003c\u003c ' ';\n    }\n    cout \u003c\u003c endl;\n}","options":["int* begin() { return &val[0]; }\nint* end() { return &val[0] + val.size(); }","int begin() { return val[0]; }\nint end() { return val[val.size() - 1]; }","int* begin() { return &val[0]; }\nint* end() { return &val[val.size() - 1]; }","int& operator[](size_t i) { return val[i]; }\nsize_t size() const { return val.size(); }","operator vector\u003cint>() const { return val; }"],"answer":0,"explain":"A ranged for over an object calls its begin() and end() methods and walks from one to the other with ++ and *. Returning int* works because the vector stores its ints in one block: begin points at the first element and end points one past the last. Option (c) stops one short: end points at the last element, so 5 is never incremented or printed. Options (d) and (e) do not give the loop a begin and end at all. On the Fall 2025 exam this was a short answer. The rubric took points off for begin and end returning the wrong thing, and for const versions that did not return const int*.","rule":"To use a class in a ranged for, give it begin() and end(). end() points one past the last element."},{"id":"const-ptr-init","topic":"const","kind":"exam","basis":["key","run"],"mono":true,"exams":[["S2015",5],["F2014",5],["S2014",5],["F2012",6]],"prompt":"Given the line below, which of the following will compile?","code":"const int x = 10;","options":["int* p = &x;","int* const q = &x;","const int* r = &x;","All of the above","None of the above"],"answer":2,"explain":"x is const, so only a pointer that promises not to modify what it points at may hold its address: const int*. In int* const q the const applies to the pointer itself (it cannot be re-aimed), but you could still write *q = 5, so the compiler rejects it. Fall 2014 asked the same thing with (b) and (c) swapped.","rule":"Read right to left. const int* p: cannot change the int. int* const p: cannot re-aim the pointer."},{"id":"const-param","topic":"const","kind":"exam","basis":["key","run"],"exams":[["F2017",4],["F2018",2]],"prompt":"What is the result of compiling and running the code below? (Only one answer.)","code":"void foo(int x) {\n    const int* p = &x;      // line A\n    x = 17;                 // line B\n    cout \u003c\u003c *p \u003c\u003c ' ';      // line C\n    *p = 28;                // line D\n}\n\nint main() {\n    int y = 42;\n    foo(y);\n    cout \u003c\u003c y \u003c\u003c endl;\n}","options":["The program will have a compilation error at line A","The program will have a compilation error at line B","The program will have a compilation error at line C","The program will have a compilation error at line D","The program will have a runtime error (or undefined behavior) at line D.","The program will print out: 17 17","The program will print out: 17 42","The program will print out: 42 17","The program will print out: 42 42","The program will print out: 17 28","The program will print out: 42 28","All of the above","None of the above."],"answer":3,"explain":"p is a pointer to const int, so writing through it (*p = 28) is a compile error at line D. Line A is fine: a pointer-to-const may point at a non-const int. Line B is fine: x itself is not const, only the view through p is. The student on the 2017 exam picked line B and lost the points. Fall 2018 repeated this with different numbers.","rule":"const int* p blocks writes through p only. The variable it points at can still change by its own name."},{"id":"const-ptr-const","topic":"const","kind":"exam","basis":["run"],"mono":true,"exams":[["F2023",7],["S2023",7]],"prompt":"Given the following function definition, which of the definitions for the local variable ptr will allow the function func to successfully compile?","code":"void func(const string* const str_ptr) {\n    // definition for the variable ptr goes here...\n\n    ptr = str_ptr;\n}","options":["string* ptr;         // option 1","string const ptr;    // option 2","string* const ptr;   // option 3","const string& ptr;   // option 4","const string* ptr;   // option 5","string ptr*;         // option 6","option 1 and option 3","option 3 and option 4","option 1 and option 5","None of the above"],"answer":4,"explain":"str_ptr is a const pointer to a const string. Copying its value into ptr needs two things. ptr must be assignable, so ptr itself cannot be const (rules out option 3, which also lacks an initializer) and cannot be a reference (option 4 must be initialized). And ptr must keep the promise not to modify the string, so it must be const string* (rules out option 1). Only option 5 works. The const on str_ptr itself does not matter when you copy from it. Spring 2023 asked the same question with the options renumbered, so const string* ptr was option 1 there. Both scanned students got it wrong. I confirmed by compiling all six definitions: only const string* ptr compiles.","rule":"Copying a pointer keeps the \"pointee is const\" part. The \"pointer itself is const\" part does not carry over."},{"id":"const-ptr-lines","topic":"const","kind":"new","basis":["run"],"exams":[],"prompt":"What is the result of compiling and running the following program?","code":"int main() {\n    int x = 5;\n    int y = 6;\n    int* const p = &x;     // Line A\n    *p = 7;                // Line B\n    p = &y;                // Line C\n    const int* q = &x;     // Line D\n    q = &y;                // Line E\n    cout \u003c\u003c x \u003c\u003c ' ' \u003c\u003c *q \u003c\u003c endl;\n}","options":["The program prints: 7 6","The program prints: 5 6","Compilation error at Line A","Compilation error at Line B","Compilation error at Line C","Compilation error at Line E"],"answer":4,"explain":"p is a const pointer to a non-const int. You may write through it (Line B is fine) but you may not re-aim it, so Line C fails. q is the opposite: a non-const pointer to const int, so re-aiming it at Line E is fine.","rule":"Read right to left. const int* p: cannot change the int. int* const p: cannot re-aim the pointer."},{"id":"constptr-param","topic":"const","kind":"exam","basis":["key","run"],"exams":[["F2025",2],["S2019",2],["S2018",2]],"prompt":"What is the result of building and running the following program?","code":"void foo(int x) {\n    int* const p = &x;      // line A\n    x = 28;                 // line B\n    cout \u003c\u003c *p \u003c\u003c ' ';      //\n    *p = 6;                 // line C\n}\n\nint main() {\n    int y = 42;\n    foo(y);\n    cout \u003c\u003c y \u003c\u003c endl;\n}","options":["The program will have a compilation error at line A","The program will have a compilation error at line B","The program will have a compilation error at line C","The program will have a runtime error (or undefined behavior) at line C.","The program will print out: 6 6","The program will print out: 6 28","The program will print out: 6 42","The program will print out: 28 6","The program will print out: 28 28","The program will print out: 28 42","The program will print out: 42 6","The program will print out: 42 28","The program will print out: 42 42","None of the above."],"answer":9,"explain":"Here the const is on the pointer (int* const), not on the int. So p can never be re-aimed, but writing through it at line C is legal and nothing fails to compile. x becomes 28, *p reads x, so 28 is printed. Then *p = 6 changes x. But x is a copy of y, because foo takes its parameter by value, so y in main is still 42. Output: 28 42. Compare with the fall version (const int* p), where the last line is a compile error. Spring 2018 and Spring 2019 used the same code with different numbers.","rule":"int* const p can write through p. And a by-value parameter is a copy, so nothing done to it reaches the caller."},{"id":"constref-param","topic":"const","kind":"exam","basis":["run"],"exams":[["S2020",2]],"prompt":"What is the result of compiling and running the code below? (Only one answer.)","code":"void Thing(const int& x) {\n    int* const p = &x;      // line A\n    int y = x;              // line B\n    cout \u003c\u003c *p \u003c\u003c ' ';      // line C\n    y = 28;                 // line D\n}\n\nint main() {\n    int y = 42;\n    Thing(y);\n    cout \u003c\u003c y \u003c\u003c endl;\n}","options":["The program will have a compilation error at line A","The program will have a compilation error at line B","The program will have a compilation error at line C","The program will have a compilation error at line D","The program will have a runtime error (or undefined behavior) at line D.","The program will print out: 17 17","The program will print out: 17 28","The program will print out: 17 42","The program will print out: 42 17","The program will print out: 42 28","The program will print out: 42 42","All of the above","None of the above."],"answer":0,"explain":"This time x is a const int&, so &x is a pointer to a const int. Line A tries to store that in int* const p. The const there only protects the pointer, and you could still write *p = 5, so the compiler rejects line A. It would need to be const int* p. Lines B and D are fine: y is an ordinary local copy. The Spring 2020 copy is a blank exam with no answer key, so this answer comes from compiling the code: the only error is on line A.","rule":"The address of something const can only go into a pointer-to-const (const int*). int* const does not qualify."},{"id":"const-true-2011","topic":"const","kind":"exam","basis":["key","run"],"mono":true,"exams":[["S2011",8]],"prompt":"Given the code below, which of the following is true?","code":"int theAnswer = 17;\nint* const p = &theAnswer;  // Line A","options":["Line A does not compile","*p = 42;  // Does not compile","int another = 42;\np = &another;  // Does not compile","None of the above"],"answer":2,"explain":"int* const p is a constant pointer to an ordinary int. You can change the int through it, so *p = 42 compiles. You cannot make p point somewhere else, so p = &another does not compile. Line A is fine because a const pointer is initialized on the spot.","rule":"Read right to left. const int* p: cannot change the int. int* const p: cannot re-aim the pointer."},{"id":"const-true-2012","topic":"const","kind":"exam","basis":["key","run"],"mono":true,"exams":[["S2012",2]],"prompt":"Given the code below, which of the following is true?","code":"int theAnswer = 17;\nconst int* p = &theAnswer;  // Line A","options":["Line A does not compile","*p = 42;  // Does not compile","int another = 42;\np = &another;  // Does not compile","None of the above"],"answer":1,"explain":"const int* p is a pointer to a const int. You cannot change the int through it, so *p = 42 does not compile. The pointer itself is not const, so re-aiming it at another variable is fine. Line A is fine too: a pointer-to-const may point at a non-const int. This is the mirror image of the Spring 2011 question, which used int* const.","rule":"Read right to left. const int* p: cannot change the int. int* const p: cannot re-aim the pointer."},{"id":"assign-call","topic":"ops","kind":"exam","basis":["key","run"],"mono":true,"exams":[["F2012",2],["S2014",2],["S2015",2]],"prompt":"Given a class called Thing and the code below, what function call is the last line equivalent to?","code":"Thing thingOne, thingTwo;\nthingTwo = thingOne;","options":["operator=(thingTwo, thingOne)","thingTwo.operator=(thingOne)","ostream& Thing::operator=(const Thing& rhs);","Neither (a) nor (b) because it is using the Thing copy constructor.","Neither (a) nor (b) because the operator has to be overridden as a friend","Either (a) or (b), depending on how the programmer chose to implement the operator.","None of the above"],"answer":1,"explain":"Both objects already exist, so this is assignment, not construction. The assignment operator can only be written as a member function, so the call is always thingTwo.operator=(thingOne). Option (f) is the trap: for most operators you may choose member or non-member, but not for operator=.","rule":"b = a on two existing objects is b.operator=(a). operator= must be a member."},{"id":"postinc","topic":"ops","kind":"exam","basis":["key","run"],"mono":true,"exams":[["S2023",6],["F2014",3]],"prompt":"Given the code below, what is the equivalent function call for the expression \"c++\" in the line marked \"THIS LINE\"?","code":"class MyClass {\npublic:\n    MyClass& operator++() {\n        re++;\n        return *this;\n    }\n\n    MyClass operator++(int dummy) {\n        MyClass old = *this;\n        re++;\n        return old;\n    }\n\n    void display() {\n        cout \u003c\u003c \"real: \" \u003c\u003c re \u003c\u003c \", imaginary: \" \u003c\u003c im \u003c\u003c endl;\n    }\n\nprivate:\n    int re=0, im=0;\n};\n\nint main() {\n    MyClass c;\n    c++;                    // THIS LINE\n    c.display();\n}","options":["operator++(c)","c.operator++()","c.operator++(0)","operator++(c,0)","all of the above","none of the above"],"answer":2,"explain":"Both operators are members of MyClass. The one with the int parameter is post-increment, and c++ calls it with a dummy 0: c.operator++(0). The version with no parameter, c.operator++(), is ++c. The Spring 2023 student got this wrong. Fall 2014 asked it as a short answer, and the grader wrote a.operator++(0).","rule":"Member forms: ++a is a.operator++(), a++ is a.operator++(0). The dummy int marks postfix."},{"id":"preinc","topic":"ops","kind":"exam","basis":["key","run"],"mono":true,"exams":[["F2023",6]],"prompt":"Given that the class MyClass defines the increment operators as members, what is the equivalent function call for the expression in the line marked \"THIS LINE\"?","code":"int main() {\n    MyClass c;\n    ++c;                // THIS LINE\n    c.display();\n}","options":["operator++(c)","c.operator++()","c.operator++(0)","operator++(c,0)","all of the above","none of the above"],"answer":1,"explain":"The operators are members, so the object is on the left of the dot. Pre-increment takes no argument: c.operator++(). The versions with 0 are post-increment, and the forms with c inside the parentheses are the non-member spellings.","rule":"Member forms: ++a is a.operator++(), a++ is a.operator++(0). The dummy int marks postfix."},{"id":"op-bool","topic":"ops","kind":"adapted","basis":["key","run"],"mono":true,"exams":[["F2012",9],["S2013",7],["S2014",8],["S2015",8]],"prompt":"What has to be added to the Integer class so that the following will correctly display \"myInt is positive\" when the value in myInt is positive?","code":"class Integer {\npublic:\n    Integer(int n) { val = n; }\nprivate:\n    int val;\n};\n\nint main() {\n    int n;\n    cin >> n;\n    Integer myInt(n);\n    if (myInt) cout \u003c\u003c \"myInt is positive\\n\";\n}","options":["operator bool() const { return val > 0; }","bool operator()() const { return val > 0; }","bool operator==(bool rhs) const { return val > 0; }","bool operator!() const { return val \u003c= 0; }","bool isPositive() const { return val > 0; }"],"answer":0,"explain":"if (myInt) needs the object converted to bool, which is what a conversion operator does. It has no return type in front (the name is the type) and should be const. The grader wrote: operator bool() const { return val > 0; }. operator() would need if (myInt()), and operator! only helps for if (!myInt).","rule":"if (obj) needs operator bool() const. No return type is written before it."},{"id":"ostream-call","topic":"ops","kind":"new","basis":["run"],"mono":true,"exams":[],"prompt":"Thing has an output operator, overloaded the usual way as a non-member function. What function call is the last line equivalent to?","code":"Thing t;\ncout \u003c\u003c t;","options":["cout.operator\u003c\u003c(t)","t.operator\u003c\u003c(cout)","operator\u003c\u003c(cout, t)","operator\u003c\u003c(t, cout)","Either (a) or (c), depending on how the programmer chose to implement the operator."],"answer":2,"explain":"A non-member binary operator takes both operands as arguments, left operand first: operator\u003c\u003c(cout, t). It cannot be a member of Thing because the left operand is the stream, and you cannot add members to ostream, so (a) is not a choice the programmer has.","rule":"Non-member binary operators are called as operator@(left, right). The output operator is always a non-member."},{"id":"assoc-tf","topic":"ops","kind":"exam","basis":["key"],"exams":[["S2011",3]],"prompt":"True or false: You cannot change the associativity of the less than operator when you overload it.","options":["True","False"],"answer":0,"explain":"True. Overloading an operator only supplies the function that runs. Precedence, associativity and the number of operands are fixed by the language and cannot be changed.","rule":"Overloading changes what an operator does, never its precedence, associativity or number of operands."},{"id":"eeyore","topic":"conv","kind":"adapted","basis":["key","run"],"mono":true,"exams":[["F2012",4]],"prompt":"Assume that the class Eeyore has been defined and that the + operator has been overloaded as a non-member function to add two Eeyores. Which other function is needed for the lines below to compile? You may not overload the + operator again.","code":"Eeyore e;\ne + 5;","options":["Eeyore(int);","explicit Eeyore(int);","Eeyore(const Eeyore&);","Eeyore& operator=(int);","friend ostream& operator\u003c\u003c(ostream&, const Eeyore&);"],"answer":0,"explain":"The only + available takes two Eeyores, so the compiler has to turn 5 into an Eeyore. A constructor that takes one int lets it do that automatically. Marking it explicit switches the automatic conversion off, so (b) would not compile. The grader wrote Eeyore(int) on the exam.","rule":"A constructor callable with one argument is an implicit conversion, unless it is marked explicit."},{"id":"orc","topic":"conv","kind":"adapted","basis":["key","run"],"mono":true,"exams":[["F2014",7]],"prompt":"Given the class declaration below (assume the functions are defined), which function can we add to the class so that the code at the bottom compiles, other than another overload of operator\u003c?","code":"class Orc {\npublic:\n    Orc();\n    Orc(int myStrength, int myBeauty);\n\n    int getStrength() const;\n    int getBeauty() const;\n    void display();\n\n    friend bool operator\u003c(const Orc& lhs, const Orc& rhs);\nprivate:\n    int strength;\n    int beauty;\n};\n\n// The code that must compile:\nOrc dabu(2, -3);\nif ( 3 \u003c dabu ) {\n    dabu.display();\n}","options":["Orc(int myStrength);","explicit Orc(int myStrength);","bool operator\u003c(int rhs) const;","Orc(const Orc& rhs);","Orc& operator=(int rhs);"],"answer":0,"explain":"3 \u003c dabu needs the 3 turned into an Orc so the existing operator\u003c(const Orc&, const Orc&) can be used. A one-int constructor does that. This works because operator\u003c is a non-member: both operands can be converted. Option (c) is another overload of operator\u003c, which the question rules out, and as a member it would only handle dabu \u003c 3 anyway, because the left operand of a member operator must already be an Orc.","rule":"Non-member operators allow conversion of the left operand. Member operators do not."},{"id":"foo-assign-string","topic":"conv","kind":"exam","basis":["key","run"],"exams":[["S2019",4],["F2017",11],["S2015",13]],"prompt":"What will be the result of compiling and running the program?","code":"class Foo {\npublic:\n    Foo(string s, int n = 0) { str = s; num = n; }\n    void display() { cout \u003c\u003c str \u003c\u003c ':' \u003c\u003c num \u003c\u003c endl; }\nprivate:\n    string str;\n    int num;\n};\n\nint main() {\n    Foo thingOne(\"abc\", 17);\n    string s = \"def\";\n    thingOne = s;\n    thingOne.display();\n}","options":["The program runs and prints: abc:0","The program runs and prints: def:0","The program runs and prints: abc:17","The program runs and prints: def:17","The program fails to compile","The program compiles and runs but doesn't print anything","The program compiles but crashes with no output","None of the above."],"answer":1,"explain":"There is no operator=(string), but the constructor can be called with just a string because n has a default. So the compiler builds a temporary Foo(s), which is (\"def\", 0), and assigns the whole temporary to thingOne. Both fields are replaced, so the old 17 is gone: def:0. The trap answer is def:17.","rule":"thing = value builds a whole new temporary object from value and replaces every field, defaults included."},{"id":"thing-assign-42","topic":"conv","kind":"exam","basis":["run"],"exams":[["F2023",10]],"prompt":"Given the following code, what is the result of compiling and running the program?","code":"class Thing {\npublic:\n    Thing(int val, int n = 0) : val(val), num(n) { }\n    void display() { cout \u003c\u003c val \u003c\u003c \", \" \u003c\u003c num \u003c\u003c endl; }\nprivate:\n    int val;\n    int num;\n};\n\nint main() {\n    Thing thingOne(6, 17);\n    thingOne = 42;\n    thingOne.display();\n}","options":["The program runs and outputs: 6, 17","The program runs and outputs: 6, 42","The program runs and outputs: 17, 6","The program runs and outputs: 17, 42","The program runs and outputs: 42, 6","The program runs and outputs: 42, 17","The program compiles but has a run-time error","Compilation error","None of the above"],"answer":8,"explain":"thingOne = 42 builds a temporary Thing(42), which is val 42 and num 0 from the default, then assigns it over thingOne. The output is \"42, 0\", which is not listed, so the answer is None of the above. This is the 2017 Foo question again with the right answer removed from the list. The student on this exam picked run-time error and lost the points. Compiled and run: it prints 42, 0.","rule":"thing = value builds a whole new temporary object from value and replaces every field, defaults included."},{"id":"explicit-thing","topic":"conv","kind":"new","basis":["run"],"exams":[],"prompt":"What is the result of compiling and running the program? (Note the one changed word compared with the Fall 2023 version.)","code":"class Thing {\npublic:\n    explicit Thing(int val, int n = 0) : val(val), num(n) { }\n    void display() { cout \u003c\u003c val \u003c\u003c \", \" \u003c\u003c num \u003c\u003c endl; }\nprivate:\n    int val;\n    int num;\n};\n\nint main() {\n    Thing thingOne(6, 17);\n    thingOne = 42;              // Line A\n    thingOne.display();\n}","options":["The program runs and outputs: 6, 17","The program runs and outputs: 42, 0","The program runs and outputs: 42, 17","Compilation error at Line A","The program compiles but has a run-time error"],"answer":3,"explain":"explicit forbids the compiler from using this constructor for automatic conversions. There is no operator=(int), and 42 can no longer be silently turned into a Thing, so Line A does not compile. Writing thingOne = Thing(42); would still work.","rule":"A constructor callable with one argument is an implicit conversion, unless it is marked explicit."},{"id":"vector-explicit","topic":"conv","kind":"adapted","basis":["key","run"],"exams":[["S2012",9],["S2011",9]],"prompt":"A student implements a vector class. Looking at his test code, he sees that the last line was a mistake, and is surprised that it compiled without an error. What is the best way he can fix his Vector class so that the last line will not compile?","code":"Vector v;\nfor (int i = 0; i \u003c 42; ++i) v.push_back(i);\nv = 17;   // Huh?","options":["Mark the constructor that takes an int as explicit.","Mark the constructor that takes an int as const.","Make the assignment operator virtual.","Add a destructor to the Vector class.","Make push_back a private method."],"answer":0,"explain":"The line compiled because Vector has a constructor that takes one int (the size). The compiler used it to turn 17 into a temporary Vector and then assigned that. Marking the constructor explicit switches off this automatic conversion, so v = 17 becomes an error while Vector v(17) still works. The Spring 2012 student wrote \"make the constructor explicit\" and got full marks.","rule":"A constructor callable with one argument is an implicit conversion, unless it is marked explicit."},{"id":"no-default-assign","topic":"conv","kind":"exam","basis":["key","run"],"exams":[["F2025",4],["S2020",4],["S2018",9]],"prompt":"What is the result of building and running the following program?","code":"class Foo {\npublic:\n    Foo(int n, string s) {\n        num = n;\n        str = s;\n    }\n    void display() { cout \u003c\u003c num \u003c\u003c ':' \u003c\u003c str \u003c\u003c endl; }\nprivate:\n    string str;\n    int num;\n};\n\nint main() {\n    Foo thingOne(17, \"abc\");        // Line A\n    thingOne = 42;                  // Line B\n    thingOne.display();             // Line C\n}","options":["The program runs and prints: 42:abc","The program runs and prints: 42:def","The program runs and prints: 17:abc","The program runs and prints: 17:def","The program fails to compile at line A","The program fails to compile at line B","The program fails to compile at line C","The program fails to compile somewhere else","The program compiles and runs but doesn't print anything","The program compiles but crashes with no output","None of the above."],"answer":5,"explain":"For thingOne = 42 to work, the compiler would have to build a Foo from the single value 42. But the constructor needs two arguments and the second has no default, so there is no one-argument constructor and no conversion. Line B does not compile. Compare with the older version of this question, where the constructor was Foo(string s, int n = 0): the default made the conversion possible and the answer was def:0. Spring 2018 and Spring 2020 asked this with thingOne = s on a string, with the same result: fails to compile.","rule":"thing = value only compiles if some constructor can be called with that one value. No default for the other parameters means no conversion."},{"id":"copy-init","topic":"copy","kind":"exam","basis":["run"],"mono":true,"exams":[["F2014",2],["S2012",4]],"prompt":"Given a class called Thing and the code below, what function call is the last line equivalent to?","code":"Thing thingOne;\nThing thingTwo = thingOne;","options":["operator=(thingTwo, thingOne)","thingTwo.operator=(thingOne)","ostream& Thing::operator=(const Thing& rhs);","Neither (a) nor (b) because it is using the Thing copy constructor.","Neither (a) nor (b) because the operator has to be overridden as a friend","Either (a) or (b), depending on how the programmer chose to implement the operator.","None of the above"],"answer":3,"explain":"thingTwo is being created on this line, so the = here is initialization, not assignment. That calls the copy constructor, the same as writing Thing thingTwo(thingOne). Compare with the Fall 2012 version, where both objects already existed and the answer was (b). Confirmed by running a Thing whose copy constructor and assignment operator each print their name.","rule":"A type name in front means construction: Thing b = a calls the copy constructor, not operator=."},{"id":"derived-copy-ctor","topic":"copy","kind":"adapted","basis":["run"],"mono":true,"exams":[["F2018",10],["S2011",11]],"prompt":"Given a class Base, and a class Derived that publicly inherits from Base and has an int member variable named foo (and nothing else). Which is a correct copy constructor for Derived?","options":["Derived(const Derived& rhs) : Base(rhs), foo(rhs.foo) {}","Derived(const Derived& rhs) : foo(rhs.foo) {}","Derived(const Derived& rhs) { Base(rhs); foo = rhs.foo; }","Derived(Derived rhs) : Base(rhs), foo(rhs.foo) {}","Derived(const Derived& rhs) : Base(), foo(rhs.foo) {}"],"answer":0,"explain":"The Base part has to be copied too, and the only place to do that is the initialization list: Base(rhs). Passing a Derived where a const Base& is expected is fine. Options (b) and (e) compile but run the Base default constructor, so the Base part is not a copy. Option (d) takes its parameter by value, which is not allowed for a copy constructor. Option (c) does not call the Base copy constructor on this object. On the 2023 exam the free-response rubric took off 5 points for exactly this: \"Call base class copy constructor in initialization list - missing or incorrect\".","rule":"Derived copy constructor: put Base(rhs) in the initialization list, or the Base part is default-constructed."},{"id":"derived-assign","topic":"copy","kind":"adapted","basis":["run"],"mono":true,"exams":[["F2018",10]],"prompt":"Same setup: Derived publicly inherits from Base and has one int member named foo. Which is a correct assignment operator for Derived?","options":["Derived& operator=(const Derived& rhs) {\n    if (this != &rhs) {\n        Base::operator=(rhs);\n        foo = rhs.foo;\n    }\n    return *this;\n}","Derived& operator=(const Derived& rhs) {\n    foo = rhs.foo;\n    return *this;\n}","Derived& operator=(const Derived& rhs) : Base(rhs) {\n    foo = rhs.foo;\n    return *this;\n}","Derived& operator=(const Derived& rhs) {\n    *this = rhs;\n    foo = rhs.foo;\n    return *this;\n}","void operator=(const Derived& rhs) {\n    Base = rhs;\n    foo = rhs.foo;\n}"],"answer":0,"explain":"An assignment operator is an ordinary member function, so there is no initialization list. You assign the Base part by calling the Base assignment operator by name: Base::operator=(rhs). Then copy your own members and return *this. Option (b) forgets the Base part. Option (c) uses an initialization list, which only constructors have. Option (d) calls itself forever. The student on the 2018 exam wrote the Base::operator=(rhs) version.","rule":"Derived assignment: call Base::operator=(rhs) in the body, copy your members, return *this."},{"id":"virtual-dtor","topic":"copy","kind":"adapted","basis":["key"],"exams":[["F2018",10]],"prompt":"Derived publicly inherits from Base. Given the code below, what is necessary for the Derived destructor to be called?","code":"Base* bp = new Derived();\ndelete bp;","options":["The Base destructor must be marked virtual.","The Derived destructor must be marked virtual. Base does not matter.","The Derived destructor must call ~Base() explicitly.","Nothing. delete always runs the destructor of the object that was actually created.","Base must have at least one pure virtual method."],"answer":0,"explain":"delete bp picks the destructor the same way a method call does. The pointer type is Base*, so unless ~Base() is virtual the compiler runs only the Base destructor and the Derived part is never cleaned up. Marking it virtual in Base makes the choice at run time, based on the real object. The grader accepted this answer on the 2018 exam.","rule":"Deleting through a Base* only runs ~Derived() if the Base destructor is virtual."},{"id":"copy-init-none","topic":"copy","kind":"exam","basis":["key","run"],"mono":true,"exams":[["S2013",2],["S2011",4]],"prompt":"Given a class called Thing and the code below, what function call is the last line equivalent to?","code":"Thing thingOne;\nThing thingTwo = thingOne;","options":["operator=(thingTwo, thingOne)","thingTwo.operator=(thingOne)","Either (a) or (b), depending on how the programmer chose to implement the operator.","Neither (a) nor (b) because the operator has to be overridden as a friend","ostream& Thing::operator=(const Thing& rhs);","None of the above"],"answer":5,"explain":"thingTwo is being created on this line, so this is the copy constructor, not assignment. In this version of the question no option mentions the copy constructor, so the answer is None of the above. The student on the Spring 2013 exam picked thingTwo.operator=(thingOne) and lost the points, and the Spring 2011 student picked \"Either\" and lost them too.","rule":"A type name in front means construction: Thing b = a calls the copy constructor, not operator=."},{"id":"dtor-nonvirtual","topic":"copy","kind":"exam","basis":["key","run"],"exams":[["S2015",12],["S2011",7]],"prompt":"What will be the result of compiling and running the program?","code":"class Base { };  // Yes, the base class is empty. :-)\n\nclass Derived : public Base {\npublic:\n    ~Derived() { cout \u003c\u003c \"~Derived\\n\"; }\n};\n\nint main() {\n    Base* bp = new Derived;\n    delete bp;\n}","options":["The program prints out:\n~Base\n~Derived","The program prints out:\n~Derived\n~Base","The program prints out:\n~Base","The program prints out:\n~Derived","The program fails to compile","The program compiles and runs but doesn't print anything","The program compiles but crashes with no output","None of the above."],"answer":5,"explain":"bp is a Base*, and Base has no virtual destructor. So delete bp runs only the Base destructor, which is the automatic one and prints nothing. ~Derived is never called. The Spring 2015 student picked \"~Derived\" and lost the points, and the grader circled \"doesn't print anything\". Spring 2011 asked the same thing with the answer \"The program runs and prints nothing\". (Strictly, the C++ standard calls this undefined behavior, but the exam answer is that nothing prints, and that is what g++ does.)","rule":"Deleting through a Base* only runs ~Derived() if the Base destructor is virtual."},{"id":"ctor-123","topic":"order","kind":"exam","basis":["key","run"],"exams":[["S2014",7],["F2012",8]],"prompt":"What is the output?","code":"class Member {\npublic:\n    Member() {cout \u003c\u003c 1;}\n};\n\nclass Base {\npublic:\n    Base() {cout \u003c\u003c 2;}\n    Member member;\n};\n\nclass Derived : public Base {\npublic:\n    Derived() {cout \u003c\u003c 3;}\n};\n\nint main() {\n    Derived der;\n}","options":["123","132","213","231","312","321","Fails to compile","Runtime error (or undefined behavior)"],"answer":0,"explain":"Building a Derived starts with its Base part. Building the Base part starts with its member variables, so Member prints 1, then the Base constructor body prints 2. Only then does the Derived body print 3. Here the Member lives inside Base. Compare with the 2017 and 2018 version, where the Member is inside Derived and the order changes.","rule":"Construction order for any class: its base, then its own member variables, then its own constructor body."},{"id":"copy-136","topic":"order","kind":"exam","basis":["key","run"],"exams":[["F2014",6]],"prompt":"What is the output between lines A and B? (i.e. what numbers are printed?)","code":"class Base {\npublic:\n    Base() { cout \u003c\u003c \"1\"; }\n    Base(const Base& rhs) { cout \u003c\u003c \"2\"; }\n};\n\nclass Member {\npublic:\n    Member() { cout \u003c\u003c \"3\"; }\n    Member(const Member& rhs) {cout \u003c\u003c \"4\";}\n};\n\nclass Derived : public Base {\npublic:\n    Derived() {cout \u003c\u003c \"5\";}\n    Derived(const Derived& rhs) {cout \u003c\u003c \"6\";}\nprivate:\n    Member member;\n};\n\nint main() {\n    Derived der;\n    cout \u003c\u003c \"\\nLine A\\n\";  // Line A\n    Derived der2(der);\n    cout \u003c\u003c \"\\nLine B\\n\";  // Line B\n}","options":["135","136","146","153","163","164","235","236","246","253","263","264","351","361","362","462","632","None of the above"],"answer":1,"explain":"Between the lines, der2 is built with the Derived copy constructor. That copy constructor has no initialization list, so the Base part and the member are built with their default constructors, not their copy constructors: Base() prints 1, Member() prints 3, then the body prints 6. The tempting answer is 246, which is what you would get only if the copy constructor said : Base(rhs), member(rhs.member).","rule":"A copy constructor you write yourself copies nothing automatically. Without an initialization list, base and members are default-constructed."},{"id":"copy-246","topic":"order","kind":"new","basis":["run"],"exams":[],"prompt":"Same classes as the Fall 2014 question, with one change to the Derived copy constructor. What is printed between lines A and B?","code":"class Base {\npublic:\n    Base() { cout \u003c\u003c \"1\"; }\n    Base(const Base& rhs) { cout \u003c\u003c \"2\"; }\n};\n\nclass Member {\npublic:\n    Member() { cout \u003c\u003c \"3\"; }\n    Member(const Member& rhs) {cout \u003c\u003c \"4\";}\n};\n\nclass Derived : public Base {\npublic:\n    Derived() {cout \u003c\u003c \"5\";}\n    Derived(const Derived& rhs) : Base(rhs), member(rhs.member) {cout \u003c\u003c \"6\";}\nprivate:\n    Member member;\n};\n\nint main() {\n    Derived der;\n    cout \u003c\u003c \"\\nLine A\\n\";  // Line A\n    Derived der2(der);\n    cout \u003c\u003c \"\\nLine B\\n\";  // Line B\n}","options":["136","146","236","246","264","426"],"answer":3,"explain":"Now the initialization list asks for the copy constructors: Base(rhs) prints 2, member(rhs.member) prints 4, then the body prints 6. The order is still base, then members, then body, whatever order the list is written in.","rule":"The initialization list chooses which constructor runs for the base and members. It never changes the order."},{"id":"ctor-dtor-315624","topic":"order","kind":"exam","basis":["key","run"],"exams":[["F2018",9],["F2017",12],["S2015",7]],"prompt":"What is the output?","code":"class Member {\npublic:\n    Member()  {cout \u003c\u003c 1;}\n    ~Member() {cout \u003c\u003c 2;}\n};\n\nclass Base {\npublic:\n    Base()  {cout \u003c\u003c 3;}\n    ~Base() {cout \u003c\u003c 4;}\n};\n\nclass Derived : public Base {\n    Member member;\npublic:\n    Derived()  {cout \u003c\u003c 5;}\n    ~Derived() {cout \u003c\u003c 6;}\n};\n\nint main() {\n    Derived der;\n}","options":["135246","135642","153264","153462","315426","315624","351462","351264","513624","513426","531642","531246","Fails to compile","Runtime error (or undefined behavior)","None of the above"],"answer":5,"explain":"Construction: Base first (3), then the member variable (1), then the Derived body (5). When main ends, destruction runs in exactly the reverse order: Derived body (6), member (2), Base (4). Together: 315624. This identical question was on both the 2017 and 2018 exams.","rule":"Destruction is construction in reverse: own destructor body, then members, then base."},{"id":"virtual-dtor-order","topic":"order","kind":"new","basis":["run"],"exams":[],"prompt":"What is the output?","code":"class Base {\npublic:\n    Base() { cout \u003c\u003c 1; }\n    virtual ~Base() { cout \u003c\u003c 2; }\n};\n\nclass Derived : public Base {\npublic:\n    Derived() { cout \u003c\u003c 3; }\n    ~Derived() { cout \u003c\u003c 4; }\n};\n\nint main() {\n    Base* bp = new Derived();\n    delete bp;\n}","options":["1324","1342","3142","132","1234","Fails to compile"],"answer":1,"explain":"new Derived() builds the Base part (1) then runs the Derived body (3). Because ~Base() is virtual, delete bp starts with the Derived destructor (4) and then runs the Base destructor (2). Without the virtual keyword the Derived destructor would not be called through a Base*.","rule":"Deleting through a Base* only runs ~Derived() if the Base destructor is virtual."},{"id":"init-list-tf","topic":"order","kind":"exam","basis":["key"],"exams":[["S2011",2]],"prompt":"True or false: The data members in the initialization list are initialized after the body of a constructor begins executing.","options":["True","False"],"answer":1,"explain":"False. Everything in the initialization list, plus the base class and any members not mentioned, is constructed before the first line of the constructor body runs. By the time the body starts, every member already exists.","rule":"Construction order for any class: its base, then its own member variables, then its own constructor body."},{"id":"member-init","topic":"order","kind":"adapted","basis":["key"],"exams":[["S2012",3]],"prompt":"How are the member variables of thing initialized? Assume Foo and Bar have all necessary methods and constructors.","code":"class SomeClass {\npublic:\n    SomeClass() {}\nprivate:\n    int a;\n    Foo b;\n    Bar* c;\n};\n\nint main() {\n    SomeClass thing;\n}","options":["a: not initialized\nb: by Foo's default constructor\nc: not initialized","a: set to 0\nb: by Foo's default constructor\nc: set to nullptr","a: not initialized\nb: not initialized\nc: not initialized","a: set to 0\nb: not initialized\nc: set to nullptr","a: not initialized\nb: by Foo's default constructor\nc: by Bar's default constructor"],"answer":0,"explain":"The constructor has no initialization list, so each member gets default treatment. For a class type like Foo that means its default constructor runs. Built-in types get nothing: the int holds garbage and the pointer points nowhere in particular. c is only a pointer, so no Bar is created. The grader ticked \"NOT\" for a and c and \"Foo's default constructor\" for b.","rule":"With no initialization list, class-type members are default-constructed and built-in members (ints, pointers) are left uninitialized."},{"id":"ctor-213","topic":"order","kind":"exam","basis":["key","run"],"exams":[["S2012",12]],"prompt":"What is the output?","code":"class Member {\npublic:\n    Member() {cout \u003c\u003c 1;}\n};\n\nclass Base {\npublic:\n    Base() {cout \u003c\u003c 2;}\n};\n\nclass Derived : public Base {\npublic:\n    Derived() {cout \u003c\u003c 3;}\n    Member member;\n};\n\nint main() {\n    Derived der;\n}","options":["123","132","213","231","312","321","Fails to compile","Runtime error (or undefined behavior)"],"answer":2,"explain":"The Member is inside Derived this time. Building a Derived: the Base part first (2), then Derived's own member variables (1), then the Derived constructor body (3). So 213. The fall version of this question puts the Member inside Base, which gives 123. The student on this exam answered 231 and lost the points: the body always comes last, after the members.","rule":"Construction order for any class: its base, then its own member variables, then its own constructor body."},{"id":"ctor-2314","topic":"order","kind":"exam","basis":["key","run"],"exams":[["S2013",6]],"prompt":"What is the output?","code":"class MemberA {\npublic:\n    MemberA() {cout \u003c\u003c 1;}\n};\n\nclass MemberB {\npublic:\n    MemberB() {cout \u003c\u003c 2;}\n};\n\nclass Base {\npublic:\n    Base() {cout \u003c\u003c 3;}\n    MemberB member;\n};\n\nclass Derived : public Base {\npublic:\n    Derived() {cout \u003c\u003c 4;}\n    MemberA member;\n};\n\nint main() {\n    Derived der;\n}","options":["1234","1243","1324","1342","1423","1432","2134","2143","2314","2341","2413","2431","3124","3142","3214","3241","3412","3421","4123","4132","4213","4231","4312","None of the above"],"answer":8,"explain":"Apply the same rule at each level. The Base part is built first: its member (MemberB prints 2), then the Base body (3). Then the Derived level: its member (MemberA prints 1), then the Derived body (4). Result: 2314.","rule":"Construction order for any class: its base, then its own member variables, then its own constructor body."},{"id":"ctor-dtor-135642","topic":"order","kind":"exam","basis":["key","run"],"exams":[["S2020",11],["S2019",11],["S2018",10]],"prompt":"What is the output?","code":"class Member {\npublic:\n    Member()  {cout \u003c\u003c 1;}\n    ~Member() {cout \u003c\u003c 2;}\n};\n\nclass Base {\n    Member member;\npublic:\n    Base()  {cout \u003c\u003c 3;}\n    ~Base() {cout \u003c\u003c 4;}\n};\n\nclass Derived : public Base {\npublic:\n    Derived()  {cout \u003c\u003c 5;}\n    ~Derived() {cout \u003c\u003c 6;}\n};\n\nint main() {\n    Derived der;\n}","options":["135246","135642","153264","153462","315426","315624","351462","351264","513624","513426","531642","531246","Fails to compile","Runtime error (or undefined behavior)","None of the above"],"answer":1,"explain":"Look where the Member is declared: inside Base. So construction is the Base's member (1), the Base body (3), then the Derived body (5). Destruction is the exact reverse: 6, 4, 2. Together 135642. The fall exams put the Member inside Derived instead, which gives 315624. Spring 2019 and Spring 2020 printed letters instead of digits (answer acefdb), but it is the same question.","rule":"Destruction is construction in reverse: own destructor body, then members, then base."},{"id":"dtor-aceb","topic":"order","kind":"exam","basis":["key","run"],"exams":[["S2023",5]],"prompt":"Given the code below, what will be output by compiling and executing the code?","code":"class Parent {\npublic:\n    Parent()  { cout \u003c\u003c \"A \"; }\n    ~Parent() { cout \u003c\u003c \"B \"; }\n};\n\nclass Child : public Parent {\npublic:\n    Child()  { cout \u003c\u003c \"C \"; }\n    ~Child() { cout \u003c\u003c \"D \"; }\n};\n\nclass GrandChild : public Child {\npublic:\n    GrandChild()  { cout \u003c\u003c \"E \"; }\n    ~GrandChild() { cout \u003c\u003c \"F \"; }\n};\n\nint main() {\n    Parent* ptr = new GrandChild();\n    delete ptr;\n}","options":["A C E F D B","A C E D B","E C A B","The program fails to compile.","The program compiles and outputs nothing when executed.","E C A B D F","A C E B","E C A D F","None of the above"],"answer":6,"explain":"Construction always runs base first: A, C, E. The delete goes through a Parent*, and ~Parent is not virtual, so only the Parent destructor runs: B. The Child and GrandChild destructors are skipped. Output: A C E B. If ~Parent were virtual it would be A C E F D B. The Gradescope rubric confirms A C E B.","rule":"Deleting through a Base* only runs ~Derived() if the Base destructor is virtual."},{"id":"byvalue-copy","topic":"order","kind":"exam","basis":["key","run"],"exams":[["F2025",9]],"prompt":"What will be the result of building and running the following program?","code":"class Member {\npublic:\n    Member() { cout \u003c\u003c \"Member()\\n\"; }\n    Member(const Member& rhs) { cout \u003c\u003c \"Member(Member)\\n\"; } // Line A\n    ~Member() { cout \u003c\u003c \"~Member\\n\"; }\n};\nclass Thing {\npublic:\n    Thing() { cout \u003c\u003c \"Thing()\\n\"; }\n    Thing(const Thing& rhs) { cout \u003c\u003c \"Thing(Thing)\\n\"; }    // Line B\n    ~Thing() { cout \u003c\u003c \"~Thing\\n\"; }\nprivate:\n    Member mem;\n};\nvoid doNothing(Thing another) {}\nint main() {\n    Thing one;                                               // Line C\n    cout \u003c\u003c \"---\\n\";\n    doNothing(one);\n    cout \u003c\u003c \"---\\n\";\n}","options":["Member()\nThing()\n---\nMember(Member)\nThing(Thing)\n~Thing\n~Member\n---\n~Thing\n~Member","Member()\nThing()\n---\nMember()\nThing(Thing)\n~Member\n~Thing\n---\n~Member\n~Thing","Member()\nThing()\n---\nMember()\nThing(Thing)\n~Thing\n~Member\n---\n~Thing\n~Member","Compilation error at line A","Compilation error at line B","Compilation error at line C","None of the above"],"answer":2,"explain":"Three rules stacked together. Passing one by value calls the Thing copy constructor. That copy constructor has no initialization list, so its member is built with the Member default constructor, printing Member() and not Member(Member). When doNothing returns, the copy is destroyed: the Thing destructor body first, then its member, so ~Thing then ~Member. The same pair prints again when one dies at the end of main. The rubric confirms: Member, Thing(Thing), ~Thing, ~Member.","rule":"Pass by value calls the copy constructor. A hand-written copy constructor default-constructs its members unless the initialization list says otherwise."},{"id":"room-suite","topic":"order","kind":"exam","basis":["run"],"exams":[["S2023",10]],"prompt":"Given the following code, what is the result of compiling and running the program?","code":"class Room {\npublic:\n    Room(double size) : size(200) {\n        cout \u003c\u003c \"Room size: \" \u003c\u003c size \u003c\u003c \" \";\n    }\nprivate:\n    double size;\n};\nclass Suite {\npublic:\n    Suite(double size) : size(400) {\n        cout \u003c\u003c \"Suite size: \" \u003c\u003c size \u003c\u003c \" \";\n    }\nprivate:\n    double size;\n};\n\nclass Hotel {\npublic:\n    Hotel() : suite(700), room(350) {}      // Line 1\nprivate:\n    Room room;                              // Line 2\n    Suite suite;\n};\n\nint main() {\n    Hotel hotel;                            // Line 3\n}","options":["The program runs and outputs: Suite size: 750 Room size: 350","The program runs and outputs: Suite size: 400 Room size: 200","The program runs and outputs: Room size: 350 Suite size: 700","The program runs and outputs: Room size: 200 Suite size: 400","The program compiles but has a run-time error","Any other compilation error","None of the above"],"answer":2,"explain":"Two traps. First, members are constructed in the order they are declared in the class (room, then suite), not the order written in the initialization list. So Room prints first. Second, inside each constructor the name size means the parameter, because a parameter hides a member with the same name. The member is set to 200, but the cout prints the parameter, 350. Same for Suite: 700. Output: Room size: 350 Suite size: 700. The scanned student got this wrong and the rubric does not show the right answer, so this one comes from compiling and running the code.","rule":"Members are constructed in declaration order, whatever order the initialization list is written in. A parameter hides a member with the same name."},{"id":"name-hiding","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2015",6],["S2014",6],["S2013",4],["F2012",7]],"prompt":"What is the output of the following program?","code":"class Base {\npublic:\n    void foo(int n) { cout \u003c\u003c \"Base::foo(int)\\n\"; }\n};\nclass Derived: public Base {\npublic:\n    void foo(double n) { cout \u003c\u003c \"Derived::foo(double)\\n\"; }\n};\n\nint main() {\n    Derived der;\n    der.foo(42);\n}","options":["Base::foo(int)","Derived::foo(double)","The program does not compile","The program does not generate any output.","None of the above"],"answer":1,"explain":"The compiler looks up the name foo starting in Derived. It finds one there and stops looking, so Base::foo(int) is hidden, even though it would be a better match for 42. With only foo(double) to choose from, 42 is converted to a double. The student on this exam picked \"None of the above\" and lost the points.","rule":"A function in the derived class hides every base-class function with the same name, whatever their parameters."},{"id":"hiding-noargs","topic":"inh","kind":"new","basis":["run"],"exams":[],"prompt":"What is the result of compiling and running the following program?","code":"class Base {\npublic:\n    void foo(int n) { cout \u003c\u003c \"Base::foo(int)\\n\"; }\n};\nclass Derived : public Base {\npublic:\n    void foo() { cout \u003c\u003c \"Derived::foo()\\n\"; }\n};\n\nint main() {\n    Derived der;\n    der.foo(42);\n}","options":["The program prints: Base::foo(int)","The program prints: Derived::foo()","The program does not compile","The program compiles and prints nothing","None of the above"],"answer":2,"explain":"Same hiding rule as the 2012 question, but this time the only visible foo takes no arguments. Derived::foo() hides Base::foo(int), and 42 cannot be passed to a function with no parameters, so the call does not compile. The compiler does not fall back to the base class.","rule":"A function in the derived class hides every base-class function with the same name, whatever their parameters."},{"id":"sibling-cast","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["S2014",9],["S2013",8],["F2012",10]],"prompt":"What is the result of compiling and running the following program?","code":"class Base {};\nclass Derived : public Base {\npublic:\n    void method() { cout \u003c\u003c \"method1\\n\"; }\n};\nclass Derived2 : public Base {\npublic:\n    void method() { cout \u003c\u003c \"method2\\n\"; }\n};\n\nint main() {\n    Base* bp = new Derived();\n    Derived2* d2p = bp;\n    d2p->method();\n}","options":["The program compiles and runs, printing \"method1\"","The program compiles and runs, printing \"method2\"","The program compiles and runs to completion without printing anything.","The program compiles and crashes when it runs.","The program does not compile.","None of the above."],"answer":4,"explain":"A derived pointer converts to a base pointer automatically, but never the other way round. Derived2* d2p = bp tries to turn a Base* into a Derived2*, and the compiler refuses. It does not matter what the pointer really points at. The student on this exam picked \"method1\" and lost the points.","rule":"Derived* to Base* is automatic. Base* to Derived* never compiles without a cast."},{"id":"pet-cat","topic":"inh","kind":"exam","basis":["key","run"],"exams":[["F2025",7],["S2020",6],["F2018",5],["F2017",6],["S2015",9]],"prompt":"What is the result of compiling and running the following program?","code":"class Pet {\npublic:\n    virtual void eat() { cout \u003c\u003c \"Pet::eat\\n\"; }\n};\n\nclass Cat : public Pet {\npublic:\n    void eat() { cout \u003c\u003c \"Cat::eat\\n\"; }\n};\n\nint main() {\n    Pet* petP = new Cat();      // Line A\n    Cat* catP = petP;           // Line B\n    petP->eat();                // Line C\n}","options":["The program compiles and r
